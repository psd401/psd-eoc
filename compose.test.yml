services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: psd_eoc_test
      POSTGRES_PASSWORD: synthetic_test_password
      POSTGRES_USER: psd_eoc_test
    ports:
      - '127.0.0.1::5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U psd_eoc_test -d psd_eoc_test']
      interval: 2s
      timeout: 5s
      retries: 15
