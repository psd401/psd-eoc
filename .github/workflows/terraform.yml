name: Terraform

# Plans infra/terraform/stateful on main and applies that saved plan from the
# `production` environment once a reviewer approves (psd-dev-standards 08 PR
# flow 3-4). The roles, state bucket and key come from
# infra/terraform/state-bootstrap, applied once by a person.
#
# No pull request gets AWS credentials. A pull request can rewrite this file,
# and the stateful state holds the partner app-client secret, so a plan on a
# pull request would let any branch read that secret and send it anywhere.
# Pull requests get the credential-free `bun run verify:terraform` in the gate;
# the reviewer reads the real plan in the main run's summary and log before
# approving its apply.
#
# This repository is public, so every log, summary and artifact is public too.
# Tenant values arrive only as repository secrets and are masked in the logs
# value by value (.github/scripts/terraform-tenant.sh). Identifiers AWS assigns
# at apply time (pool, client and key ids, ARNs once the account id is masked)
# are not secrets and do print. The summary lists resource addresses and
# actions, never values, and the saved plan is encrypted before upload.
on:
  push:
    branches: [main]
    paths:
      - infra/terraform/stateful/**
      - .github/workflows/terraform.yml
      - .github/scripts/terraform-*.sh
  # Applies the current main without a code change, for example the first
  # apply after the bootstrap and the repository secrets exist.
  workflow_dispatch:

permissions:
  contents: read

# Runs queue rather than overlap, so each plans from the state the previous one
# left and its saved plan is never stale (08 PR flow 4).
concurrency:
  group: terraform-stateful
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  ROOT: infra/terraform/stateful

jobs:
  plan:
    name: terraform plan (stateful)
    # A dispatch from any branch but main would plan code that was never
    # reviewed, and the plan role trusts only main anyway.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write tenant configuration
        env:
          BACKEND_HCL: ${{ secrets.TERRAFORM_STATEFUL_BACKEND_HCL }}
          TFVARS: ${{ secrets.TERRAFORM_STATEFUL_TFVARS }}
        run: bash .github/scripts/terraform-tenant.sh "$RUNNER_TEMP"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false

      # Read-only, and trusted only from main (state-bootstrap roles.tf). It
      # cannot write the state lock,
      # so it plans without one; the apply takes the lock, and Terraform
      # refuses a saved plan whose state has since changed.
      - name: Assume the plan role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.STATE_REGION }}

      - name: Plan
        id: plan
        working-directory: ${{ env.ROOT }}
        run: |
          terraform init -no-color -backend-config="$RUNNER_TEMP/backend.hcl"
          # -detailed-exitcode: 0 is no changes, 2 is changes, anything else fails.
          code=0
          terraform plan -no-color -lock=false -detailed-exitcode \
            -var-file="$RUNNER_TEMP/stateful.tfvars" -out=tfplan || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          echo "changes=$([ "$code" -eq 2 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"

      # Addresses and actions only, for the reviewer who approves the apply.
      # The full plan is in this job's masked log.
      - name: Plan summary
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/terraform-plan-summary.sh "$RUNNER_TEMP/plan.json" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"

      # A saved plan holds tenant values and the partner client secret, and a
      # public repository's artifacts can be downloaded by anyone signed in to
      # GitHub, so it is encrypted with a passphrase only this repository's
      # secrets hold.
      - name: Encrypt the plan for the apply
        if: steps.plan.outputs.changes == 'true'
        working-directory: ${{ env.ROOT }}
        env:
          PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::TERRAFORM_PLAN_PASSPHRASE is not set for this repository."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/tfplan.gpg" tfplan <<< "$PASSPHRASE"

      - name: Keep the encrypted plan for the apply
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-stateful
          path: ${{ runner.temp }}/tfplan.gpg
          retention-days: 1
          if-no-files-found: error

  apply:
    name: terraform apply (stateful)
    needs: plan
    if: github.ref == 'refs/heads/main' && needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits for a required reviewer's approval; the apply role trusts only
    # this environment's jobs (state-bootstrap roles.tf). The environment
    # must also allow deployments from main only, or a branch that adds its
    # own job naming this environment could reach the apply role once
    # approved (state-bootstrap README).
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write tenant configuration
        env:
          BACKEND_HCL: ${{ secrets.TERRAFORM_STATEFUL_BACKEND_HCL }}
          TFVARS: ${{ secrets.TERRAFORM_STATEFUL_TFVARS }}
        run: bash .github/scripts/terraform-tenant.sh "$RUNNER_TEMP"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.5'
          terraform_wrapper: false

      - name: Assume the apply role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.STATE_REGION }}

      - name: Fetch the encrypted plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-stateful
          path: ${{ runner.temp }}

      - name: Apply the saved plan
        working-directory: ${{ env.ROOT }}
        env:
          PASSPHRASE: ${{ secrets.TERRAFORM_PLAN_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::TERRAFORM_PLAN_PASSPHRASE is not set for this repository."
            exit 1
          fi
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt \
            --output tfplan "$RUNNER_TEMP/tfplan.gpg" <<< "$PASSPHRASE"
          terraform init -no-color -backend-config="$RUNNER_TEMP/backend.hcl"
          terraform apply -no-color tfplan
