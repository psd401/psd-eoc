name: Deploy exploration SES readback policy

run-name: exploration SES readback policy at ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed commit on main (40 lowercase hex)
        required: true
        type: string
      change_reference:
        description: Exact approved issue URL
        required: true
        type: string
      acknowledge:
        description: Exact least-privilege policy acknowledgement
        required: true
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: psd-eoc-exploration-smoke-ses-readback-policy

env:
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-west-2:<aws-account-id>:service/psd-eoc-exploration-smoke/fd60545104344bd39ae9920feef7dd5c
  AWS_ACCOUNT_ALIAS: psd401
  AWS_ACCOUNT_ID: '<aws-account-id>'
  AWS_REGION: us-west-2
  CDK_CFN_EXEC_ROLE_ARN: arn:aws:iam::<aws-account-id>:role/cdk-hnb659fds-cfn-exec-role-<aws-account-id>-us-west-2
  CDK_DEPLOY_ROLE_ARN: arn:aws:iam::<aws-account-id>:role/cdk-hnb659fds-deploy-role-<aws-account-id>-us-west-2
  CONFIGURATION_SET_ARN: arn:aws:ses:us-west-2:<aws-account-id>:configuration-set/psd-eoc-transactional
  CONFIGURATION_SET_NAME: psd-eoc-transactional
  DEPLOY_ROLE_ARN: arn:aws:iam::<aws-account-id>:role/psd-eoc-exploration-smoke-github-deploy
  DEPLOY_ROLE_NAME: psd-eoc-exploration-smoke-github-deploy
  EVENT_DESTINATION_NAME: psd-eoc-email-events
  EVENT_TOPIC_ARN: arn:aws:sns:us-west-2:<aws-account-id>:psd-eoc-email-events
  GITHUB_OIDC_PROVIDER_ARN: arn:aws:iam::<aws-account-id>:oidc-provider/token.actions.githubusercontent.com
  GITHUB_OIDC_SUBJECT: repo:psd401@1902994/psd-eoc@1326178900:environment:exploration-smoke
  POLICY_NAME: psd-eoc-exploration-smoke-ses-readback
  STACK_NAME: PsdEocExplorationSmokeSesReadbackPolicy
  TEMPLATE_PATH: infra/exploration-smoke-ses-readback-policy.template.json

jobs:
  preview:
    name: Render the exact zero-write policy preview
    if: >-
      github.repository == 'psd401/psd-eoc' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_digest: ${{ steps.upload.outputs['artifact-digest'] }}
      template_sha256: ${{ steps.validate.outputs.template_sha256 }}
    env:
      ACKNOWLEDGE: ${{ inputs.acknowledge }}
      CHANGE_REFERENCE: ${{ inputs.change_reference }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out the exact requested source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Validate the immutable request and policy
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$CHANGE_REFERENCE" = "https://github.com/psd401/psd-eoc/issues/257"
          test "$ACKNOWLEDGE" = "APPLY EXACT SES READS AND APP RUNNER DOMAIN AUTHORITY WITH NO SEND OR DNS AUTHORITY"

          jq -e \
            --arg app_runner_service "$APP_RUNNER_SERVICE_ARN" \
            --arg configuration_set "$CONFIGURATION_SET_ARN" \
            --arg policy_name "$POLICY_NAME" \
            --arg role_name "$DEPLOY_ROLE_NAME" '
              (keys | sort) == ["AWSTemplateFormatVersion", "Description", "Resources"] and
              .AWSTemplateFormatVersion == "2010-09-09" and
              .Description == "Retained least-privilege operations policy for the protected PSD EOC exploration deployment role" and
              (.Resources | keys) == ["ExplorationSmokeSesReadbackPolicy"] and
              .Resources.ExplorationSmokeSesReadbackPolicy == {
                DeletionPolicy: "Retain",
                Properties: {
                  PolicyDocument: {
                    Statement: [
                      {
                        Action: [
                          "ses:GetConfigurationSet",
                          "ses:GetConfigurationSetEventDestinations"
                        ],
                        Effect: "Allow",
                        Resource: $configuration_set,
                        Sid: "ReadCanonicalConfigurationSetOnly"
                      },
                      {
                        Action: [
                          "apprunner:AssociateCustomDomain",
                          "apprunner:DescribeCustomDomains",
                          "apprunner:ListOperations"
                        ],
                        Effect: "Allow",
                        Resource: $app_runner_service,
                        Sid: "ReadAndAssociateCanonicalCustomDomainOnly"
                      }
                    ],
                    Version: "2012-10-17"
                  },
                  PolicyName: $policy_name,
                  Roles: [$role_name]
                },
                Type: "AWS::IAM::Policy",
                UpdateReplacePolicy: "Retain"
              }
            ' "$TEMPLATE_PATH" > /dev/null
          test "$(jq '[.. | objects | .Action? // empty | if type == "array" then .[] else . end] | length' "$TEMPLATE_PATH")" -eq 5
          test "$(jq '[.. | objects | .Resource? // empty] | length' "$TEMPLATE_PATH")" -eq 2
          test "$(jq -r '[.. | objects | .Resource? // empty] | sort | join("\n")' "$TEMPLATE_PATH")" = "$(printf '%s\n%s' "$APP_RUNNER_SERVICE_ARN" "$CONFIGURATION_SET_ARN" | sort)"
          if jq -er '.. | objects | .Resource? // empty' "$TEMPLATE_PATH" | grep -Fx '*'; then
            echo "The retained policy contains wildcard resource authority." >&2
            exit 1
          fi
          if jq -er '.. | objects | .Action? // empty | if type == "array" then .[] else . end' "$TEMPLATE_PATH" \
            | grep -Eiq '(^|:)(send|put|create|update|delete|disassociate|publish|route53|[*])'; then
            echo "The retained policy contains an unapproved action." >&2
            exit 1
          fi

          mkdir -p artifacts
          cp "$TEMPLATE_PATH" artifacts/exploration-smoke-ses-readback-policy.template.json
          template_sha256=$(sha256sum "$TEMPLATE_PATH" | cut -d' ' -f1)
          printf '%s\n' "$template_sha256" > artifacts/template.sha256
          printf '%s\n' "template_sha256=$template_sha256" >> "$GITHUB_OUTPUT"
          {
            printf '%s\n' "# Protected exploration operations policy consequence preview"
            printf '%s\n' ""
            printf '%s\n' "- Source: \`$SOURCE_SHA\`"
            printf '%s\n' "- Change authority: $CHANGE_REFERENCE"
            printf '%s\n' "- Target role: \`$DEPLOY_ROLE_ARN\`"
            printf '%s\n' "- SES read actions: \`ses:GetConfigurationSet\`, \`ses:GetConfigurationSetEventDestinations\` on \`$CONFIGURATION_SET_ARN\`"
            printf '%s\n' "- App Runner actions: \`apprunner:AssociateCustomDomain\`, \`apprunner:DescribeCustomDomains\`, \`apprunner:ListOperations\` on \`$APP_RUNNER_SERVICE_ARN\`"
            printf '%s\n' "- The retained policy is applied through protected OIDC -> CDK deploy role -> CloudFormation execution role."
            printf '%s\n' "- This policy apply performs no domain association, disassociation, Route53/DNS change, SES send/write/delete, recipient/provider mutation, or application deployment."
          } > artifacts/consequence-preview.md
          cat artifacts/consequence-preview.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the immutable preview
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: exploration-ses-readback-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 14

  apply:
    name: Apply through protected OIDC and prove zero-send authority
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: exploration-smoke
    permissions:
      contents: read
      id-token: write
    env:
      ACKNOWLEDGE: ${{ inputs.acknowledge }}
      CHANGE_REFERENCE: ${{ inputs.change_reference }}
      CONFIGURED_DEPLOY_ROLE_ARN: ${{ vars.AWS_EXPLORATION_SMOKE_DEPLOY_ROLE_ARN }}
      EXPECTED_TEMPLATE_SHA256: ${{ needs.preview.outputs.template_sha256 }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out the exact approved source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_sha }}

      - name: Download the protected preview
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: exploration-ses-readback-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts

      - name: Revalidate the exact approved artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$CHANGE_REFERENCE" = "https://github.com/psd401/psd-eoc/issues/257"
          test "$ACKNOWLEDGE" = "APPLY EXACT SES READS AND APP RUNNER DOMAIN AUTHORITY WITH NO SEND OR DNS AUTHORITY"
          test "$CONFIGURED_DEPLOY_ROLE_ARN" = "$DEPLOY_ROLE_ARN"
          [[ "$EXPECTED_TEMPLATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(cat artifacts/template.sha256)" = "$EXPECTED_TEMPLATE_SHA256"
          test "$(sha256sum artifacts/exploration-smoke-ses-readback-policy.template.json | cut -d' ' -f1)" = "$EXPECTED_TEMPLATE_SHA256"
          cmp "$TEMPLATE_PATH" artifacts/exploration-smoke-ses-readback-policy.template.json
          grep -Fx -- "- SES read actions: \`ses:GetConfigurationSet\`, \`ses:GetConfigurationSetEventDestinations\` on \`$CONFIGURATION_SET_ARN\`" artifacts/consequence-preview.md
          grep -Fx -- "- App Runner actions: \`apprunner:AssociateCustomDomain\`, \`apprunner:DescribeCustomDomains\`, \`apprunner:ListOperations\` on \`$APP_RUNNER_SERVICE_ARN\`" artifacts/consequence-preview.md
          grep -Fx -- "- This policy apply performs no domain association, disassociation, Route53/DNS change, SES send/write/delete, recipient/provider mutation, or application deployment." artifacts/consequence-preview.md

      - name: Assume the exact protected exploration role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708
        with:
          allowed-account-ids: '<aws-account-id>'
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
          output-credentials: false
          role-duration-seconds: 3600
          role-session-name: psd-eoc-ses-readback-${{ github.run_id }}
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          unset-current-credentials: true

      - name: Apply exact retained policy and prove boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/readback
          template=artifacts/exploration-smoke-ses-readback-policy.template.json
          role_before=artifacts/readback/deployment-role-before.json
          role_after=artifacts/readback/deployment-role-after.json
          inventory_before=artifacts/readback/deployment-role-policy-inventory-before.json
          inventory_after=artifacts/readback/deployment-role-policy-inventory.json

          capture_policy_inventory() {
            local destination=$1
            local directory=$2
            local boundary_arn boundary_version metadata document inventory_json inventory_policy_name policy_arn policy_owner policy_version
            mkdir -p "$directory"
            : > "$directory/inline.ndjson"
            : > "$directory/attached.ndjson"
            aws iam list-role-policies --role-name "$DEPLOY_ROLE_NAME" > "$directory/inline-list.json"
            while IFS= read -r inventory_policy_name; do
              [[ "$inventory_policy_name" =~ ^[A-Za-z0-9+=,.@_-]{1,128}$ ]]
              document="$directory/inline-$inventory_policy_name.json"
              aws iam get-role-policy \
                --role-name "$DEPLOY_ROLE_NAME" \
                --policy-name "$inventory_policy_name" > "$document"
              jq -cS '{policyName:.PolicyName,policyDocument:.PolicyDocument}' "$document" >> "$directory/inline.ndjson"
            done < <(jq -r '.PolicyNames[]' "$directory/inline-list.json")
            jq -s 'sort_by(.policyName)' "$directory/inline.ndjson" > "$directory/inline.json"

            aws iam list-attached-role-policies --role-name "$DEPLOY_ROLE_NAME" > "$directory/attached-list.json"
            while IFS=$'\t' read -r inventory_policy_name policy_arn; do
              [[ "$inventory_policy_name" =~ ^[A-Za-z0-9+=,.@_-]{1,128}$ ]]
              [[ "$policy_arn" =~ ^arn:aws:iam::(aws|[0-9]{12}):policy/[A-Za-z0-9+=,.@_/-]+$ ]]
              policy_owner=${policy_arn#arn:aws:iam::}
              policy_owner=${policy_owner%%:*}
              metadata="$directory/attached-$policy_owner-$inventory_policy_name-metadata.json"
              document="$directory/attached-$policy_owner-$inventory_policy_name-document.json"
              aws iam get-policy --policy-arn "$policy_arn" > "$metadata"
              policy_version=$(jq -er '.Policy.DefaultVersionId' "$metadata")
              aws iam get-policy-version --policy-arn "$policy_arn" --version-id "$policy_version" > "$document"
              jq -cS \
                --arg policy_name "$inventory_policy_name" \
                --arg policy_arn "$policy_arn" \
                --arg policy_version "$policy_version" \
                '{policyName:$policy_name,policyArn:$policy_arn,versionId:$policy_version,policyDocument:.PolicyVersion.Document}' \
                "$document" >> "$directory/attached.ndjson"
            done < <(jq -r '.AttachedPolicies[] | [.PolicyName, .PolicyArn] | @tsv' "$directory/attached-list.json")
            jq -s 'sort_by(.policyArn)' "$directory/attached.ndjson" > "$directory/attached.json"

            boundary_arn=$(jq -r '.PermissionsBoundary.PermissionsBoundaryArn // empty' "$role_before")
            if [[ -n "$boundary_arn" ]]; then
              metadata="$directory/boundary-metadata.json"
              document="$directory/boundary-document.json"
              aws iam get-policy --policy-arn "$boundary_arn" > "$metadata"
              boundary_version=$(jq -er '.Policy.DefaultVersionId' "$metadata")
              aws iam get-policy-version --policy-arn "$boundary_arn" --version-id "$boundary_version" > "$document"
              jq -cS \
                --arg policy_arn "$boundary_arn" \
                --arg policy_version "$boundary_version" \
                '{policyArn:$policy_arn,versionId:$policy_version,policyDocument:.PolicyVersion.Document}' \
                "$document" > "$directory/boundary.json"
            else
              printf '%s\n' null > "$directory/boundary.json"
            fi
            inventory_json=$(jq -cS -n \
              --slurpfile inline "$directory/inline.json" \
              --slurpfile attached "$directory/attached.json" \
              --slurpfile boundary "$directory/boundary.json" \
              '{inlinePolicies:$inline[0],attachedPolicies:$attached[0],permissionsBoundary:$boundary[0]}')
            printf '%s' "$inventory_json" > "$destination"
          }

          oidc_caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          [[ "$oidc_caller_arn" =~ ^arn:aws:sts::<aws-account-id>:assumed-role/psd-eoc-exploration-smoke-github-deploy/[A-Za-z0-9+=,.@_-]+$ ]]
          test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
          aws iam list-account-aliases > artifacts/readback/account-aliases.json
          test "$(jq -c '.AccountAliases' artifacts/readback/account-aliases.json)" = '["psd401"]'
          aws iam get-role \
            --role-name "$DEPLOY_ROLE_NAME" \
            --query 'Role.{Arn:Arn,RoleId:RoleId,RoleName:RoleName,CreateDate:CreateDate,AssumeRolePolicyDocument:AssumeRolePolicyDocument,MaxSessionDuration:MaxSessionDuration,PermissionsBoundary:PermissionsBoundary}' \
            > "$role_before"
          test "$(jq -r .Arn "$role_before")" = "$DEPLOY_ROLE_ARN"
          test "$(jq -r .MaxSessionDuration "$role_before")" -eq 3600
          jq -e \
            --arg provider "$GITHUB_OIDC_PROVIDER_ARN" \
            --arg subject "$GITHUB_OIDC_SUBJECT" '
              (.AssumeRolePolicyDocument.Statement | if type == "array" then . else [.] end) == [{
                Action: "sts:AssumeRoleWithWebIdentity",
                Condition: {StringEquals: {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": $subject
                }},
                Effect: "Allow",
                Principal: {Federated: $provider}
              }]
            ' "$role_before" > /dev/null
          capture_policy_inventory "$inventory_before" artifacts/readback/policy-before

          deploy_credentials=$(aws sts assume-role \
            --role-arn "$CDK_DEPLOY_ROLE_ARN" \
            --role-session-name "psd-eoc-ses-policy-${GITHUB_RUN_ID}" \
            --duration-seconds 900 \
            --query Credentials \
            --output json)
          deploy_access_key=$(jq -er .AccessKeyId <<< "$deploy_credentials")
          deploy_secret_key=$(jq -er .SecretAccessKey <<< "$deploy_credentials")
          deploy_session_token=$(jq -er .SessionToken <<< "$deploy_credentials")
          deploy_aws() {
            AWS_ACCESS_KEY_ID="$deploy_access_key" \
              AWS_SECRET_ACCESS_KEY="$deploy_secret_key" \
              AWS_SESSION_TOKEN="$deploy_session_token" \
              aws "$@"
          }
          deploy_caller_arn=$(deploy_aws sts get-caller-identity --query Arn --output text)
          [[ "$deploy_caller_arn" =~ ^arn:aws:sts::<aws-account-id>:assumed-role/cdk-hnb659fds-deploy-role-<aws-account-id>-us-west-2/psd-eoc-ses-policy-${GITHUB_RUN_ID}$ ]]

          stack_before=artifacts/readback/policy-stack-before.json
          resume_available_create=false
          if deploy_aws cloudformation describe-stacks --stack-name "$STACK_NAME" > "$stack_before" 2> artifacts/readback/policy-stack-before-error.txt; then
            stack_existed=true
            test "$(jq '.Stacks | length' "$stack_before")" -eq 1
            test "$(jq -er '.Stacks[0].RoleARN' "$stack_before")" = "$CDK_CFN_EXEC_ROLE_ARN"
            stack_status=$(jq -er '.Stacks[0].StackStatus' "$stack_before")
            case "$stack_status" in
              CREATE_COMPLETE | UPDATE_COMPLETE)
                deploy_aws cloudformation get-template --stack-name "$STACK_NAME" --template-stage Original > artifacts/readback/policy-stack-template-before.json
                jq -S '.TemplateBody' artifacts/readback/policy-stack-template-before.json > artifacts/readback/policy-stack-template-before-body.json
                jq -S . "$template" > artifacts/readback/policy-template-canonical.json
                jq -S '
                  .Description = "Retained least-privilege SES readback policy for the protected PSD EOC exploration deployment role" |
                  .Resources.ExplorationSmokeSesReadbackPolicy.Properties.PolicyDocument.Statement =
                    [.Resources.ExplorationSmokeSesReadbackPolicy.Properties.PolicyDocument.Statement[0]]
                ' "$template" > artifacts/readback/policy-template-authorized-predecessor.json
                if ! cmp artifacts/readback/policy-template-canonical.json artifacts/readback/policy-stack-template-before-body.json; then
                  cmp artifacts/readback/policy-template-authorized-predecessor.json artifacts/readback/policy-stack-template-before-body.json
                fi
                change_set_type=UPDATE
                ;;
              REVIEW_IN_PROGRESS)
                deploy_aws cloudformation list-change-sets \
                  --stack-name "$STACK_NAME" \
                  > artifacts/readback/policy-interrupted-change-set-list.json
                jq -e '
                  (.NextToken // null) == null and
                  (.Summaries | length) == 1 and
                  .Summaries[0].Status == "CREATE_COMPLETE" and
                  .Summaries[0].ExecutionStatus == "AVAILABLE"
                ' artifacts/readback/policy-interrupted-change-set-list.json > /dev/null
                change_set_id=$(jq -er '.Summaries[0].ChangeSetId' artifacts/readback/policy-interrupted-change-set-list.json)
                change_set_name=$(jq -er '.Summaries[0].ChangeSetName' artifacts/readback/policy-interrupted-change-set-list.json)
                [[ "$change_set_id" =~ ^arn:aws:cloudformation:us-west-2:<aws-account-id>:changeSet/psd-eoc-ses-readback-[0-9]+-[0-9]+/[0-9a-f-]{36}$ ]]
                [[ "$change_set_name" =~ ^psd-eoc-ses-readback-([0-9]+)-([0-9]+)$ ]]
                interrupted_run_id=${BASH_REMATCH[1]}
                interrupted_run_attempt=${BASH_REMATCH[2]}
                change_set_client_token="$change_set_name"
                change_set_description="Exact SES readback policy for GitHub run ${interrupted_run_id}/${interrupted_run_attempt} with client token ${change_set_client_token}"
                deploy_aws cloudformation describe-change-set \
                  --change-set-name "$change_set_id" \
                  > artifacts/readback/policy-change-set.json
                jq -e \
                  --arg arn "$change_set_id" \
                  --arg description "$change_set_description" \
                  --arg name "$change_set_name" \
                  --arg stack "$STACK_NAME" '
                    .ChangeSetId == $arn and
                    .ChangeSetName == $name and
                    # DescribeChangeSet omits ChangeSetType. ROLLBACK is a
                    # service-enforced CREATE-only field, so it is the
                    # retrievable proof that this is the expected CREATE.
                    .OnStackFailure == "ROLLBACK" and
                    .Description == $description and
                    .StackName == $stack and
                    .Status == "CREATE_COMPLETE" and
                    .ExecutionStatus == "AVAILABLE" and
                    (.Capabilities | sort) == ["CAPABILITY_NAMED_IAM"] and
                    [.Changes[] | .ResourceChange | {
                      Action,
                      LogicalResourceId,
                      ResourceType,
                      Replacement
                    }] == [{
                      Action: "Add",
                      LogicalResourceId: "ExplorationSmokeSesReadbackPolicy",
                      Replacement: null,
                      ResourceType: "AWS::IAM::Policy"
                    }]
                  ' artifacts/readback/policy-change-set.json > /dev/null
                deploy_aws cloudformation get-template \
                  --stack-name "$STACK_NAME" \
                  --change-set-name "$change_set_id" \
                  --template-stage Original \
                  > artifacts/readback/policy-interrupted-change-set-template.json
                jq -S '.TemplateBody' artifacts/readback/policy-interrupted-change-set-template.json > artifacts/readback/policy-interrupted-change-set-template-body.json
                jq -S . "$template" > artifacts/readback/policy-template-canonical.json
                cmp artifacts/readback/policy-template-canonical.json artifacts/readback/policy-interrupted-change-set-template-body.json
                change_set_type=CREATE
                resume_available_create=true
                ;;
              *)
                echo "The retained policy stack is not stable." >&2
                exit 1
                ;;
            esac
          else
            grep -Eq 'does not exist|ValidationError' artifacts/readback/policy-stack-before-error.txt
            stack_existed=false
            change_set_type=CREATE
          fi

          if [[ "$resume_available_create" == false ]]; then
            change_set_name="psd-eoc-ses-readback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            change_set_client_token="$change_set_name"
            change_set_description="Exact SES readback policy for GitHub run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT} with client token ${change_set_client_token}"
            change_set_request=artifacts/readback/policy-change-set-request.json
            jq -n \
              --arg stack_name "$STACK_NAME" \
              --arg change_set_name "$change_set_name" \
              --arg change_set_type "$change_set_type" \
              --arg client_token "$change_set_client_token" \
              --arg description "$change_set_description" \
              --arg role_arn "$CDK_CFN_EXEC_ROLE_ARN" \
              --rawfile template_body "$template" '
                {
                  Capabilities: ["CAPABILITY_NAMED_IAM"],
                  ChangeSetName: $change_set_name,
                  ChangeSetType: $change_set_type,
                  ClientToken: $client_token,
                  Description: $description,
                  RoleARN: $role_arn,
                  StackName: $stack_name,
                  TemplateBody: $template_body
                } + if $change_set_type == "CREATE" then
                  {OnStackFailure: "ROLLBACK"}
                else
                  {}
                end
              ' > "$change_set_request"
            deploy_aws cloudformation create-change-set \
              --cli-input-json "file://$change_set_request" \
              > artifacts/readback/policy-change-set-create.json
            change_set_id=$(jq -er .Id artifacts/readback/policy-change-set-create.json)
            [[ "$change_set_id" =~ ^arn:aws:cloudformation:us-west-2:<aws-account-id>:changeSet/psd-eoc-ses-readback-[0-9]+-[0-9]+/[0-9a-f-]{36}$ ]]

            set +e
            deploy_aws cloudformation wait change-set-create-complete --change-set-name "$change_set_id"
            change_set_wait_exit=$?
            set -e
            deploy_aws cloudformation describe-change-set --change-set-name "$change_set_id" > artifacts/readback/policy-change-set.json
          else
            change_set_wait_exit=0
          fi
          if [[ "$change_set_wait_exit" -eq 0 ]]; then
            jq -e \
              --arg arn "$change_set_id" \
              --arg description "$change_set_description" \
              --arg name "$change_set_name" \
              --arg stack "$STACK_NAME" \
              --arg type "$change_set_type" '
                .ChangeSetId == $arn and
                .ChangeSetName == $name and
                (($type == "CREATE" and .OnStackFailure == "ROLLBACK") or
                  ($type == "UPDATE" and .OnStackFailure == null)) and
                .Description == $description and
                .StackName == $stack and
                .Status == "CREATE_COMPLETE" and
                .ExecutionStatus == "AVAILABLE" and
                (.Capabilities | sort) == ["CAPABILITY_NAMED_IAM"] and
                (($type == "CREATE" and
                  [.Changes[] | .ResourceChange | {
                    Action,
                    LogicalResourceId,
                    ResourceType,
                    Replacement
                  }] == [{
                    Action: "Add",
                    LogicalResourceId: "ExplorationSmokeSesReadbackPolicy",
                    Replacement: null,
                    ResourceType: "AWS::IAM::Policy"
                  }]) or
                  ($type == "UPDATE" and
                    [.Changes[] | .ResourceChange | {
                      Action,
                      LogicalResourceId,
                      ResourceType,
                      Replacement
                    }] == [{
                      Action: "Modify",
                      LogicalResourceId: "ExplorationSmokeSesReadbackPolicy",
                      Replacement: "False",
                      ResourceType: "AWS::IAM::Policy"
                    }]))
              ' artifacts/readback/policy-change-set.json > /dev/null
            deploy_aws cloudformation execute-change-set --change-set-name "$change_set_id"
            if [[ "$change_set_type" == "CREATE" ]]; then
              deploy_aws cloudformation wait stack-create-complete --stack-name "$STACK_NAME"
            else
              deploy_aws cloudformation wait stack-update-complete --stack-name "$STACK_NAME"
            fi
            if [[ "$resume_available_create" == true ]]; then
              jq -n --arg state resumed-interrupted-create '{state:$state}' > artifacts/readback/policy-apply-result.json
            else
              jq -n --arg state applied '{state:$state}' > artifacts/readback/policy-apply-result.json
            fi
          else
            test "$stack_existed" = true
            jq -e \
              --arg arn "$change_set_id" \
              --arg name "$change_set_name" \
              --arg stack "$STACK_NAME" '
                .ChangeSetId == $arn and
                .ChangeSetName == $name and
                .OnStackFailure == null and
                .StackName == $stack and
                .Status == "FAILED" and
                .ExecutionStatus == "UNAVAILABLE" and
                ((.StatusReason // "") | test("didn.t contain changes|No updates are to be performed"; "i")) and
                ((.Changes // []) | length) == 0
              ' artifacts/readback/policy-change-set.json > /dev/null
            jq -n --arg state already-applied '{state:$state}' > artifacts/readback/policy-apply-result.json
          fi

          deploy_aws cloudformation describe-stacks --stack-name "$STACK_NAME" > artifacts/readback/policy-stack-final.json
          jq -e \
            --arg role "$CDK_CFN_EXEC_ROLE_ARN" '
              (.Stacks | length) == 1 and
              (.Stacks[0].StackStatus == "CREATE_COMPLETE" or .Stacks[0].StackStatus == "UPDATE_COMPLETE") and
              .Stacks[0].RoleARN == $role
            ' artifacts/readback/policy-stack-final.json > /dev/null
          deploy_aws cloudformation get-template --stack-name "$STACK_NAME" --template-stage Original > artifacts/readback/policy-stack-template-final.json
          jq -S '.TemplateBody' artifacts/readback/policy-stack-template-final.json > artifacts/readback/policy-stack-template-final-body.json
          jq -S . "$template" > artifacts/readback/policy-template-canonical.json
          cmp artifacts/readback/policy-template-canonical.json artifacts/readback/policy-stack-template-final-body.json
          unset deploy_credentials deploy_access_key deploy_secret_key deploy_session_token deploy_caller_arn
          post_deploy_caller_arn=$(aws sts get-caller-identity --query Arn --output text)
          test "$post_deploy_caller_arn" = "$oidc_caller_arn"

          aws iam get-role \
            --role-name "$DEPLOY_ROLE_NAME" \
            --query 'Role.{Arn:Arn,RoleId:RoleId,RoleName:RoleName,CreateDate:CreateDate,AssumeRolePolicyDocument:AssumeRolePolicyDocument,MaxSessionDuration:MaxSessionDuration,PermissionsBoundary:PermissionsBoundary}' \
            > "$role_after"
          cmp "$role_before" "$role_after"
          capture_policy_inventory "$inventory_after" artifacts/readback/policy-after
          jq -e \
            --arg app_runner_service "$APP_RUNNER_SERVICE_ARN" \
            --arg configuration_set "$CONFIGURATION_SET_ARN" \
            --arg policy_name "$POLICY_NAME" \
            '
              [.inlinePolicies[] | select(.policyName == $policy_name)] == [{
                policyDocument: {
                  Statement: [
                    {
                      Action: [
                        "ses:GetConfigurationSet",
                        "ses:GetConfigurationSetEventDestinations"
                      ],
                      Effect: "Allow",
                      Resource: $configuration_set,
                      Sid: "ReadCanonicalConfigurationSetOnly"
                    },
                    {
                      Action: [
                        "apprunner:AssociateCustomDomain",
                        "apprunner:DescribeCustomDomains",
                        "apprunner:ListOperations"
                      ],
                      Effect: "Allow",
                      Resource: $app_runner_service,
                      Sid: "ReadAndAssociateCanonicalCustomDomainOnly"
                    }
                  ],
                  Version: "2012-10-17"
                },
                policyName: $policy_name
              }] and
              ([.inlinePolicies[] | select(.policyName != $policy_name)] | length) >= 1 and
              ([.inlinePolicies[] | select(.policyName != $policy_name)] | all(.[];
                ([.policyDocument.Statement[] | .Action | if type == "array" then .[] else . end] | all(
                  . != "ses:GetConfigurationSet" and
                  . != "ses:GetConfigurationSetEventDestinations" and
                  . != "apprunner:AssociateCustomDomain" and
                  . != "apprunner:DescribeCustomDomains" and
                  . != "apprunner:ListOperations"
                ))
              ))
            ' "$inventory_after" > /dev/null
          jq -e \
            --arg policy_name "$POLICY_NAME" \
            --slurpfile before "$inventory_before" '
              ([.inlinePolicies[] | select(.policyName != $policy_name)] ==
                [$before[0].inlinePolicies[] | select(.policyName != $policy_name)]) and
              .attachedPolicies == $before[0].attachedPolicies and
              .permissionsBoundary == $before[0].permissionsBoundary
            ' "$inventory_after" > /dev/null
          actual_policy_sha256=$(sha256sum "$inventory_after" | cut -d' ' -f1)
          printf '%s\n' "$actual_policy_sha256" > artifacts/readback/deployment-role-policy-inventory.sha256

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names ses:GetConfigurationSet ses:GetConfigurationSetEventDestinations \
            --resource-arns "$CONFIGURATION_SET_ARN" \
            > artifacts/readback/ses-read-positive-simulation.json
          jq -e \
            --arg resource "$CONFIGURATION_SET_ARN" '
              [.EvaluationResults[] | {action:.EvalActionName,decision:.EvalDecision,resource:.EvalResourceName}] |
              sort_by(.action) == ([
                {action:"ses:GetConfigurationSet",decision:"allowed",resource:$resource},
                {action:"ses:GetConfigurationSetEventDestinations",decision:"allowed",resource:$resource}
              ] | sort_by(.action))
            ' artifacts/readback/ses-read-positive-simulation.json > /dev/null

          neighboring_arn="arn:aws:ses:$AWS_REGION:$AWS_ACCOUNT_ID:configuration-set/not-psd-eoc-transactional"
          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names ses:GetConfigurationSet ses:GetConfigurationSetEventDestinations \
            --resource-arns "$neighboring_arn" \
            > artifacts/readback/ses-read-neighboring-negative-simulation.json
          jq -e \
            --arg resource "$neighboring_arn" '
              (.EvaluationResults | length) == 2 and
              all(.EvaluationResults[];
                .EvalResourceName == $resource and .EvalDecision != "allowed"
              )
            ' artifacts/readback/ses-read-neighboring-negative-simulation.json > /dev/null

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names \
              apprunner:AssociateCustomDomain \
              apprunner:DescribeCustomDomains \
              apprunner:ListOperations \
            --resource-arns "$APP_RUNNER_SERVICE_ARN" \
            > artifacts/readback/app-runner-domain-positive-simulation.json
          jq -e \
            --arg resource "$APP_RUNNER_SERVICE_ARN" '
              [.EvaluationResults[] | {action:.EvalActionName,decision:.EvalDecision,resource:.EvalResourceName}] |
              sort_by(.action) == ([
                {action:"apprunner:AssociateCustomDomain",decision:"allowed",resource:$resource},
                {action:"apprunner:DescribeCustomDomains",decision:"allowed",resource:$resource},
                {action:"apprunner:ListOperations",decision:"allowed",resource:$resource}
              ] | sort_by(.action))
            ' artifacts/readback/app-runner-domain-positive-simulation.json > /dev/null

          neighboring_service_arn="arn:aws:apprunner:$AWS_REGION:$AWS_ACCOUNT_ID:service/not-psd-eoc/11111111111111111111111111111111"
          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names \
              apprunner:AssociateCustomDomain \
              apprunner:DescribeCustomDomains \
              apprunner:ListOperations \
            --resource-arns "$neighboring_service_arn" \
            > artifacts/readback/app-runner-neighboring-negative-simulation.json
          jq -e \
            --arg resource "$neighboring_service_arn" '
              (.EvaluationResults | length) == 3 and
              all(.EvaluationResults[];
                .EvalResourceName == $resource and .EvalDecision != "allowed"
              )
            ' artifacts/readback/app-runner-neighboring-negative-simulation.json > /dev/null

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names \
              apprunner:DisassociateCustomDomain \
              apprunner:DeleteService \
              apprunner:PauseService \
              apprunner:ResumeService \
              apprunner:UpdateService \
            --resource-arns "$APP_RUNNER_SERVICE_ARN" \
            > artifacts/readback/app-runner-write-negative-simulation.json
          jq -e '
              (.EvaluationResults | length) == 5 and
              all(.EvaluationResults[]; .EvalDecision != "allowed")
            ' artifacts/readback/app-runner-write-negative-simulation.json > /dev/null

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names \
              route53:ChangeResourceRecordSets \
              route53:CreateHostedZone \
              route53:DeleteHostedZone \
            --resource-arns '*' \
            > artifacts/readback/route53-negative-simulation.json
          jq -e '
              (.EvaluationResults | length) == 3 and
              all(.EvaluationResults[]; .EvalDecision != "allowed")
            ' artifacts/readback/route53-negative-simulation.json > /dev/null

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names \
              ses:SendEmail \
              ses:SendRawEmail \
              ses:SendBulkTemplatedEmail \
              ses:PutConfigurationSetSendingOptions \
              ses:CreateConfigurationSetEventDestination \
              ses:UpdateConfigurationSetEventDestination \
              ses:DeleteConfigurationSetEventDestination \
              ses:DeleteConfigurationSet \
            --resource-arns "$CONFIGURATION_SET_ARN" \
            > artifacts/readback/ses-write-negative-simulation.json
          jq -e '
            (.EvaluationResults | length) == 8 and
            all(.EvaluationResults[]; .EvalDecision != "allowed")
          ' artifacts/readback/ses-write-negative-simulation.json > /dev/null

          ses_readback_complete=false
          for attempt in {1..12}; do
            if aws sesv2 get-configuration-set \
              --configuration-set-name "$CONFIGURATION_SET_NAME" \
              --query '{ConfigurationSetName:ConfigurationSetName,SendingOptions:SendingOptions}' \
              > artifacts/readback/ses-configuration-set.json 2> artifacts/readback/ses-configuration-set-error.txt && \
              aws sesv2 get-configuration-set-event-destinations \
                --configuration-set-name "$CONFIGURATION_SET_NAME" \
                --query '{EventDestinations:EventDestinations[].{Name:Name,Enabled:Enabled,MatchingEventTypes:MatchingEventTypes,SnsDestination:SnsDestination}}' \
                > artifacts/readback/ses-event-destinations.json 2> artifacts/readback/ses-event-destinations-error.txt; then
              ses_readback_complete=true
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done
          test "$ses_readback_complete" = true
          jq -e \
            --arg name "$CONFIGURATION_SET_NAME" '
              .ConfigurationSetName == $name and
              .SendingOptions.SendingEnabled == false
            ' artifacts/readback/ses-configuration-set.json > /dev/null
          jq -e \
            --arg destination "$EVENT_DESTINATION_NAME" \
            --arg topic "$EVENT_TOPIC_ARN" '
              .EventDestinations == [{
                Enabled: true,
                MatchingEventTypes: [
                  "SEND",
                  "DELIVERY",
                  "BOUNCE",
                  "COMPLAINT",
                  "REJECT",
                  "RENDERING_FAILURE",
                  "DELIVERY_DELAY"
                ],
                Name: $destination,
                SnsDestination: {TopicArn: $topic}
              }]
            ' artifacts/readback/ses-event-destinations.json > /dev/null

          {
            printf '%s\n' "# Exploration operations policy applied"
            printf '%s\n' ""
            printf '%s\n' "- Source: \`$SOURCE_SHA\`"
            printf '%s\n' "- Result: \`$(jq -r .state artifacts/readback/policy-apply-result.json)\`"
            printf '%s\n' "- Complete deployment-role policy inventory SHA-256: \`$actual_policy_sha256\`"
            printf '%s\n' "- Exact SES reads are allowed only on \`$CONFIGURATION_SET_ARN\`."
            printf '%s\n' "- Exact App Runner domain reads/association are allowed only on \`$APP_RUNNER_SERVICE_ARN\`."
            printf '%s\n' "- SES sending remains disabled; all tested send/write/delete actions and the neighboring configuration set remain denied."
            printf '%s\n' "- App Runner disassociation/service mutations, unrelated services, and all tested Route53 writes remain denied."
            printf '%s\n' "- No provider configuration, recipient, message, custom-domain association, Route53, or DNS mutation occurred."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact policy and readback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: exploration-ses-readback-policy-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          retention-days: 14
