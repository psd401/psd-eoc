name: Sync access membership

run-name: access-membership sync

# Membership has a freshness bound: sign-in refuses a group whose membership has
# not been read recently, so that a deployment fails closed rather than running
# indefinitely on a stale answer. That bound is only safe if something actually
# refreshes it.
#
# This used to be dispatch-only, and it produced exactly the outage the bound is
# meant to prevent: membership was read once by hand, and everybody lost access
# when it aged out. Running on a schedule is what makes the freshness rule a
# safety property instead of a timer on an outage.
on:
  schedule:
    # Every two hours. Well inside the freshness bound, so a single missed run
    # never denies anyone.
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: psd-eoc-access-membership-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync access membership
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: exploration-smoke
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      CLUSTER: psd-eoc-exploration-smoke-native-bootstrap
      TASK_DEFINITION: psd-eoc-exploration-smoke-access-sync
      SUBNETS: ${{ vars.ACCESS_SYNC_SUBNET_IDS }}
      SECURITY_GROUP: ${{ vars.ACCESS_SYNC_SECURITY_GROUP_ID }}
    steps:
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_EXPLORATION_SMOKE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Run the access sync
        shell: bash
        run: |
          set -euo pipefail
          request_id=$(uuidgen | tr '[:upper:]' '[:lower:]')
          idempotency_key="access-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          overrides=$(jq -nc \
            --arg request_id "$request_id" \
            --arg idempotency_key "$idempotency_key" \
            '{containerOverrides: [{
              name: "access-membership-sync",
              environment: [
                {name: "ACCESS_SYNC_REQUEST_ID", value: $request_id},
                {name: "ACCESS_SYNC_IDEMPOTENCY_KEY", value: $idempotency_key}
              ]
            }]}')

          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$TASK_DEFINITION" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --count 1 \
            --started-by "access-sync-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --overrides "$overrides" \
            --query 'tasks[0].taskArn' --output text)
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "::error::The access sync task did not start. Membership was not refreshed." >&2
            exit 1
          fi
          echo "Task: $task_arn"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          read -r stop_code exit_code < <(aws ecs describe-tasks \
            --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].[stopCode,containers[0].exitCode]' --output text)

          # The task prints one bounded aggregate summary: counts and digests,
          # never a member address or a provider group id.
          summary=$(aws logs get-log-events \
            --log-group-name /psd-eoc/exploration-smoke/bootstrap \
            --log-stream-name "access-membership-sync/access-membership-sync/${task_arn##*/}" \
            --query 'events[-1].message' --output text 2>/dev/null || echo '')

          {
            echo "### Access membership sync"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Stop code | \`$stop_code\` |"
            echo "| Exit code | \`$exit_code\` |"
            echo "| Summary | \`${summary:-unavailable}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$exit_code" != "0" ]]; then
            echo "::error::Access sync exited $exit_code ($stop_code). Membership is now ageing toward its freshness bound; sign-in will start failing closed if this is not fixed." >&2
            exit 1
          fi
          echo "Membership refreshed."
