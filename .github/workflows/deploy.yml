name: Deploy

run-name: deploy ${{ inputs.rollback_image_digest || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_image_digest:
        description: Previously deployed image digest to roll back to. Leave empty to build and deploy this commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: psd-eoc-deploy
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  STACK_NAME: ${{ vars.STACK_NAME }}
  APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
  GOOGLE_OAUTH_SECRET_ARN: ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
  GOOGLE_GROUPS_SECRET_ARN: ${{ vars.GOOGLE_GROUPS_SECRET_ARN }}
  EXPO_PUSH_WORKER_ENABLED: ${{ vars.EXPO_PUSH_WORKER_ENABLED || 'false' }}
  EXPO_CREDENTIAL_VERIFICATION_REFERENCE: ${{ vars.EXPO_CREDENTIAL_VERIFICATION_REFERENCE || 'UNVERIFIED' }}
  PSD_EOC_ENFORCE_DEPLOYMENT_TARGET: 'true'

jobs:
  deploy:
    name: Build and deploy
    if: github.repository == 'psd401/psd-eoc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Every required piece of configuration is checked by name before any
      # build or deploy work happens. A missing secret previously surfaced as
      # an ECS task that could not start, discovered days later, with no usable
      # error message anywhere in the failure output (see issue #271).
      #
      # The deployment role holds secretsmanager:DescribeSecret on each ARN
      # below. That returns metadata only; it never grants GetSecretValue for
      # those Secrets Manager values. This step does receive the optional
      # INITIAL_ACCESS_GROUP_EMAIL GitHub secret solely to validate whether it
      # is present; its value must never be logged.
      - name: Verify required configuration exists
        shell: bash
        env:
          INITIAL_ACCESS_GROUP_EMAIL: ${{ secrets.INITIAL_ACCESS_GROUP_EMAIL }}
          INITIAL_ACCESS_GROUP_ID: ${{ vars.INITIAL_ACCESS_GROUP_ID }}
          INITIAL_ACCESS_GROUP_NAME: ${{ vars.INITIAL_ACCESS_GROUP_NAME }}
          REQUIRED_SECRETS: >-
            ${{ vars.GOOGLE_GROUPS_SECRET_ARN }}
            ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
            /psd-eoc/database/application
            /psd-eoc/bootstrap/approved-identity
        run: |
          set -euo pipefail
          bun scripts/deploy-initial-access-group.ts
          missing=0

          echo "Repository variables:"
          for name in AWS_ACCOUNT_ID AWS_REGION ECR_REPOSITORY STACK_NAME APP_PUBLIC_ORIGIN GOOGLE_GROUPS_SECRET_ARN; do
            if [[ -n "${!name:-}" ]]; then
              echo "  ok       $name"
            else
              echo "  MISSING  $name" >&2
              missing=1
            fi
          done

          echo "Secrets Manager:"
          for secret in $REQUIRED_SECRETS; do
            if aws secretsmanager describe-secret --secret-id "$secret" > /dev/null 2>&1; then
              echo "  ok       $secret"
            else
              echo "  MISSING  $secret" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Required configuration is missing. Nothing was built or deployed." >&2
            exit 1
          fi

          if [[ "$EXPO_PUSH_WORKER_ENABLED" != 'false' && "$EXPO_PUSH_WORKER_ENABLED" != 'true' ]]; then
            echo "::error::EXPO_PUSH_WORKER_ENABLED must be exactly true or false." >&2
            exit 1
          fi
          if [[ "$EXPO_PUSH_WORKER_ENABLED" == 'true' ]]; then
            if [[ "$EXPO_CREDENTIAL_VERIFICATION_REFERENCE" == 'UNVERIFIED' || ! "$EXPO_CREDENTIAL_VERIFICATION_REFERENCE" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$ ]]; then
              echo "::error::Enabled Expo push requires a bounded retained credential-verification reference." >&2
              exit 1
            fi
            for secret in /psd-eoc/providers/expo-access-token /psd-eoc/mobile/push-build-allowlist; do
              if ! aws secretsmanager describe-secret --secret-id "$secret" > /dev/null 2>&1; then
                echo "::error::Enabled Expo push is missing protected secret $secret." >&2
                exit 1
              fi
            done
          fi

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The runner's default buildx builder uses the `docker` driver, which
      # cannot export a registry cache. The `docker-container` driver can, and
      # the layer cache is what keeps repeat deploys short.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Layer cache lives in GitHub's cache, not ECR. The ECR repository is
      # IMMUTABLE, so a registry cache tag can never be rewritten — the second
      # deploy always fails with "tag already exists ... cannot be overwritten".
      - name: Build and push the image
        id: image
        if: inputs.rollback_image_digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/container/psd-eoc.Dockerfile
          build-args: |
            SOURCE_REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
            SOURCE_SHA=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve the digest to deploy
        id: target
        shell: bash
        env:
          ROLLBACK_DIGEST: ${{ inputs.rollback_image_digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -n "${ROLLBACK_DIGEST:-}" ]]; then
            digest="$ROLLBACK_DIGEST"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::rollback_image_digest must be sha256:<64 hex characters>" >&2
              exit 1
            fi
            # Refuse an image without exactly one immutable commit tag: the
            # stack records the source represented by the application digest.
            rollback_details=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageDigest=$digest" \
              --query 'imageDetails[0]' \
              --output json)
            source_sha=$(jq -er '
              [.imageTags[]? | select(test("^[0-9a-f]{40}$"))] | unique |
              if length == 1 then .[0] else error("expected one source tag") end
            ' <<< "$rollback_details")
            # Rollback changes the application image, not the migration code.
            # Use the current reviewed image so old application images do not
            # run old bootstrap contracts against the forward-only database.
            if ! bootstrap_digest=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$GITHUB_SHA" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2>/dev/null); then
              echo "::error::The current commit does not have a bootstrap image in the repository" >&2
              exit 1
            fi
          else
            digest="$BUILT_DIGEST"
            source_sha="$GITHUB_SHA"
            bootstrap_digest="$BUILT_DIGEST"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The build did not produce an image digest" >&2
              exit 1
            fi
          fi
          if [[ ! "$bootstrap_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The current commit does not have a bootstrap image in the repository" >&2
            exit 1
          fi
          {
            echo "digest=$digest"
            echo "source_sha=$source_sha"
            echo "bootstrap_digest=$bootstrap_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Record the currently deployed digest
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          current=$(aws apprunner describe-service \
            --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text 2>/dev/null || echo "unknown")
          current_source=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='DeployedAppSourceSha'].OutputValue | [0]" \
            --output text 2>/dev/null || echo "unknown")
          previous_expo_enabled=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='EnableExpoPushWorker'].ParameterValue | [0]" \
            --output text 2>/dev/null || echo "false")
          previous_expo_reference=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Parameters[?ParameterKey=='ExpoCredentialVerificationReference'].ParameterValue | [0]" \
            --output text 2>/dev/null || echo "UNVERIFIED")
          if [[ "$previous_expo_enabled" != 'true' ]]; then
            previous_expo_enabled='false'
          fi
          if [[ ! "$previous_expo_reference" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,254}$ ]]; then
            previous_expo_reference='UNVERIFIED'
          fi
          {
            echo "previous=${current##*@}"
            echo "previous_source=$current_source"
            echo "previous_expo_enabled=$previous_expo_enabled"
            echo "previous_expo_reference=$previous_expo_reference"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Previous image | \`${current##*@}\` |"
            echo "| New image | \`${{ steps.target.outputs.digest }}\` |"
            echo "| Application source | \`${{ steps.target.outputs.source_sha }}\` |"
            echo "| Bootstrap image | \`${{ steps.target.outputs.bootstrap_digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Three ordered phases. CDK only *defines* the bootstrap task definition;
      # nothing in the stack runs it. Deploying the application without running
      # it first would put new code in front of an unmigrated schema.
      #
      # Phase 1 stages the new bootstrap task definition while pinning the
      # application to the digest it is already serving, so the live service is
      # untouched. ProvisionApplication stays true throughout: the App Runner
      # service and its scaling configuration are conditional on it, so passing
      # false would delete the running service and its custom-domain
      # association.
      - name: Stage the bootstrap task without changing the live service
        working-directory: infra
        shell: bash
        env:
          INITIAL_ACCESS_GROUP_EMAIL: ${{ secrets.INITIAL_ACCESS_GROUP_EMAIL }}
          INITIAL_ACCESS_GROUP_ID: ${{ vars.INITIAL_ACCESS_GROUP_ID }}
          INITIAL_ACCESS_GROUP_NAME: ${{ vars.INITIAL_ACCESS_GROUP_NAME }}
          INITIAL_MOBILE_TRANSITION_EMAIL_SHA256: ${{ secrets.INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 }}
          OPERATIONS_ALARM_EMAIL: ${{ secrets.OPERATIONS_ALARM_EMAIL }}
          OPERATIONS_ALARM_SMS_NUMBER: ${{ secrets.OPERATIONS_ALARM_SMS_NUMBER }}
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          BOOTSTRAP_DIGEST: ${{ steps.target.outputs.bootstrap_digest }}
          BOOTSTRAP_SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.target.outputs.digest }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.previous }}
          PREVIOUS_EXPO_ENABLED: ${{ steps.previous.outputs.previous_expo_enabled }}
          PREVIOUS_EXPO_REFERENCE: ${{ steps.previous.outputs.previous_expo_reference }}
          PREVIOUS_SOURCE_SHA: ${{ steps.previous.outputs.previous_source }}
        run: |
          set -euo pipefail
          # Keep the application on what it is serving now. On a stack with no
          # running service there is nothing to preserve, so the new digest is
          # used and the ordering below still holds.
          app_digest="$PREVIOUS_DIGEST"
          app_source_sha="$PREVIOUS_SOURCE_SHA"
          if [[ ! "$app_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$app_source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            app_digest="$IMAGE_DIGEST"
            app_source_sha="$TARGET_SOURCE_SHA"
          fi
          mkdir -p ../artifacts
          bunx --bun cdk \
            --app "bun bin/psd-eoc.ts" \
            deploy "$STACK_NAME" \
            --exclusively \
            --require-approval never \
            --no-notices \
            --outputs-file ../artifacts/stack-outputs.json \
            --parameters "$STACK_NAME:ProvisionApplication=true" \
            --parameters "$STACK_NAME:AppImageDigest=$app_digest" \
            --parameters "$STACK_NAME:RuntimeDatabaseIdleTimeoutSeconds=0" \
            --parameters "$STACK_NAME:EnableExpoPushWorker=$PREVIOUS_EXPO_ENABLED" \
            --parameters "$STACK_NAME:ExpoCredentialVerificationReference=$PREVIOUS_EXPO_REFERENCE" \
            --parameters "$STACK_NAME:BootstrapImageDigest=$BOOTSTRAP_DIGEST" \
            --parameters "$STACK_NAME:BootstrapSourceSha=$BOOTSTRAP_SOURCE_SHA" \
            --parameters "$STACK_NAME:GoogleOauthSecretArn=$GOOGLE_OAUTH_SECRET_ARN" \
            --parameters "$STACK_NAME:GoogleGroupsSecretArn=$GOOGLE_GROUPS_SECRET_ARN" \
            --parameters "$STACK_NAME:InitialAccessGroupId=$INITIAL_ACCESS_GROUP_ID" \
            --parameters "$STACK_NAME:InitialAccessGroupEmail=$INITIAL_ACCESS_GROUP_EMAIL" \
            --parameters "$STACK_NAME:InitialAccessGroupName=$INITIAL_ACCESS_GROUP_NAME" \
            --parameters "$STACK_NAME:InitialMobileTransitionEmailSha256=$INITIAL_MOBILE_TRANSITION_EMAIL_SHA256" \
            --parameters "$STACK_NAME:OperationsTeamAlarmEmail=$OPERATIONS_ALARM_EMAIL" \
            --parameters "$STACK_NAME:OperationsTeamAlarmSmsNumber=$OPERATIONS_ALARM_SMS_NUMBER" \
            --parameters "$STACK_NAME:SourceSha=$app_source_sha"

      # Phase 2 applies migrations. A failure here aborts the deploy with the
      # application still serving its previous digest.
      #
      # The task runs in BOOTSTRAP_MODE=migrate, the only mode there is:
      # schema migrations, the reference catalog, a proof that the application
      # role still works, and the initial access group when a deployment has
      # none at all.
      #
      # That last step is why there is no second mode any more. There used to
      # be one that published a synthetic access fixture for a brand new
      # stack; running it here on 2026-08-18 superseded the live
      # access-membership snapshot and locked every administrator out. What
      # replaced it reads PSD_EOC_INITIAL_ACCESS_GROUP_ID and
      # PSD_EOC_INITIAL_ACCESS_GROUP_EMAIL and creates that group only when no
      # access group exists at all, so it cannot disturb a configured stack.
      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          outputs=artifacts/stack-outputs.json
          cluster=$(jq -er ".\"$STACK_NAME\".BootstrapEcsClusterArn" "$outputs")
          task_definition=$(jq -er ".\"$STACK_NAME\".BootstrapTaskDefinitionArn" "$outputs")
          subnets=$(jq -er ".\"$STACK_NAME\".BootstrapPrivateSubnetIds" "$outputs")
          security_group=$(jq -er ".\"$STACK_NAME\".BootstrapSecurityGroupId" "$outputs")
          log_group=$(jq -er ".\"$STACK_NAME\".BootstrapLogGroupName" "$outputs")

          task_arn=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --count 1 \
            --started-by "deploy-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "::error::The bootstrap task did not start. No migration ran." >&2
            exit 1
          fi
          echo "Bootstrap task: $task_arn"

          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          read -r stop_code exit_code < <(aws ecs describe-tasks \
            --cluster "$cluster" --tasks "$task_arn" \
            --query 'tasks[0].[stopCode,containers[0].exitCode]' --output text)

          if [[ "$exit_code" != "0" ]]; then
            {
              echo ""
              echo "| Migrations | |"
              echo "|---|---|"
              echo "| Task | \`${task_arn##*/}\` |"
              echo "| Stop code | \`$stop_code\` |"
              echo "| Exit code | \`$exit_code\` |"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Bootstrap exited $exit_code ($stop_code). Log stream native-bootstrap/native-bootstrap/${task_arn##*/}. The application was not updated." >&2
            exit 1
          fi

          # The task emits one bounded JSON summary after both idempotence
          # passes. Read only this task's stream and surface the first-access
          # outcome without copying the configured email into Actions output.
          log_stream="native-bootstrap/native-bootstrap/${task_arn##*/}"
          bootstrap_summary=''
          log_error=artifacts/bootstrap-log-read.err
          for _ in {1..20}; do
            if ! messages=$(aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --query 'events[].message' \
              --output json 2> "$log_error"); then
              error_code=$(sed -n 's/.*(\([^)]*\)).*/\1/p' "$log_error" | head -n 1)
              error_code=${error_code:-AWS_CLI_ERROR}
              case "$error_code" in
                ResourceNotFoundException | ThrottlingException | ServiceUnavailableException) ;;
                *)
                  echo "::error::Unable to read the bounded bootstrap summary ($error_code). The application was not updated." >&2
                  exit 1
                  ;;
              esac
              messages='[]'
            fi
            bootstrap_summary=$(jq -rc --arg source_sha "$GITHUB_SHA" \
              '.[] | fromjson? | select(.sourceSha == $source_sha and has("accessBootstrap"))' \
              <<< "$messages" | tail -n 1)
            [[ -n "$bootstrap_summary" ]] && break
            sleep 3
          done

          if [[ -z "$bootstrap_summary" ]]; then
            echo "::error::The bootstrap completed without its bounded summary. The application was not updated." >&2
            exit 1
          fi
          if ! jq -e '
            .mode == "migrate" and
            .database.transport == "native-postgres" and
            .database.migrationsApplied == true and
            .database.tlsVerified == true and
            .idempotence == {runs: 2, equivalent: true}
          ' <<< "$bootstrap_summary" > /dev/null; then
            echo "::error::The bootstrap summary failed validation. The application was not updated." >&2
            exit 1
          fi
          access_outcome=$(jq -er '.accessBootstrap' <<< "$bootstrap_summary")
          case "$access_outcome" in
            created) access_summary='created on this deploy' ;;
            already-configured) access_summary='already existed; no access history changed' ;;
            not-configured) access_summary='intentionally omitted' ;;
            *)
              echo "::error::The bootstrap reported an invalid initial-access outcome. The application was not updated." >&2
              exit 1
              ;;
          esac

          {
            echo ""
            echo "| Migrations | |"
            echo "|---|---|"
            echo "| Task | \`${task_arn##*/}\` |"
            echo "| Stop code | \`$stop_code\` |"
            echo "| Exit code | \`$exit_code\` |"
            echo "| Initial access group | $access_summary |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Migrations applied."

      # Phase 3 cuts the application over, now that the schema is current.
      - name: Deploy the application
        working-directory: infra
        shell: bash
        env:
          INITIAL_ACCESS_GROUP_EMAIL: ${{ secrets.INITIAL_ACCESS_GROUP_EMAIL }}
          INITIAL_ACCESS_GROUP_ID: ${{ vars.INITIAL_ACCESS_GROUP_ID }}
          INITIAL_ACCESS_GROUP_NAME: ${{ vars.INITIAL_ACCESS_GROUP_NAME }}
          INITIAL_MOBILE_TRANSITION_EMAIL_SHA256: ${{ secrets.INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 }}
          OPERATIONS_ALARM_EMAIL: ${{ secrets.OPERATIONS_ALARM_EMAIL }}
          OPERATIONS_ALARM_SMS_NUMBER: ${{ secrets.OPERATIONS_ALARM_SMS_NUMBER }}
          TARGET_SOURCE_SHA: ${{ steps.target.outputs.source_sha }}
          BOOTSTRAP_DIGEST: ${{ steps.target.outputs.bootstrap_digest }}
          BOOTSTRAP_SOURCE_SHA: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.target.outputs.digest }}
        run: |
          set -euo pipefail
          bunx --bun cdk \
            --app "bun bin/psd-eoc.ts" \
            deploy "$STACK_NAME" \
            --exclusively \
            --require-approval never \
            --no-notices \
            --parameters "$STACK_NAME:ProvisionApplication=true" \
            --parameters "$STACK_NAME:AppImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:RuntimeDatabaseIdleTimeoutSeconds=0" \
            --parameters "$STACK_NAME:EnableExpoPushWorker=$EXPO_PUSH_WORKER_ENABLED" \
            --parameters "$STACK_NAME:ExpoCredentialVerificationReference=$EXPO_CREDENTIAL_VERIFICATION_REFERENCE" \
            --parameters "$STACK_NAME:BootstrapImageDigest=$BOOTSTRAP_DIGEST" \
            --parameters "$STACK_NAME:BootstrapSourceSha=$BOOTSTRAP_SOURCE_SHA" \
            --parameters "$STACK_NAME:GoogleOauthSecretArn=$GOOGLE_OAUTH_SECRET_ARN" \
            --parameters "$STACK_NAME:GoogleGroupsSecretArn=$GOOGLE_GROUPS_SECRET_ARN" \
            --parameters "$STACK_NAME:InitialAccessGroupId=$INITIAL_ACCESS_GROUP_ID" \
            --parameters "$STACK_NAME:InitialAccessGroupEmail=$INITIAL_ACCESS_GROUP_EMAIL" \
            --parameters "$STACK_NAME:InitialAccessGroupName=$INITIAL_ACCESS_GROUP_NAME" \
            --parameters "$STACK_NAME:InitialMobileTransitionEmailSha256=$INITIAL_MOBILE_TRANSITION_EMAIL_SHA256" \
            --parameters "$STACK_NAME:OperationsTeamAlarmEmail=$OPERATIONS_ALARM_EMAIL" \
            --parameters "$STACK_NAME:OperationsTeamAlarmSmsNumber=$OPERATIONS_ALARM_SMS_NUMBER" \
            --parameters "$STACK_NAME:SourceSha=$TARGET_SOURCE_SHA"

      # These two checks decide success. Everything above is build work.
      - name: Verify the service is running the deployed image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            read -r status image < <(aws apprunner describe-service \
              --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}" \
              --query 'Service.[Status,SourceConfiguration.ImageRepository.ImageIdentifier]' \
              --output text)
            if [[ "$status" == "RUNNING" && "${image##*@}" == "${{ steps.target.outputs.digest }}" ]]; then
              echo "Service RUNNING on ${image##*@}"
              exit 0
            fi
            if [[ "$status" == "CREATE_FAILED" || "$status" == "DELETED" ]]; then
              echo "::error::App Runner reported status $status" >&2
              exit 1
            fi
            echo "attempt $attempt: status=$status"
            sleep 15
          done
          echo "::error::Service did not reach RUNNING on the deployed digest" >&2
          exit 1

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 \
              "$APP_PUBLIC_ORIGIN/api/health" || echo "000")
            if [[ "$code" == "200" ]]; then
              echo "Health OK: $(cat /tmp/health.json)"
              {
                echo ""
                echo "Deployed and healthy at $APP_PUBLIC_ORIGIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: http=$code"
            sleep 10
          done
          echo "::error::$APP_PUBLIC_ORIGIN/api/health did not return 200" >&2
          echo "Roll back with: gh workflow run deploy.yml -f rollback_image_digest=${{ steps.previous.outputs.previous }}" >&2
          exit 1
