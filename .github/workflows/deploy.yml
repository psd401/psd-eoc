name: Deploy

run-name: deploy ${{ inputs.rollback_image_digest || github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_image_digest:
        description: Previously deployed image digest to roll back to. Leave empty to build and deploy this commit.
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: psd-eoc-deploy
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  STACK_NAME: ${{ vars.STACK_NAME }}
  APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
  GOOGLE_OAUTH_SECRET_ARN: ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
  GOOGLE_GROUPS_SECRET_ARN: ${{ vars.GOOGLE_GROUPS_SECRET_ARN }}

jobs:
  deploy:
    name: Build and deploy
    if: github.repository == 'psd401/psd-eoc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: exploration-smoke
    steps:
      - name: Check out the commit being deployed
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_EXPLORATION_SMOKE_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Every required piece of configuration is checked by name before any
      # build or deploy work happens. A missing secret previously surfaced as
      # an ECS task that could not start, discovered days later, with no usable
      # error message anywhere in the failure output (see issue #271).
      #
      # The deployment role holds secretsmanager:DescribeSecret on each ARN
      # below. That returns metadata only; it never grants GetSecretValue, so
      # this step cannot read a secret's contents.
      - name: Verify required configuration exists
        shell: bash
        env:
          REQUIRED_SECRETS: >-
            ${{ vars.GOOGLE_GROUPS_SECRET_ARN }}
            ${{ vars.GOOGLE_OAUTH_SECRET_ARN }}
            /psd-eoc/exploration-smoke/database/application
            /psd-eoc/exploration-smoke/bootstrap/approved-identity
        run: |
          set -euo pipefail
          missing=0

          echo "Repository variables:"
          for name in AWS_ACCOUNT_ID AWS_REGION ECR_REPOSITORY STACK_NAME APP_PUBLIC_ORIGIN GOOGLE_GROUPS_SECRET_ARN; do
            if [[ -n "${!name:-}" ]]; then
              echo "  ok       $name"
            else
              echo "  MISSING  $name" >&2
              missing=1
            fi
          done

          echo "Secrets Manager:"
          for secret in $REQUIRED_SECRETS; do
            if aws secretsmanager describe-secret --secret-id "$secret" > /dev/null 2>&1; then
              echo "  ok       $secret"
            else
              echo "  MISSING  $secret" >&2
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "::error::Required configuration is missing. Nothing was built or deployed." >&2
            exit 1
          fi

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # The runner's default buildx builder uses the `docker` driver, which
      # cannot export a registry cache. The `docker-container` driver can, and
      # the layer cache is what keeps repeat deploys short.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      # Layer cache lives in GitHub's cache, not ECR. The ECR repository is
      # IMMUTABLE, so a registry cache tag can never be rewritten — the second
      # deploy always fails with "tag already exists ... cannot be overwritten".
      - name: Build and push the image
        id: image
        if: inputs.rollback_image_digest == ''
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/server/container/psd-eoc.Dockerfile
          build-args: SOURCE_SHA=${{ github.sha }}
          platforms: linux/amd64
          provenance: false
          sbom: false
          push: true
          tags: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve the digest to deploy
        id: target
        shell: bash
        env:
          ROLLBACK_DIGEST: ${{ inputs.rollback_image_digest }}
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ -n "${ROLLBACK_DIGEST:-}" ]]; then
            digest="$ROLLBACK_DIGEST"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::rollback_image_digest must be sha256:<64 hex characters>" >&2
              exit 1
            fi
            # Refuse to roll back to an image that is not in the registry.
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageDigest=$digest" > /dev/null
          else
            digest="$BUILT_DIGEST"
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::The build did not produce an image digest" >&2
              exit 1
            fi
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the currently deployed digest
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          current=$(aws apprunner describe-service \
            --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}" \
            --query 'Service.SourceConfiguration.ImageRepository.ImageIdentifier' \
            --output text 2>/dev/null || echo "unknown")
          echo "previous=${current##*@}" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Previous image | \`${current##*@}\` |"
            echo "| New image | \`${{ steps.target.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Three ordered phases. CDK only *defines* the bootstrap task definition;
      # nothing in the stack runs it. Deploying the application without running
      # it first would put new code in front of an unmigrated schema.
      #
      # Phase 1 stages the new bootstrap task definition while pinning the
      # application to the digest it is already serving, so the live service is
      # untouched. ProvisionApplication stays true throughout: the App Runner
      # service and its scaling configuration are conditional on it, so passing
      # false would delete the running service and its custom-domain
      # association.
      - name: Stage the bootstrap task without changing the live service
        working-directory: infra
        shell: bash
        env:
          INITIAL_MOBILE_TRANSITION_EMAIL_SHA256: ${{ secrets.EXPLORATION_SMOKE_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 }}
          OPERATIONS_ALARM_EMAIL: ${{ secrets.EXPLORATION_SMOKE_OPERATIONS_ALARM_EMAIL }}
          OPERATIONS_ALARM_SMS_NUMBER: ${{ secrets.EXPLORATION_SMOKE_OPERATIONS_ALARM_SMS_NUMBER }}
          IMAGE_DIGEST: ${{ steps.target.outputs.digest }}
          PREVIOUS_DIGEST: ${{ steps.previous.outputs.previous }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Keep the application on what it is serving now. On a stack with no
          # running service there is nothing to preserve, so the new digest is
          # used and the ordering below still holds.
          app_digest="$PREVIOUS_DIGEST"
          if [[ ! "$app_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            app_digest="$IMAGE_DIGEST"
          fi
          mkdir -p ../artifacts
          bunx --bun cdk \
            --app "bun bin/psd-eoc.ts" \
            deploy "$STACK_NAME" \
            --exclusively \
            --require-approval never \
            --no-notices \
            --outputs-file ../artifacts/stack-outputs.json \
            --parameters "$STACK_NAME:ProvisionApplication=true" \
            --parameters "$STACK_NAME:AppImageDigest=$app_digest" \
            --parameters "$STACK_NAME:RuntimeDatabaseIdleTimeoutSeconds=0" \
            --parameters "$STACK_NAME:BootstrapImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:BootstrapSourceSha=$SOURCE_SHA" \
            --parameters "$STACK_NAME:GoogleOauthSecretArn=$GOOGLE_OAUTH_SECRET_ARN" \
            --parameters "$STACK_NAME:GoogleGroupsSecretArn=$GOOGLE_GROUPS_SECRET_ARN" \
            --parameters "$STACK_NAME:InitialMobileTransitionEmailSha256=$INITIAL_MOBILE_TRANSITION_EMAIL_SHA256" \
            --parameters "$STACK_NAME:OperationsTeamAlarmEmail=$OPERATIONS_ALARM_EMAIL" \
            --parameters "$STACK_NAME:OperationsTeamAlarmSmsNumber=$OPERATIONS_ALARM_SMS_NUMBER" \
            --parameters "$STACK_NAME:SourceSha=$SOURCE_SHA"

      # Phase 2 applies migrations. A failure here aborts the deploy with the
      # application still serving its previous digest.
      #
      # The task runs in BOOTSTRAP_MODE=migrate, the only mode there is:
      # schema migrations, the reference catalog, a proof that the application
      # role still works, and the initial access group when a deployment has
      # none at all.
      #
      # That last step is why there is no second mode any more. There used to
      # be one that published a synthetic access fixture for a brand new
      # stack; running it here on 2026-08-18 superseded the live
      # access-membership snapshot and locked every administrator out. What
      # replaced it reads PSD_EOC_INITIAL_ACCESS_GROUP_ID and
      # PSD_EOC_INITIAL_ACCESS_GROUP_EMAIL and creates that group only when no
      # access group exists at all, so it cannot disturb a configured stack.
      - name: Run database migrations
        shell: bash
        run: |
          set -euo pipefail
          outputs=artifacts/stack-outputs.json
          cluster=$(jq -er ".\"$STACK_NAME\".BootstrapEcsClusterArn" "$outputs")
          task_definition=$(jq -er ".\"$STACK_NAME\".BootstrapTaskDefinitionArn" "$outputs")
          subnets=$(jq -er ".\"$STACK_NAME\".BootstrapPrivateSubnetIds" "$outputs")
          security_group=$(jq -er ".\"$STACK_NAME\".BootstrapSecurityGroupId" "$outputs")

          task_arn=$(aws ecs run-task \
            --cluster "$cluster" \
            --task-definition "$task_definition" \
            --launch-type FARGATE \
            --platform-version LATEST \
            --count 1 \
            --started-by "deploy-${GITHUB_RUN_ID}" \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$security_group],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          if [[ -z "$task_arn" || "$task_arn" == "None" ]]; then
            echo "::error::The bootstrap task did not start. No migration ran." >&2
            exit 1
          fi
          echo "Bootstrap task: $task_arn"

          aws ecs wait tasks-stopped --cluster "$cluster" --tasks "$task_arn"
          read -r stop_code exit_code < <(aws ecs describe-tasks \
            --cluster "$cluster" --tasks "$task_arn" \
            --query 'tasks[0].[stopCode,containers[0].exitCode]' --output text)

          {
            echo ""
            echo "| Migrations | |"
            echo "|---|---|"
            echo "| Task | \`${task_arn##*/}\` |"
            echo "| Stop code | \`$stop_code\` |"
            echo "| Exit code | \`$exit_code\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$exit_code" != "0" ]]; then
            echo "::error::Bootstrap exited $exit_code ($stop_code). Log stream native-bootstrap/native-bootstrap/${task_arn##*/}. The application was not updated." >&2
            exit 1
          fi
          echo "Migrations applied."

      # Phase 3 cuts the application over, now that the schema is current.
      - name: Deploy the application
        working-directory: infra
        shell: bash
        env:
          INITIAL_MOBILE_TRANSITION_EMAIL_SHA256: ${{ secrets.EXPLORATION_SMOKE_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 }}
          OPERATIONS_ALARM_EMAIL: ${{ secrets.EXPLORATION_SMOKE_OPERATIONS_ALARM_EMAIL }}
          OPERATIONS_ALARM_SMS_NUMBER: ${{ secrets.EXPLORATION_SMOKE_OPERATIONS_ALARM_SMS_NUMBER }}
          IMAGE_DIGEST: ${{ steps.target.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bunx --bun cdk \
            --app "bun bin/psd-eoc.ts" \
            deploy "$STACK_NAME" \
            --exclusively \
            --require-approval never \
            --no-notices \
            --parameters "$STACK_NAME:ProvisionApplication=true" \
            --parameters "$STACK_NAME:AppImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:RuntimeDatabaseIdleTimeoutSeconds=0" \
            --parameters "$STACK_NAME:BootstrapImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:BootstrapSourceSha=$SOURCE_SHA" \
            --parameters "$STACK_NAME:GoogleOauthSecretArn=$GOOGLE_OAUTH_SECRET_ARN" \
            --parameters "$STACK_NAME:GoogleGroupsSecretArn=$GOOGLE_GROUPS_SECRET_ARN" \
            --parameters "$STACK_NAME:InitialMobileTransitionEmailSha256=$INITIAL_MOBILE_TRANSITION_EMAIL_SHA256" \
            --parameters "$STACK_NAME:OperationsTeamAlarmEmail=$OPERATIONS_ALARM_EMAIL" \
            --parameters "$STACK_NAME:OperationsTeamAlarmSmsNumber=$OPERATIONS_ALARM_SMS_NUMBER" \
            --parameters "$STACK_NAME:SourceSha=$SOURCE_SHA"

      # These two checks decide success. Everything above is build work.
      - name: Verify the service is running the deployed image
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..40}; do
            read -r status image < <(aws apprunner describe-service \
              --service-arn "${{ vars.APP_RUNNER_SERVICE_ARN }}" \
              --query 'Service.[Status,SourceConfiguration.ImageRepository.ImageIdentifier]' \
              --output text)
            if [[ "$status" == "RUNNING" && "${image##*@}" == "${{ steps.target.outputs.digest }}" ]]; then
              echo "Service RUNNING on ${image##*@}"
              exit 0
            fi
            if [[ "$status" == "CREATE_FAILED" || "$status" == "DELETED" ]]; then
              echo "::error::App Runner reported status $status" >&2
              exit 1
            fi
            echo "attempt $attempt: status=$status"
            sleep 15
          done
          echo "::error::Service did not reach RUNNING on the deployed digest" >&2
          exit 1

      - name: Verify application health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 \
              "$APP_PUBLIC_ORIGIN/api/health" || echo "000")
            if [[ "$code" == "200" ]]; then
              echo "Health OK: $(cat /tmp/health.json)"
              {
                echo ""
                echo "Deployed and healthy at $APP_PUBLIC_ORIGIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "attempt $attempt: http=$code"
            sleep 10
          done
          echo "::error::$APP_PUBLIC_ORIGIN/api/health did not return 200" >&2
          echo "Roll back with: gh workflow run deploy.yml -f rollback_image_digest=${{ steps.previous.outputs.previous }}" >&2
          exit 1
