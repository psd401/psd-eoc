name: PSD CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  psd-ci:
    uses: PSD401/.github/.github/workflows/reusable-psd-ci.yml@8c4dbb4e6ae79345ec5f56a96de522e9528e3fb4 # v1.1.0
    with:
      # pdftotext (Poppler) is required: the unit gate fails on any runtime
      # skip, and pdf.test.ts skips its 6 rendering tests without it. Same
      # apt step as ci.yml's gate job.
      install-command: 'sudo apt-get update && sudo apt-get install --yes poppler-utils && bun install --frozen-lockfile'
      # Static half of `bun run check` (the repo's authoritative gate).
      lint-command: 'bun run format:check && bun run lint && bun run verify:config && bun run verify:docs'
      # `test` is test:full, which requires PostgreSQL (TEST_DATABASE_URL) and
      # Poppler; ci.yml's gate job covers it. test:unit is the repo's
      # database-free subset (scripts/test.ts --unit-only).
      test-command: 'bun run test:unit'
