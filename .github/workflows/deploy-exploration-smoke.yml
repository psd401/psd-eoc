                --output text)" = "$prior_vpc_connector_arn"
              import_aws cloudformation execute-change-set \
                --stack-name "$STACK_NAME" \
                --change-set-name "$change_set_id" \
                --client-request-token "$import_client_token"
              import_aws cloudformation wait stack-import-complete --stack-name "$STACK_NAME"
              test "$(import_aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --query 'Stacks[0].StackStatus' \
                --output text)" = "IMPORT_COMPLETE"
              test "$(import_aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --query 'Stacks[0].RoleARN' \
                --output text)" = "$CDK_CFN_EXEC_ROLE_ARN"
              test "$(import_aws cloudformation describe-stacks \
                --stack-name "$STACK_NAME" \
                --query "Stacks[0].Outputs[?OutputKey=='AppRunnerVpcConnectorArn'].OutputValue | [0]" \
                --output text)" = "$prior_vpc_connector_arn"
              import_aws cloudformation get-template \
                --stack-name "$STACK_NAME" \
                --template-stage Original \
                --output json > "$imported_template_response"
              jq -e '
                (.TemplateBody | type) == "object" and
                (.TemplateBody.Resources | type) == "object"
              ' "$imported_template_response" > /dev/null
              jq -S '.TemplateBody' "$imported_template_response" > "$imported_template"
              jq -e --slurpfile expected "$import_template" \
                '. == $expected[0]' "$imported_template" > /dev/null
            )
            import_exit_code=$?
            set -e
            unset deploy_credentials deploy_access_key deploy_secret_key deploy_session_token
            if [[ "$import_exit_code" -ne 0 ]]; then
              exit "$import_exit_code"
            fi
            unset import_exit_code

            post_import_caller_arn=$(aws sts get-caller-identity --query Arn --output text)
            test "$post_import_caller_arn" = "$oidc_caller_arn"
            printf '%s\n' "$post_import_caller_arn" \
              > ../artifacts/readback/email-recovery-post-import-caller-arn.txt
            unset oidc_caller_arn post_import_caller_arn

            aws cloudformation list-stack-resources --stack-name "$STACK_NAME" > "$after_resources"
            jq -e --slurpfile expected "$mapping" '
              def imported($id; $type; $physical):
                [.StackResourceSummaries[] | select(
                  .LogicalResourceId == $id and
                  .ResourceType == $type and
                  .PhysicalResourceId == $physical and
                  (
                    .ResourceStatus == "CREATE_COMPLETE" or
                    .ResourceStatus == "UPDATE_COMPLETE" or
                    .ResourceStatus == "IMPORT_COMPLETE"
                  )
                )] | length == 1;
              imported("EmailWorkerLogGroup0611E5C2"; "AWS::Logs::LogGroup"; $expected[0].EmailWorkerLogGroup0611E5C2.LogGroupName) and
              imported("EmailDeadLetterQueue5E91C06C"; "AWS::SQS::Queue"; $expected[0].EmailDeadLetterQueue5E91C06C.QueueUrl) and
              imported("EmailConfigurationSet"; "AWS::SES::ConfigurationSet"; $expected[0].EmailConfigurationSet.Name) and
              imported("EmailEventsKey619540BF"; "AWS::KMS::Key"; $expected[0].EmailEventsKey619540BF.KeyId) and
              imported("EmailQueue9C1DA90F"; "AWS::SQS::Queue"; $expected[0].EmailQueue9C1DA90F.QueueUrl) and
              imported("EmailEventsTopic13C4A145"; "AWS::SNS::Topic"; $expected[0].EmailEventsTopic13C4A145.TopicArn)
            ' "$after_resources" > /dev/null
            jq -n --arg state imported '{state: $state}' > ../artifacts/readback/email-recovery-result.json
          else
            echo "Retained dark-email resources are partial or ambiguous; refusing recovery." >&2
            exit 1
          fi

      - name: Stage the exact native bootstrap without changing the live service
        env:
          APPROVED_GOOGLE_SUBJECT: ${{ secrets.EXPLORATION_SMOKE_APPROVED_GOOGLE_SUBJECT }}
          APPROVED_STAFF_DISPLAY_NAME: ${{ secrets.EXPLORATION_SMOKE_APPROVED_STAFF_DISPLAY_NAME }}
          APPROVED_STAFF_EMAIL: ${{ secrets.EXPLORATION_SMOKE_APPROVED_STAFF_EMAIL }}
          INITIAL_MOBILE_TRANSITION_EMAIL_SHA256: ${{ secrets.EXPLORATION_SMOKE_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 }}
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          stack_file=../artifacts/readback/stack-before.json
          if aws cloudformation describe-stacks --stack-name "$STACK_NAME" > "$stack_file" 2> ../artifacts/readback/stack-before-error.txt; then
            current_digest=$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "AppImageDigest") | .ParameterValue' "$stack_file")
            current_provision=$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "ProvisionApplication") | .ParameterValue' "$stack_file")
            current_status=$(jq -er '.Stacks[0].StackStatus' "$stack_file")
            case "$current_status" in
              CREATE_COMPLETE | IMPORT_COMPLETE | UPDATE_COMPLETE | UPDATE_ROLLBACK_COMPLETE) ;;
              *)
                echo "Stack state $current_status is not safe for an automated retry." >&2
                exit 1
                ;;
            esac
            test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "DeploymentAccount") | .OutputValue' "$stack_file")" = "$AWS_ACCOUNT_ID"
            test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "DeploymentRegion") | .OutputValue' "$stack_file")" = "$AWS_REGION"
            test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "ExpectedAwsAccountAlias") | .OutputValue' "$stack_file")" = "$AWS_ACCOUNT_ALIAS"
            current_environment_name=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EnvironmentName") | .OutputValue' "$stack_file")
            current_data_classification=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "DataClassification") | .OutputValue' "$stack_file")
            case "$current_environment_name|$current_data_classification" in
              "exploration-smoke|synthetic-only")
                test "$(jq '[.Stacks[0].Outputs[] | select(.OutputKey == "SesIntegrationTruth" or .OutputKey == "EmailChannelState")] | length' "$stack_file")" -eq 0
                ;;
              "live-pilot|staff-minimized")
                test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIntegrationTruth") | .OutputValue' "$stack_file")" = "configured-unverified"
                test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailChannelState") | .OutputValue' "$stack_file")" = "disabled"
                ;;
              *)
                echo "The current environment and data-classification pair is not an approved transition state." >&2
                exit 1
                ;;
            esac
            if [[ "$current_provision" == "true" ]]; then
              test "$PREVIOUS_IMAGE_DIGEST" != "none"
              test "$current_digest" = "$PREVIOUS_IMAGE_DIGEST"
              current_source_sha=$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "SourceSha") | .ParameterValue' "$stack_file")
              [[ "$current_source_sha" =~ ^[0-9a-f]{40}$ ]]
              current_service_arn=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "AppRunnerServiceArn") | .OutputValue' "$stack_file")
              [[ "$current_service_arn" =~ ^arn:aws:apprunner:us-west-2:338414773271:service/psd-eoc-exploration-smoke/[A-Za-z0-9]{32}$ ]]
              aws apprunner describe-service \
                --service-arn "$current_service_arn" \
                --query 'Service.{ServiceArn:ServiceArn,ServiceId:ServiceId,ServiceName:ServiceName,Status:Status,ImageIdentifier:SourceConfiguration.ImageRepository.ImageIdentifier,SourceSha:SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables.SOURCE_SHA,DatabaseIdleTimeoutSeconds:SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables.DATABASE_IDLE_TIMEOUT_SECONDS}' \
                > ../artifacts/readback/app-runner-before.json
              test "$(jq -r .ServiceArn ../artifacts/readback/app-runner-before.json)" = "$current_service_arn"
              test "$(jq -r .ServiceName ../artifacts/readback/app-runner-before.json)" = "psd-eoc-exploration-smoke"
              test "$(jq -r .Status ../artifacts/readback/app-runner-before.json)" = "RUNNING"
              test "$(jq -r .ImageIdentifier ../artifacts/readback/app-runner-before.json)" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/psd-eoc/exploration-smoke/server@$current_digest"
              current_runtime_source_sha=$(jq -er '.SourceSha' ../artifacts/readback/app-runner-before.json)
              [[ "$current_runtime_source_sha" =~ ^[0-9a-f]{40}$ ]]
              test "$current_source_sha" = "$current_runtime_source_sha"
              current_runtime_idle_timeout=$(jq -er '.DatabaseIdleTimeoutSeconds' ../artifacts/readback/app-runner-before.json)
              [[ "$current_runtime_idle_timeout" =~ ^[0-9]+$ ]]
              (( 10#$current_runtime_idle_timeout <= 600 ))
              phase_provision=true
              phase_app_digest=$current_digest
              phase_runtime_idle_timeout=$current_runtime_idle_timeout
              phase_source_sha=$current_runtime_source_sha
            else
              test "$current_provision" = "false"
              test "$current_digest" = "$ZERO_IMAGE_DIGEST"
              test "$PREVIOUS_IMAGE_DIGEST" = "none"
              aws cloudformation list-stack-resources --stack-name "$STACK_NAME" \
                > ../artifacts/readback/phase-one-resources.json
              test "$(jq '[.StackResourceSummaries[] | select(.ResourceType == "AWS::AppRunner::Service")] | length' ../artifacts/readback/phase-one-resources.json)" -eq 0
              phase_provision=false
              phase_app_digest=$ZERO_IMAGE_DIGEST
              phase_runtime_idle_timeout=0
              phase_source_sha=$SOURCE_SHA
            fi
          else
            grep -q 'does not exist' ../artifacts/readback/stack-before-error.txt
            test "$PREVIOUS_IMAGE_DIGEST" = "none"
            phase_provision=false
            phase_app_digest=$ZERO_IMAGE_DIGEST
            phase_runtime_idle_timeout=0
            phase_source_sha=$SOURCE_SHA
          fi

          bunx --bun cdk \
            --app "bun bin/exploration-smoke.ts" \
            deploy "$STACK_NAME" \
            --exclusively \
            --require-approval never \
            --no-notices \
            --outputs-file ../artifacts/readback/bootstrap-phase-outputs.json \
            --parameters "$STACK_NAME:ProvisionApplication=$phase_provision" \
            --parameters "$STACK_NAME:AppImageDigest=$phase_app_digest" \
            --parameters "$STACK_NAME:RuntimeDatabaseIdleTimeoutSeconds=$phase_runtime_idle_timeout" \
            --parameters "$STACK_NAME:SourceSha=$phase_source_sha" \
            --parameters "$STACK_NAME:BootstrapImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:BootstrapSourceSha=$SOURCE_SHA" \
            --parameters "$STACK_NAME:GoogleOauthSecretArn=$GOOGLE_OAUTH_SECRET_ARN" \
            --parameters "$STACK_NAME:ApprovedGoogleSubject=$APPROVED_GOOGLE_SUBJECT" \
            --parameters "$STACK_NAME:ApprovedStaffEmail=$APPROVED_STAFF_EMAIL" \
            --parameters "$STACK_NAME:ApprovedStaffDisplayName=$APPROVED_STAFF_DISPLAY_NAME" \
            --parameters "$STACK_NAME:InitialMobileTransitionEmailSha256=$INITIAL_MOBILE_TRANSITION_EMAIL_SHA256"

          aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            > ../artifacts/readback/stack-repository-phase.json
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "AppRunnerVpcConnectorArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "$(cat ../artifacts/readback/app-runner-vpc-connector-before.txt)"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "ProvisionApplication") | .ParameterValue' ../artifacts/readback/stack-repository-phase.json)" = "$phase_provision"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "AppImageDigest") | .ParameterValue' ../artifacts/readback/stack-repository-phase.json)" = "$phase_app_digest"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "RuntimeDatabaseIdleTimeoutSeconds") | .ParameterValue' ../artifacts/readback/stack-repository-phase.json)" = "$phase_runtime_idle_timeout"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "SourceSha") | .ParameterValue' ../artifacts/readback/stack-repository-phase.json)" = "$phase_source_sha"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "BootstrapImageDigest") | .ParameterValue' ../artifacts/readback/stack-repository-phase.json)" = "$IMAGE_DIGEST"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "BootstrapSourceSha") | .ParameterValue' ../artifacts/readback/stack-repository-phase.json)" = "$SOURCE_SHA"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EnvironmentName") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "live-pilot"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "DataClassification") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "staff-minimized"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailQueueArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "arn:aws:sqs:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-email"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailQueueUrl") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "https://sqs.$AWS_REGION.amazonaws.com/$AWS_ACCOUNT_ID/psd-eoc-email"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailDeadLetterQueueArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "arn:aws:sqs:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-email-dlq"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailWorkerLogGroupName") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "/psd-eoc/workers/email"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIdentityArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "arn:aws:ses:$AWS_REGION:$AWS_ACCOUNT_ID:identity/psd401.net"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIdentityDomain") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "psd401.net"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesFromAddress") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "eoc-alerts@psd401.net"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesConfigurationSetName") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "psd-eoc-transactional"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesEmailEventsTopicArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "arn:aws:sns:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-email-events"
          [[ "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesEmailEventsKeyArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" =~ ^arn:aws:kms:us-west-2:338414773271:key/[0-9a-f-]{36}$ ]]
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIntegrationTruth") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "configured-unverified"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailChannelState") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)" = "disabled"
          if [[ "$phase_provision" == "true" ]]; then
            phase_service_arn=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "AppRunnerServiceArn") | .OutputValue' ../artifacts/readback/stack-repository-phase.json)
            aws apprunner describe-service \
              --service-arn "$phase_service_arn" \
              --query 'Service.{Status:Status,ImageIdentifier:SourceConfiguration.ImageRepository.ImageIdentifier,RuntimeEnvironmentVariables:SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables}' \
              > ../artifacts/readback/app-runner-repository-phase.json
            test "$(jq -er '.Status' ../artifacts/readback/app-runner-repository-phase.json)" = "RUNNING"
            test "$(jq -er '.ImageIdentifier' ../artifacts/readback/app-runner-repository-phase.json)" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/psd-eoc/exploration-smoke/server@$phase_app_digest"
            test "$(jq -er '.RuntimeEnvironmentVariables.SOURCE_SHA' ../artifacts/readback/app-runner-repository-phase.json)" = "$phase_source_sha"
            test "$(jq -er '.RuntimeEnvironmentVariables.DATABASE_IDLE_TIMEOUT_SECONDS' ../artifacts/readback/app-runner-repository-phase.json)" = "$phase_runtime_idle_timeout"
          fi

      - name: Publish and verify only the approved image digest
        shell: bash
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" > artifacts/readback/stack-repository-phase.json
          repository_uri=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "ImageRepositoryUri") | .OutputValue' artifacts/readback/stack-repository-phase.json)
          repository_arn=$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "ImageRepositoryArn") | .OutputValue' artifacts/readback/stack-repository-phase.json)
          [[ "$repository_uri" == "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/psd-eoc/exploration-smoke/server" ]]
          [[ "$repository_arn" == "arn:aws:ecr:$AWS_REGION:$AWS_ACCOUNT_ID:repository/psd-eoc/exploration-smoke/server" ]]

          aws ecr describe-repositories \
            --repository-names psd-eoc/exploration-smoke/server \
            > artifacts/readback/ecr-repository.json
          test "$(jq -r '.repositories[0].imageTagMutability' artifacts/readback/ecr-repository.json)" = "IMMUTABLE"

          if aws ecr describe-images \
            --repository-name psd-eoc/exploration-smoke/server \
            --image-ids "imageDigest=$IMAGE_DIGEST" \
            > artifacts/readback/ecr-image.json 2> artifacts/readback/ecr-image-before-error.txt; then
            echo "The approved digest already exists; publication is idempotently skipped."
          else
            grep -q 'ImageNotFoundException' artifacts/readback/ecr-image-before-error.txt
            registry_name="psd-eoc-deploy-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            registry_data="$RUNNER_TEMP/exploration-smoke-source-registry"
            mkdir "$registry_data"
            tar --extract --file artifacts/image-registry.tar --directory "$registry_data"
            cleanup_registry() {
              docker rm --force "$registry_name" > /dev/null 2>&1 || true
            }
            trap cleanup_registry EXIT
            docker run \
              --detach \
              --rm \
              --name "$registry_name" \
              --publish 127.0.0.1:5000:5000 \
              --volume "$registry_data:/var/lib/registry" \
              "$LOCAL_REGISTRY_IMAGE" > /dev/null
            for attempt in {1..20}; do
              if curl --fail --silent --show-error http://127.0.0.1:5000/v2/ > /dev/null; then
                break
              fi
              if [[ "$attempt" -eq 20 ]]; then
                echo "The restored loopback registry did not start." >&2
                exit 1
              fi
              sleep 1
            done
            source_reference="$LOCAL_REGISTRY_REPOSITORY@$IMAGE_DIGEST"
            test "$(docker buildx imagetools inspect "$source_reference" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$IMAGE_DIGEST"
            docker buildx imagetools inspect --raw "$source_reference" \
              > artifacts/readback/source-image-manifest.json
            test "sha256:$(sha256sum artifacts/readback/source-image-manifest.json | cut -d' ' -f1)" = "$IMAGE_DIGEST"

            registry=${repository_uri%%/*}
            aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
            remote_tag="source-$SOURCE_SHA"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$repository_uri:$remote_tag" \
              --metadata-file artifacts/readback/ecr-copy-metadata.json \
              "$source_reference"
            test "$(jq -er '."containerimage.descriptor".digest' artifacts/readback/ecr-copy-metadata.json)" = "$IMAGE_DIGEST"
            docker rm --force "$registry_name" > /dev/null
            trap - EXIT
            aws ecr describe-images \
              --repository-name psd-eoc/exploration-smoke/server \
              --image-ids "imageDigest=$IMAGE_DIGEST" \
              > artifacts/readback/ecr-image.json
          fi
          test "$(jq -r '.imageDetails[0].imageDigest' artifacts/readback/ecr-image.json)" = "$IMAGE_DIGEST"

      - name: Prove the dedicated access sync task is least privilege and dark
        shell: bash
        run: |
          set -euo pipefail
          outputs=artifacts/readback/bootstrap-phase-outputs.json
          cluster_arn=$(jq -er ".${STACK_NAME}.BootstrapEcsClusterArn" "$outputs")
          access_task_definition_arn=$(jq -er ".${STACK_NAME}.AccessSyncTaskDefinitionArn" "$outputs")
          access_execution_role_arn=$(jq -er ".${STACK_NAME}.AccessSyncTaskExecutionRoleArn" "$outputs")
          access_task_role_arn=$(jq -er ".${STACK_NAME}.AccessSyncTaskRoleArn" "$outputs")
          bootstrap_task_definition_arn=$(jq -er ".${STACK_NAME}.BootstrapTaskDefinitionArn" "$outputs")
          bootstrap_execution_role_arn=$(jq -er ".${STACK_NAME}.BootstrapTaskExecutionRoleArn" "$outputs")
          bootstrap_task_role_arn=$(jq -er ".${STACK_NAME}.BootstrapTaskRoleArn" "$outputs")
          private_subnet_ids=$(jq -er ".${STACK_NAME}.BootstrapPrivateSubnetIds" "$outputs")
          security_group_id=$(jq -er ".${STACK_NAME}.BootstrapSecurityGroupId" "$outputs")
          log_group_name=$(jq -er ".${STACK_NAME}.BootstrapLogGroupName" "$outputs")
          database_admin_secret_arn=$(jq -er ".${STACK_NAME}.DatabaseAdminSecretArn" "$outputs")
          database_application_secret_arn=$(jq -er ".${STACK_NAME}.DatabaseApplicationSecretArn" "$outputs")
          approved_identity_secret_arn=$(jq -er ".${STACK_NAME}.ApprovedIdentitySecretArn" "$outputs")
          repository_arn=$(jq -er ".${STACK_NAME}.ImageRepositoryArn" "$outputs")
          repository_uri=$(jq -er ".${STACK_NAME}.ImageRepositoryUri" "$outputs")
          expected_image="$repository_uri@$IMAGE_DIGEST"

          [[ "$cluster_arn" =~ ^arn:aws:ecs:us-west-2:338414773271:cluster/psd-eoc-exploration-smoke-native-bootstrap$ ]]
          [[ "$access_task_definition_arn" =~ ^arn:aws:ecs:us-west-2:338414773271:task-definition/psd-eoc-exploration-smoke-access-sync:[1-9][0-9]*$ ]]
          [[ "$bootstrap_task_definition_arn" =~ ^arn:aws:ecs:us-west-2:338414773271:task-definition/psd-eoc-exploration-smoke-native-bootstrap:[1-9][0-9]*$ ]]
          [[ "$access_execution_role_arn" =~ ^arn:aws:iam::338414773271:role/PsdEocExplorationSmoke-AccessSyncTaskExecutionRole[A-Za-z0-9-]+$ ]]
          [[ "$access_task_role_arn" =~ ^arn:aws:iam::338414773271:role/PsdEocExplorationSmoke-AccessSyncTaskRole[A-Za-z0-9-]+$ ]]
          [[ "$security_group_id" =~ ^sg-[0-9a-f]+$ ]]
          test "$access_task_definition_arn" != "$bootstrap_task_definition_arn"
          test "$access_execution_role_arn" != "$bootstrap_execution_role_arn"
          test "$access_task_role_arn" != "$bootstrap_task_role_arn"
          test "$access_execution_role_arn" != "$access_task_role_arn"
          test "$log_group_name" = "/psd-eoc/exploration-smoke/bootstrap"
          test "$repository_uri" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/psd-eoc/exploration-smoke/server"
          test "$repository_arn" = "arn:aws:ecr:$AWS_REGION:$AWS_ACCOUNT_ID:repository/psd-eoc/exploration-smoke/server"

          IFS=, read -r -a private_subnets <<< "$private_subnet_ids"
          test "${#private_subnets[@]}" -eq 2
          for subnet_id in "${private_subnets[@]}"; do
            [[ "$subnet_id" =~ ^subnet-[0-9a-f]+$ ]]
          done
          test "${private_subnets[0]}" != "${private_subnets[1]}"

          access_task_definition_file="$RUNNER_TEMP/exploration-smoke-access-sync-task-definition.json"
          aws ecs describe-task-definition \
            --task-definition "$access_task_definition_arn" \
            > "$access_task_definition_file"
          jq -e \
            --arg task_definition "$access_task_definition_arn" \
            --arg task_role "$access_task_role_arn" \
            --arg execution_role "$access_execution_role_arn" \
            --arg image "$expected_image" \
            --arg log_group "$log_group_name" \
            --arg source_sha "$SOURCE_SHA" \
            --arg application_secret "$database_application_secret_arn" \
            --arg identity_secret "$approved_identity_secret_arn" '
              def map_by_name: map({key: .name, value: .value}) | from_entries;
              def secrets_by_name: map({key: .name, value: .valueFrom}) | from_entries;
              .taskDefinition as $task |
              $task.taskDefinitionArn == $task_definition and
              $task.family == "psd-eoc-exploration-smoke-access-sync" and
              $task.taskRoleArn == $task_role and
              $task.executionRoleArn == $execution_role and
              $task.networkMode == "awsvpc" and
              ($task.requiresCompatibilities | sort) == ["FARGATE"] and
              ($task.containerDefinitions | length) == 1 and
              $task.containerDefinitions[0] as $container |
              $container.name == "access-membership-sync" and
              $container.essential == true and
              $container.readonlyRootFilesystem == true and
              $container.image == $image and
              $container.command == [
                "bun",
                "packages/server/scripts/exploration-smoke/sync-access-membership.ts"
              ] and
              $container.logConfiguration.logDriver == "awslogs" and
              $container.logConfiguration.options."awslogs-group" == $log_group and
              $container.logConfiguration.options."awslogs-stream-prefix" == "access-membership-sync" and
              ($container.environment | map_by_name) as $environment |
              ($environment | keys | sort) == [
                "AWS_ACCOUNT_ID",
                "AWS_REGION",
                "DATABASE_CONNECT_TIMEOUT_SECONDS",
                "DATABASE_DRIVER",
                "DATABASE_HOST",
                "DATABASE_IDLE_TIMEOUT_SECONDS",
                "DATABASE_MAX_CONNECTIONS",
                "DATABASE_NAME",
                "DATABASE_PORT",
                "DATABASE_SSL_ROOT_CERT",
                "SOURCE_SHA",
                "TMPDIR"
              ] and
              $environment.SOURCE_SHA == $source_sha and
              $environment.DATABASE_DRIVER == "postgres" and
              $environment.DATABASE_MAX_CONNECTIONS == "1" and
              ($container.secrets | secrets_by_name) as $secrets |
              ($secrets | keys | sort) == [
                "DATABASE_PASSWORD",
                "DATABASE_USERNAME",
                "GOOGLE_ROSTER_CONFIG",
                "PSD_EOC_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256"
              ] and
              $secrets.DATABASE_PASSWORD == ($application_secret + ":password::") and
              $secrets.DATABASE_USERNAME == ($application_secret + ":username::") and
              $secrets.PSD_EOC_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 ==
                ($identity_secret + ":initialMobileTransitionEmailSha256::") and
              $secrets.GOOGLE_ROSTER_CONFIG == "arn:aws:secretsmanager:us-west-2:338414773271:secret:/psd-eoc/google-groups"
            ' "$access_task_definition_file" > /dev/null
          groups_secret_reference=$(jq -er '
            .taskDefinition.containerDefinitions[0].secrets[] |
            select(.name == "GOOGLE_ROSTER_CONFIG") | .valueFrom
          ' "$access_task_definition_file")
          test "$groups_secret_reference" = "arn:aws:secretsmanager:$AWS_REGION:$AWS_ACCOUNT_ID:secret:/psd-eoc/google-groups"
          groups_secret_simulation_arn="$groups_secret_reference-ABCDEF"
          jq '{
            taskDefinition: {
              taskDefinitionArn: .taskDefinition.taskDefinitionArn,
              family: .taskDefinition.family,
              revision: .taskDefinition.revision,
              taskRoleArn: .taskDefinition.taskRoleArn,
              executionRoleArn: .taskDefinition.executionRoleArn,
              networkMode: .taskDefinition.networkMode,
              requiresCompatibilities: .taskDefinition.requiresCompatibilities,
              container: {
                name: .taskDefinition.containerDefinitions[0].name,
                image: .taskDefinition.containerDefinitions[0].image,
                command: .taskDefinition.containerDefinitions[0].command,
                readonlyRootFilesystem: .taskDefinition.containerDefinitions[0].readonlyRootFilesystem,
                environmentNames: [.taskDefinition.containerDefinitions[0].environment[].name] | sort,
                secretNames: [.taskDefinition.containerDefinitions[0].secrets[].name] | sort,
                logDriver: .taskDefinition.containerDefinitions[0].logConfiguration.logDriver,
                logGroup: .taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group",
                logStreamPrefix: .taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-stream-prefix"
              }
            }
          }' "$access_task_definition_file" > artifacts/readback/access-sync-task-definition.json

          access_execution_role_name=${access_execution_role_arn##*/}
          access_task_role_name=${access_task_role_arn##*/}
          aws iam get-role \
            --role-name "$access_execution_role_name" \
            > artifacts/readback/access-sync-execution-role.json
          aws iam get-role \
            --role-name "$access_task_role_name" \
            > artifacts/readback/access-sync-task-role.json
          for role_file in \
            artifacts/readback/access-sync-execution-role.json \
            artifacts/readback/access-sync-task-role.json; do
            jq -e '
              (.Role | has("PermissionsBoundary") | not) and
              .Role.AssumeRolePolicyDocument.Statement == [{
                Action: "sts:AssumeRole",
                Effect: "Allow",
                Principal: {Service: "ecs-tasks.amazonaws.com"}
              }]
            ' "$role_file" > /dev/null
          done
          aws iam list-attached-role-policies \
            --role-name "$access_execution_role_name" \
            > artifacts/readback/access-sync-execution-role-attached-policies.json
          aws iam list-role-policies \
            --role-name "$access_execution_role_name" \
            > artifacts/readback/access-sync-execution-role-inline-policies.json
          aws iam list-attached-role-policies \
            --role-name "$access_task_role_name" \
            > artifacts/readback/access-sync-task-role-attached-policies.json
          aws iam list-role-policies \
            --role-name "$access_task_role_name" \
            > artifacts/readback/access-sync-task-role-inline-policies.json
          test "$(jq '.AttachedPolicies | length' artifacts/readback/access-sync-execution-role-attached-policies.json)" -eq 0
          test "$(jq '.PolicyNames | length' artifacts/readback/access-sync-execution-role-inline-policies.json)" -eq 1
          test "$(jq '.AttachedPolicies | length' artifacts/readback/access-sync-task-role-attached-policies.json)" -eq 0
          test "$(jq '.PolicyNames | length' artifacts/readback/access-sync-task-role-inline-policies.json)" -eq 0

          access_execution_policy_name=$(jq -er '.PolicyNames[0]' artifacts/readback/access-sync-execution-role-inline-policies.json)
          aws iam get-role-policy \
            --role-name "$access_execution_role_name" \
            --policy-name "$access_execution_policy_name" \
            > artifacts/readback/access-sync-execution-role-policy.json
          groups_policy_resource="arn:aws:secretsmanager:$AWS_REGION:$AWS_ACCOUNT_ID:secret:/psd-eoc/google-groups-??????"
          log_group_resource="arn:aws:logs:$AWS_REGION:$AWS_ACCOUNT_ID:log-group:$log_group_name:*"
          jq -e \
            --arg application "$database_application_secret_arn" \
            --arg groups "$groups_policy_resource" \
            --arg identity "$approved_identity_secret_arn" \
            --arg log_group "$log_group_resource" \
            --arg repository "$repository_arn" '
              def as_array: if type == "array" then . else [.] end;
              .PolicyDocument.Statement as $statements |
              ($statements | length) == 4 and
              ([$statements[] | select(
                (.Action | as_array | sort) == ["logs:CreateLogStream", "logs:PutLogEvents"] and
                .Effect == "Allow" and
                .Resource == $log_group
              )] | length) == 1 and
              ([$statements[] | select(
                (.Action | as_array | sort) == [
                  "secretsmanager:DescribeSecret",
                  "secretsmanager:GetSecretValue"
                ] and
                .Effect == "Allow" and
                ((.Resource | as_array | sort) == ([$application, $groups, $identity] | sort))
              )] | length) == 1 and
              ([$statements[] | select(
                (.Action | as_array | sort) == [
                  "ecr:BatchCheckLayerAvailability",
                  "ecr:BatchGetImage",
                  "ecr:GetDownloadUrlForLayer"
                ] and
                .Effect == "Allow" and
                .Resource == $repository
              )] | length) == 1 and
              ([$statements[] | select(
                .Action == "ecr:GetAuthorizationToken" and
                .Effect == "Allow" and
                .Resource == "*"
              )] | length) == 1
            ' artifacts/readback/access-sync-execution-role-policy.json > /dev/null

          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names ecs:RunTask \
            --resource-arns "$access_task_definition_arn" \
            > artifacts/readback/deployment-role-access-sync-run-task-simulation.json
          test "$(jq -r '.EvaluationResults[0].EvalDecision' artifacts/readback/deployment-role-access-sync-run-task-simulation.json)" = "allowed"
          aws iam simulate-principal-policy \
            --policy-source-arn "$DEPLOY_ROLE_ARN" \
            --action-names iam:PassRole \
            --resource-arns "$access_execution_role_arn" "$access_task_role_arn" \
            --context-entries ContextKeyName=iam:PassedToService,ContextKeyValues=ecs-tasks.amazonaws.com,ContextKeyType=string \
            > artifacts/readback/deployment-role-access-sync-pass-role-simulation.json
          jq -e --arg execution "$access_execution_role_arn" --arg task "$access_task_role_arn" '
            (.EvaluationResults | length) == 1 and
            .EvaluationResults[0].EvalDecision == "allowed" and
            (.EvaluationResults[0].ResourceSpecificResults | length) == 2 and
            ([.EvaluationResults[0].ResourceSpecificResults[] |
              select(.EvalResourceDecision == "allowed") | .EvalResourceName] | sort) ==
              ([$execution, $task] | sort)
          ' artifacts/readback/deployment-role-access-sync-pass-role-simulation.json > /dev/null
          aws iam simulate-principal-policy \
            --policy-source-arn "$access_execution_role_arn" \
            --action-names secretsmanager:GetSecretValue \
            --resource-arns "$database_application_secret_arn" "$groups_secret_simulation_arn" "$approved_identity_secret_arn" "$database_admin_secret_arn" \
            > artifacts/readback/access-sync-execution-role-secret-simulation.json
          jq -e --arg application "$database_application_secret_arn" --arg groups "$groups_secret_simulation_arn" --arg identity "$approved_identity_secret_arn" --arg admin "$database_admin_secret_arn" '
            ([.EvaluationResults[].ResourceSpecificResults[] |
              select(.EvalResourceDecision == "allowed") | .EvalResourceName] | sort) ==
              ([$application, $groups, $identity] | sort) and
            ([.EvaluationResults[].ResourceSpecificResults[] |
              select(.EvalResourceName == $admin and .EvalResourceDecision != "allowed")] | length) == 1
          ' artifacts/readback/access-sync-execution-role-secret-simulation.json > /dev/null
          aws iam simulate-principal-policy \
            --policy-source-arn "$access_task_role_arn" \
            --action-names secretsmanager:GetSecretValue sqs:SendMessage ses:SendEmail sns:Publish \
            --resource-arns '*' \
            > artifacts/readback/access-sync-task-role-negative-simulation.json
          jq -e 'all(.EvaluationResults[]; .EvalDecision != "allowed")' \
            artifacts/readback/access-sync-task-role-negative-simulation.json > /dev/null

      - name: Run and prove the exact native bootstrap task
        shell: bash
        run: |
          set -euo pipefail
          outputs=artifacts/readback/bootstrap-phase-outputs.json
          bootstrap_cluster_arn=$(jq -er ".${STACK_NAME}.BootstrapEcsClusterArn" "$outputs")
          bootstrap_task_definition_arn=$(jq -er ".${STACK_NAME}.BootstrapTaskDefinitionArn" "$outputs")
          bootstrap_private_subnet_ids=$(jq -er ".${STACK_NAME}.BootstrapPrivateSubnetIds" "$outputs")
          bootstrap_security_group_id=$(jq -er ".${STACK_NAME}.BootstrapSecurityGroupId" "$outputs")
          bootstrap_log_group_name=$(jq -er ".${STACK_NAME}.BootstrapLogGroupName" "$outputs")
          bootstrap_execution_role_arn=$(jq -er ".${STACK_NAME}.BootstrapTaskExecutionRoleArn" "$outputs")
          bootstrap_task_role_arn=$(jq -er ".${STACK_NAME}.BootstrapTaskRoleArn" "$outputs")
          app_runner_vpc_connector_arn=$(jq -er ".${STACK_NAME}.AppRunnerVpcConnectorArn" "$outputs")
          approved_identity_secret_arn=$(jq -er ".${STACK_NAME}.ApprovedIdentitySecretArn" "$outputs")
          database_admin_secret_arn=$(jq -er ".${STACK_NAME}.DatabaseAdminSecretArn" "$outputs")
          database_application_secret_arn=$(jq -er ".${STACK_NAME}.DatabaseApplicationSecretArn" "$outputs")
          repository_uri=$(jq -er ".${STACK_NAME}.ImageRepositoryUri" "$outputs")
          expected_image="$repository_uri@$IMAGE_DIGEST"

          [[ "$bootstrap_cluster_arn" =~ ^arn:aws:ecs:us-west-2:338414773271:cluster/psd-eoc-exploration-smoke-native-bootstrap$ ]]
          [[ "$bootstrap_task_definition_arn" =~ ^arn:aws:ecs:us-west-2:338414773271:task-definition/psd-eoc-exploration-smoke-native-bootstrap:[1-9][0-9]*$ ]]
          [[ "$bootstrap_security_group_id" =~ ^sg-[0-9a-f]+$ ]]
          test "$bootstrap_log_group_name" = "/psd-eoc/exploration-smoke/bootstrap"
          [[ "$bootstrap_execution_role_arn" =~ ^arn:aws:iam::338414773271:role/PsdEocExplorationSmoke-BootstrapTaskExecutionRole1A-[A-Za-z0-9]+$ ]]
          [[ "$bootstrap_task_role_arn" =~ ^arn:aws:iam::338414773271:role/PsdEocExplorationSmoke-BootstrapTaskRole8B52C495-[A-Za-z0-9]+$ ]]
          test "$bootstrap_execution_role_arn" != "$bootstrap_task_role_arn"
          [[ "$app_runner_vpc_connector_arn" =~ ^arn:aws:apprunner:us-west-2:338414773271:vpcconnector/psd-eoc-exploration-smoke-native/[1-9][0-9]*/[A-Za-z0-9]+$ ]]
          [[ "$approved_identity_secret_arn" =~ ^arn:aws:secretsmanager:us-west-2:338414773271:secret:/psd-eoc/exploration-smoke/bootstrap/approved-identity-[A-Za-z0-9]{6}$ ]]
          [[ "$database_admin_secret_arn" =~ ^arn:aws:secretsmanager:us-west-2:338414773271:secret:/psd-eoc/exploration-smoke/database/admin-[A-Za-z0-9]{6}$ ]]
          [[ "$database_application_secret_arn" =~ ^arn:aws:secretsmanager:us-west-2:338414773271:secret:/psd-eoc/exploration-smoke/database/application-[A-Za-z0-9]{6}$ ]]
          test "$repository_uri" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/psd-eoc/exploration-smoke/server"

          IFS=, read -r -a bootstrap_subnets <<< "$bootstrap_private_subnet_ids"
          test "${#bootstrap_subnets[@]}" -eq 2
          for subnet_id in "${bootstrap_subnets[@]}"; do
            [[ "$subnet_id" =~ ^subnet-[0-9a-f]+$ ]]
          done
          test "${bootstrap_subnets[0]}" != "${bootstrap_subnets[1]}"
          bootstrap_subnet_csv=$(IFS=,; printf '%s' "${bootstrap_subnets[*]}")

          aws iam simulate-principal-policy             --policy-source-arn "$DEPLOY_ROLE_ARN"             --action-names ecs:RunTask             --resource-arns "$bootstrap_task_definition_arn"             > artifacts/readback/deployment-role-bootstrap-run-task-simulation.json
          test "$(jq -r '.EvaluationResults[0].EvalDecision' artifacts/readback/deployment-role-bootstrap-run-task-simulation.json)" = "allowed"
          aws iam simulate-principal-policy             --policy-source-arn "$DEPLOY_ROLE_ARN"             --action-names ecs:DescribeTasks ecs:DescribeTaskDefinition             --resource-arns '*'             > artifacts/readback/deployment-role-bootstrap-describe-simulation.json
          jq -e '
            (.EvaluationResults | length) == 2 and
            all(.EvaluationResults[]; .EvalDecision == "allowed")
          ' artifacts/readback/deployment-role-bootstrap-describe-simulation.json > /dev/null
          aws iam simulate-principal-policy             --policy-source-arn "$DEPLOY_ROLE_ARN"             --action-names iam:PassRole             --resource-arns "$bootstrap_execution_role_arn" "$bootstrap_task_role_arn"             --context-entries ContextKeyName=iam:PassedToService,ContextKeyValues=ecs-tasks.amazonaws.com,ContextKeyType=string             > artifacts/readback/deployment-role-bootstrap-pass-role-simulation.json
          jq -e --arg execution "$bootstrap_execution_role_arn" --arg task "$bootstrap_task_role_arn" '
            (.EvaluationResults | length) == 1 and
            .EvaluationResults[0].EvalDecision == "allowed" and
            (.EvaluationResults[0].ResourceSpecificResults | length) == 2 and
            ([.EvaluationResults[0].ResourceSpecificResults[] |
              select(.EvalResourceDecision == "allowed") | .EvalResourceName] | sort) ==
              ([$execution, $task] | sort)
          ' artifacts/readback/deployment-role-bootstrap-pass-role-simulation.json > /dev/null
          bootstrap_log_group_arn="arn:aws:logs:$AWS_REGION:$AWS_ACCOUNT_ID:log-group:$bootstrap_log_group_name"
          aws iam simulate-principal-policy             --policy-source-arn "$DEPLOY_ROLE_ARN"             --action-names logs:DescribeLogStreams             --resource-arns "$bootstrap_log_group_arn:*"             > artifacts/readback/deployment-role-bootstrap-describe-logs-simulation.json
          test "$(jq -r '.EvaluationResults[0].EvalDecision' artifacts/readback/deployment-role-bootstrap-describe-logs-simulation.json)" = "allowed"
          aws iam simulate-principal-policy             --policy-source-arn "$DEPLOY_ROLE_ARN"             --action-names logs:GetLogEvents             --resource-arns "$bootstrap_log_group_arn:*"             > artifacts/readback/deployment-role-bootstrap-read-logs-simulation.json
          test "$(jq -r '.EvaluationResults[0].EvalDecision' artifacts/readback/deployment-role-bootstrap-read-logs-simulation.json)" = "allowed"

          task_definition_file="$RUNNER_TEMP/exploration-smoke-bootstrap-task-definition.json"
          aws ecs describe-task-definition             --task-definition "$bootstrap_task_definition_arn"             > "$task_definition_file"
          jq -e             --arg task_definition "$bootstrap_task_definition_arn"             --arg task_role "$bootstrap_task_role_arn"             --arg execution_role "$bootstrap_execution_role_arn"             --arg image "$expected_image"             --arg log_group "$bootstrap_log_group_name"             --arg source_sha "$SOURCE_SHA"             --arg admin_secret "$database_admin_secret_arn"             --arg application_secret "$database_application_secret_arn"             --arg identity_secret "$approved_identity_secret_arn" '
              def map_by_name: map({key: .name, value: .value}) | from_entries;
              def secrets_by_name: map({key: .name, value: .valueFrom}) | from_entries;
              .taskDefinition as $task |
              $task.taskDefinitionArn == $task_definition and
              $task.taskRoleArn == $task_role and
              $task.executionRoleArn == $execution_role and
              $task.networkMode == "awsvpc" and
              ($task.requiresCompatibilities | sort) == ["FARGATE"] and
              ($task.containerDefinitions | length) == 1 and
              $task.containerDefinitions[0] as $container |
              $container.name == "native-bootstrap" and
              $container.essential == true and
              $container.image == $image and
              $container.command == [
                "bun",
                "packages/server/scripts/exploration-smoke/bootstrap.ts"
              ] and
              $container.logConfiguration.logDriver == "awslogs" and
              $container.logConfiguration.options."awslogs-group" == $log_group and
              $container.logConfiguration.options."awslogs-stream-prefix" == "native-bootstrap" and
              ($container.environment | map_by_name) as $environment |
              $environment.DATABASE_DRIVER == "postgres" and
              $environment.DATABASE_PORT == "5432" and
              $environment.DATABASE_NAME == "psd_eoc" and
              $environment.DATABASE_MAX_CONNECTIONS == "1" and
              $environment.DATABASE_CONNECT_TIMEOUT_SECONDS == "10" and
              $environment.DATABASE_IDLE_TIMEOUT_SECONDS == "20" and
              ($environment.DATABASE_HOST | type == "string" and length > 0) and
              ($environment.DATABASE_SSL_ROOT_CERT | type == "string" and startswith("/")) and
              $environment.SOURCE_SHA == $source_sha and
              ($container.secrets | secrets_by_name) as $secrets |
              ($secrets | keys | sort) == [
                "APPROVED_GOOGLE_SUBJECT",
                "APPROVED_STAFF_DISPLAY_NAME",
                "APPROVED_STAFF_EMAIL",
                "DATABASE_ADMIN_PASSWORD",
                "DATABASE_ADMIN_USERNAME",
                "DATABASE_APPLICATION_PASSWORD",
                "DATABASE_APPLICATION_USERNAME"
              ] and
              $secrets.DATABASE_ADMIN_USERNAME == ($admin_secret + ":username::") and
              $secrets.DATABASE_ADMIN_PASSWORD == ($admin_secret + ":password::") and
              $secrets.DATABASE_APPLICATION_USERNAME == ($application_secret + ":username::") and
              $secrets.DATABASE_APPLICATION_PASSWORD == ($application_secret + ":password::") and
              $secrets.APPROVED_GOOGLE_SUBJECT == ($identity_secret + ":googleSubject::") and
              $secrets.APPROVED_STAFF_EMAIL == ($identity_secret + ":staffEmail::") and
              $secrets.APPROVED_STAFF_DISPLAY_NAME == ($identity_secret + ":staffDisplayName::")
            ' "$task_definition_file" > /dev/null
          jq '{
            taskDefinition: {
              taskDefinitionArn: .taskDefinition.taskDefinitionArn,
              taskRoleArn: .taskDefinition.taskRoleArn,
              executionRoleArn: .taskDefinition.executionRoleArn,
              family: .taskDefinition.family,
              revision: .taskDefinition.revision,
              networkMode: .taskDefinition.networkMode,
              requiresCompatibilities: .taskDefinition.requiresCompatibilities,
              cpu: .taskDefinition.cpu,
              memory: .taskDefinition.memory,
              container: {
                name: .taskDefinition.containerDefinitions[0].name,
                image: .taskDefinition.containerDefinitions[0].image,
                command: .taskDefinition.containerDefinitions[0].command,
                essential: .taskDefinition.containerDefinitions[0].essential,
                environmentNames: [.taskDefinition.containerDefinitions[0].environment[].name] | sort,
                secretNames: [.taskDefinition.containerDefinitions[0].secrets[].name] | sort,
                logDriver: .taskDefinition.containerDefinitions[0].logConfiguration.logDriver,
                logGroup: .taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-group",
                logStreamPrefix: .taskDefinition.containerDefinitions[0].logConfiguration.options."awslogs-stream-prefix"
              }
            }
          }' "$task_definition_file" > artifacts/readback/bootstrap-task-definition.json

          network_configuration="awsvpcConfiguration={subnets=[$bootstrap_subnet_csv],securityGroups=[$bootstrap_security_group_id],assignPublicIp=DISABLED}"
          run_task_file="$RUNNER_TEMP/exploration-smoke-bootstrap-run-task.json"
          started_by="github-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          client_token="psd-eoc-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${SOURCE_SHA:0:12}"
          aws ecs run-task             --cluster "$bootstrap_cluster_arn"             --task-definition "$bootstrap_task_definition_arn"             --launch-type FARGATE             --platform-version LATEST             --count 1             --started-by "$started_by"             --client-token "$client_token"             --network-configuration "$network_configuration"             > "$run_task_file"
          jq -e '
            (.failures | length) == 0 and
            (.tasks | length) == 1
          ' "$run_task_file" > /dev/null
          bootstrap_task_arn=$(jq -er '.tasks[0].taskArn' "$run_task_file")
          test "$(jq -er '.tasks[0].clusterArn' "$run_task_file")" = "$bootstrap_cluster_arn"
          test "$(jq -er '.tasks[0].taskDefinitionArn' "$run_task_file")" = "$bootstrap_task_definition_arn"
          test "$(jq -er '.tasks[0].startedBy' "$run_task_file")" = "$started_by"
          [[ "$bootstrap_task_arn" =~ ^arn:aws:ecs:us-west-2:338414773271:task/psd-eoc-exploration-smoke-native-bootstrap/[0-9a-f]{32}$ ]]
          jq '{
            failures: .failures,
            task: {
              taskArn: .tasks[0].taskArn,
              clusterArn: .tasks[0].clusterArn,
              taskDefinitionArn: .tasks[0].taskDefinitionArn,
              launchType: .tasks[0].launchType,
              platformVersion: .tasks[0].platformVersion,
              startedBy: .tasks[0].startedBy,
              desiredStatus: .tasks[0].desiredStatus,
              lastStatus: .tasks[0].lastStatus
            }
          }' "$run_task_file" > artifacts/readback/bootstrap-run-task.json

          aws ecs wait tasks-stopped             --cluster "$bootstrap_cluster_arn"             --tasks "$bootstrap_task_arn"
          stopped_task_file="$RUNNER_TEMP/exploration-smoke-bootstrap-stopped-task.json"
          aws ecs describe-tasks             --cluster "$bootstrap_cluster_arn"             --tasks "$bootstrap_task_arn"             > "$stopped_task_file"
          jq -e             --arg task "$bootstrap_task_arn"             --arg cluster "$bootstrap_cluster_arn"             --arg task_definition "$bootstrap_task_definition_arn"             --arg image "$expected_image"             --arg digest "$IMAGE_DIGEST" '
              (.failures | length) == 0 and
              (.tasks | length) == 1 and
              .tasks[0].taskArn == $task and
              .tasks[0].clusterArn == $cluster and
              .tasks[0].taskDefinitionArn == $task_definition and
              .tasks[0].lastStatus == "STOPPED" and
              .tasks[0].desiredStatus == "STOPPED" and
              (.tasks[0].containers | length) == 1 and
              .tasks[0].containers[0].name == "native-bootstrap" and
              .tasks[0].containers[0].image == $image and
              .tasks[0].containers[0].imageDigest == $digest and
              .tasks[0].containers[0].exitCode == 0
            ' "$stopped_task_file" > /dev/null
          jq '{
            failures: .failures,
            task: {
              taskArn: .tasks[0].taskArn,
              clusterArn: .tasks[0].clusterArn,
              taskDefinitionArn: .tasks[0].taskDefinitionArn,
              lastStatus: .tasks[0].lastStatus,
              desiredStatus: .tasks[0].desiredStatus,
              stopCode: .tasks[0].stopCode,
              connectivity: .tasks[0].connectivity,
              container: {
                name: .tasks[0].containers[0].name,
                image: .tasks[0].containers[0].image,
                imageDigest: .tasks[0].containers[0].imageDigest,
                exitCode: .tasks[0].containers[0].exitCode
              }
            }
          }' "$stopped_task_file" > artifacts/readback/bootstrap-stopped-task.json

          bootstrap_task_id=${bootstrap_task_arn##*/}
          bootstrap_log_stream_name="native-bootstrap/native-bootstrap/$bootstrap_task_id"
          bootstrap_log_file="$RUNNER_TEMP/exploration-smoke-bootstrap-log-events.json"
          bootstrap_summary_candidate="$RUNNER_TEMP/exploration-smoke-bootstrap-summary.json"
          bootstrap_log_error="$RUNNER_TEMP/exploration-smoke-bootstrap-log-error.txt"
          for attempt in {1..24}; do
            if ! aws logs get-log-events               --log-group-name "$bootstrap_log_group_name"               --log-stream-name "$bootstrap_log_stream_name"               --start-from-head               > "$bootstrap_log_file" 2> "$bootstrap_log_error"; then
              if grep -q 'ResourceNotFoundException' "$bootstrap_log_error"; then
                sleep 5
                continue
              fi
              echo "The native bootstrap log stream could not be read." >&2
              exit 1
            fi
            if jq -cer --arg source_sha "$SOURCE_SHA" '
              [
                .events[].message |
                fromjson? |
                select(
                  .sourceSha == $source_sha and
                  .database.transport == "native-postgres" and
                  .database.migrationsApplied == true and
                  .database.tlsVerified == true and
                  .idempotence.runs == 2 and
                  .idempotence.equivalent == true
                )
              ] |
              if length == 1 then .[0] else empty end
            ' "$bootstrap_log_file" > "$bootstrap_summary_candidate"; then
              if [[ -s "$bootstrap_summary_candidate" ]]; then
                break
              fi
            fi
            if [[ "$attempt" -eq 24 ]]; then
              echo "The exact native bootstrap evidence did not become visible." >&2
              exit 1
            fi
            sleep 5
          done
          jq -e '
            .database.applicationRole == {
              applicationLogin: "psd_eoc_application",
              inheritedRole: "psd_eoc_app",
              directMembershipCount: 1,
              privilegedFlags: false
            } and
            .referenceSeed == {
              eventTypes: 8,
              eventTypeVersions: 8,
              eventTypeTemplates: 72,
              integrationStatuses: 5,
              channelConfigurations: 3,
              events: 0,
              outboxMessages: 0
            } and
            .canonicalSyntheticRemoval == {
              operationalRows: {
                facilities: 0,
                neighborhoodVersions: 0,
                neighborhoodFacilities: 0,
                groupSources: 0,
                audienceConfigurations: 0,
                audienceTargets: 0,
                rosterSourceConfigurations: 0,
                rosterSourceConfigurationFacilities: 0,
                rosterSourceConfigurationGroups: 0,
                rosterSnapshots: 0,
                rosterSnapshotFacilities: 0,
                rosterSnapshotSources: 0,
                rosterRecipients: 0,
                rosterRecipientGroupSources: 0,
                rosterEndpoints: 0,
                total: 0
              },
              retainedTruth: {
                facilityAnchors: 2,
                securityAuditEntries: 2,
                idempotencyRecords: 1
              }
            } and
            .approvedAccess == {
              accessGroups: 1,
              users: 1,
              staffRoles: 1,
              accessSnapshots: 1,
              notificationChannelsEnabled: 0,
              matchingRosterRecipients: 0
            } and
            .integrations == {
              googleOidc: "configured-unverified",
              googleGroups: "mocked",
              messaging: "disabled"
            }
          ' "$bootstrap_summary_candidate" > /dev/null
          cp "$bootstrap_summary_candidate" artifacts/readback/native-bootstrap-summary.json

      - name: Deploy the exact digest after bootstrap
        env:
          APPROVED_GOOGLE_SUBJECT: ${{ secrets.EXPLORATION_SMOKE_APPROVED_GOOGLE_SUBJECT }}
          APPROVED_STAFF_DISPLAY_NAME: ${{ secrets.EXPLORATION_SMOKE_APPROVED_STAFF_DISPLAY_NAME }}
          APPROVED_STAFF_EMAIL: ${{ secrets.EXPLORATION_SMOKE_APPROVED_STAFF_EMAIL }}
          INITIAL_MOBILE_TRANSITION_EMAIL_SHA256: ${{ secrets.EXPLORATION_SMOKE_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256 }}
        working-directory: infra
        shell: bash
        run: |
          set -euo pipefail
          bunx --bun cdk \
            --app "bun bin/exploration-smoke.ts" \
            deploy "$STACK_NAME" \
            --exclusively \
            --require-approval never \
            --no-notices \
            --outputs-file ../artifacts/readback/final-outputs.json \
            --parameters "$STACK_NAME:ProvisionApplication=true" \
            --parameters "$STACK_NAME:AppImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:RuntimeDatabaseIdleTimeoutSeconds=0" \
            --parameters "$STACK_NAME:BootstrapImageDigest=$IMAGE_DIGEST" \
            --parameters "$STACK_NAME:BootstrapSourceSha=$SOURCE_SHA" \
            --parameters "$STACK_NAME:GoogleOauthSecretArn=$GOOGLE_OAUTH_SECRET_ARN" \
            --parameters "$STACK_NAME:ApprovedGoogleSubject=$APPROVED_GOOGLE_SUBJECT" \
            --parameters "$STACK_NAME:ApprovedStaffEmail=$APPROVED_STAFF_EMAIL" \
            --parameters "$STACK_NAME:ApprovedStaffDisplayName=$APPROVED_STAFF_DISPLAY_NAME" \
            --parameters "$STACK_NAME:InitialMobileTransitionEmailSha256=$INITIAL_MOBILE_TRANSITION_EMAIL_SHA256" \
            --parameters "$STACK_NAME:SourceSha=$SOURCE_SHA"

      - name: Bound logs and read back topology, IAM, and health without a send
        shell: bash
        run: |
          set -euo pipefail
          outputs=artifacts/readback/final-outputs.json
          database_arn=$(jq -er ".${STACK_NAME}.DatabaseClusterArn" "$outputs")
          database_application_secret_arn=$(jq -er ".${STACK_NAME}.DatabaseApplicationSecretArn" "$outputs")
          approved_identity_secret_arn=$(jq -er ".${STACK_NAME}.ApprovedIdentitySecretArn" "$outputs")
          app_runner_vpc_connector_arn=$(jq -er ".${STACK_NAME}.AppRunnerVpcConnectorArn" "$outputs")
          database_id=${database_arn##*:cluster:}
          queue_arn=$(jq -er ".${STACK_NAME}.HealthQueueArn" "$outputs")
          queue_url=$(jq -er ".${STACK_NAME}.HealthQueueUrl" "$outputs")
          email_queue_arn=$(jq -er ".${STACK_NAME}.EmailQueueArn" "$outputs")
          email_queue_url=$(jq -er ".${STACK_NAME}.EmailQueueUrl" "$outputs")
          email_dlq_arn=$(jq -er ".${STACK_NAME}.EmailDeadLetterQueueArn" "$outputs")
          email_dlq_url="https://sqs.$AWS_REGION.amazonaws.com/$AWS_ACCOUNT_ID/psd-eoc-email-dlq"
          email_worker_role_arn=$(jq -er ".${STACK_NAME}.EmailWorkerRoleArn" "$outputs")
          email_worker_log_group_name=$(jq -er ".${STACK_NAME}.EmailWorkerLogGroupName" "$outputs")
          ses_identity_arn=$(jq -er ".${STACK_NAME}.SesIdentityArn" "$outputs")
          ses_identity_domain=$(jq -er ".${STACK_NAME}.SesIdentityDomain" "$outputs")
          ses_from_address=$(jq -er ".${STACK_NAME}.SesFromAddress" "$outputs")
          ses_configuration_set_name=$(jq -er ".${STACK_NAME}.SesConfigurationSetName" "$outputs")
          ses_event_destination_name=$(jq -er ".${STACK_NAME}.SesEmailEventDestinationName" "$outputs")
          ses_event_destination_management=$(jq -er ".${STACK_NAME}.SesEmailEventDestinationManagement" "$outputs")
          ses_events_topic_arn=$(jq -er ".${STACK_NAME}.SesEmailEventsTopicArn" "$outputs")
          ses_events_key_arn=$(jq -er ".${STACK_NAME}.SesEmailEventsKeyArn" "$outputs")
          ses_integration_truth=$(jq -er ".${STACK_NAME}.SesIntegrationTruth" "$outputs")
          email_channel_state=$(jq -er ".${STACK_NAME}.EmailChannelState" "$outputs")
          runtime_role_arn=$(jq -er ".${STACK_NAME}.RuntimeRoleArn" "$outputs")
          runtime_role_name=${runtime_role_arn##*/}
          service_arn=$(jq -er ".${STACK_NAME}.AppRunnerServiceArn" "$outputs")
          health_url=$(jq -er ".${STACK_NAME}.AppRunnerHealthCheckUrl" "$outputs")

          test "$queue_arn" = "arn:aws:sqs:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-exploration-smoke-health"
          test "$queue_url" = "https://sqs.$AWS_REGION.amazonaws.com/$AWS_ACCOUNT_ID/psd-eoc-exploration-smoke-health"
          test "$email_queue_arn" = "arn:aws:sqs:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-email"
          test "$email_queue_url" = "https://sqs.$AWS_REGION.amazonaws.com/$AWS_ACCOUNT_ID/psd-eoc-email"
          test "$email_dlq_arn" = "arn:aws:sqs:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-email-dlq"
          [[ "$email_worker_role_arn" =~ ^arn:aws:iam::338414773271:role/PsdEocExplorationSmoke-EmailWorkerRoleCA311157-[A-Za-z0-9]+$ ]]
          test "$email_worker_log_group_name" = "/psd-eoc/workers/email"
          test "$ses_identity_arn" = "arn:aws:ses:$AWS_REGION:$AWS_ACCOUNT_ID:identity/psd401.net"
          test "$ses_identity_domain" = "psd401.net"
          test "$ses_from_address" = "eoc-alerts@psd401.net"
          test "$ses_configuration_set_name" = "psd-eoc-transactional"
          test "$ses_event_destination_name" = "psd-eoc-email-events"
          test "$ses_event_destination_management" = "external-readback"
          test "$ses_events_topic_arn" = "arn:aws:sns:$AWS_REGION:$AWS_ACCOUNT_ID:psd-eoc-email-events"
          [[ "$ses_events_key_arn" =~ ^arn:aws:kms:us-west-2:338414773271:key/[0-9a-f-]{36}$ ]]
          test "$ses_integration_truth" = "configured-unverified"
          test "$email_channel_state" = "disabled"
          test "$app_runner_vpc_connector_arn" = "$(cat artifacts/readback/app-runner-vpc-connector-before.txt)"

          aws cloudformation describe-stacks --stack-name "$STACK_NAME" > artifacts/readback/stack-final.json
          aws cloudformation list-stack-resources --stack-name "$STACK_NAME" > artifacts/readback/stack-resources.json
          test "$(jq -r '.Stacks[0].StackStatus' artifacts/readback/stack-final.json)" = "UPDATE_COMPLETE" || \
            test "$(jq -r '.Stacks[0].StackStatus' artifacts/readback/stack-final.json)" = "CREATE_COMPLETE"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "ProvisionApplication") | .ParameterValue' artifacts/readback/stack-final.json)" = "true"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "AppImageDigest") | .ParameterValue' artifacts/readback/stack-final.json)" = "$IMAGE_DIGEST"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "RuntimeDatabaseIdleTimeoutSeconds") | .ParameterValue' artifacts/readback/stack-final.json)" = "0"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "SourceSha") | .ParameterValue' artifacts/readback/stack-final.json)" = "$SOURCE_SHA"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "BootstrapImageDigest") | .ParameterValue' artifacts/readback/stack-final.json)" = "$IMAGE_DIGEST"
          test "$(jq -er '.Stacks[0].Parameters[] | select(.ParameterKey == "BootstrapSourceSha") | .ParameterValue' artifacts/readback/stack-final.json)" = "$SOURCE_SHA"

          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EnvironmentName") | .OutputValue' artifacts/readback/stack-final.json)" = "live-pilot"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "DataClassification") | .OutputValue' artifacts/readback/stack-final.json)" = "staff-minimized"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "HealthQueueArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$queue_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "HealthQueueUrl") | .OutputValue' artifacts/readback/stack-final.json)" = "$queue_url"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailQueueArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$email_queue_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailQueueUrl") | .OutputValue' artifacts/readback/stack-final.json)" = "$email_queue_url"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailDeadLetterQueueArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$email_dlq_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailWorkerRoleArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$email_worker_role_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailWorkerLogGroupName") | .OutputValue' artifacts/readback/stack-final.json)" = "$email_worker_log_group_name"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIdentityArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_identity_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIdentityDomain") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_identity_domain"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesFromAddress") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_from_address"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesConfigurationSetName") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_configuration_set_name"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesEmailEventDestinationName") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_event_destination_name"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesEmailEventDestinationManagement") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_event_destination_management"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesEmailEventsTopicArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_events_topic_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesEmailEventsKeyArn") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_events_key_arn"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "SesIntegrationTruth") | .OutputValue' artifacts/readback/stack-final.json)" = "$ses_integration_truth"
          test "$(jq -er '.Stacks[0].Outputs[] | select(.OutputKey == "EmailChannelState") | .OutputValue' artifacts/readback/stack-final.json)" = "$email_channel_state"

          runtime_template=artifacts/cdk.out/PsdEocExplorationSmoke.template.json
          jq -r '.Resources | to_entries[] | [.key, .value.Type] | @tsv' "$runtime_template" \
            | sort > artifacts/readback/expected-stack-resource-types.tsv
          jq -r '.StackResourceSummaries[] | [.LogicalResourceId, .ResourceType] | @tsv' artifacts/readback/stack-resources.json \
            | sort > artifacts/readback/actual-stack-resource-types.tsv
          cmp \
            artifacts/readback/expected-stack-resource-types.tsv \
            artifacts/readback/actual-stack-resource-types.tsv
          jq -e '
            all(.StackResourceSummaries[];
              .ResourceStatus == "CREATE_COMPLETE" or
              .ResourceStatus == "UPDATE_COMPLETE" or
              .ResourceStatus == "IMPORT_COMPLETE"
            )
          ' artifacts/readback/stack-resources.json > /dev/null

          health_queue_logical_id=$(jq -er '.Outputs.HealthQueueArn.Value."Fn::GetAtt"[0]' "$runtime_template")
          email_queue_logical_id=$(jq -er '.Outputs.EmailQueueArn.Value."Fn::GetAtt"[0]' "$runtime_template")
          email_dlq_logical_id=$(jq -er '.Outputs.EmailDeadLetterQueueArn.Value."Fn::GetAtt"[0]' "$runtime_template")
          email_worker_role_logical_id=$(jq -er '.Outputs.EmailWorkerRoleArn.Value."Fn::GetAtt"[0]' "$runtime_template")
          email_worker_log_group_logical_id=$(jq -er '.Outputs.EmailWorkerLogGroupName.Value.Ref' "$runtime_template")
          ses_configuration_set_logical_id=$(jq -er '.Outputs.SesConfigurationSetName.Value.Ref' "$runtime_template")
          ses_events_topic_logical_id=$(jq -er '.Outputs.SesEmailEventsTopicArn.Value.Ref' "$runtime_template")
          ses_events_key_logical_id=$(jq -er '.Outputs.SesEmailEventsKeyArn.Value."Fn::GetAtt"[0]' "$runtime_template")
          ses_events_topic_policy_logical_id=$(jq -er '[.Resources | to_entries[] | select(.value.Type == "AWS::SNS::TopicPolicy") | .key] | if length == 1 then .[0] else error("unexpected SNS topic-policy inventory") end' "$runtime_template")
          ses_events_key_id=${ses_events_key_arn##*/}

          # BEGIN direct dark-resource configuration readback
          aws logs describe-log-groups \
            --log-group-name-prefix "$email_worker_log_group_name" \
            > artifacts/readback/email-worker-log-group.json
          jq -e --arg name "$email_worker_log_group_name" '
            (.logGroups | length) == 1 and
            .logGroups[0].logGroupName == $name and
            .logGroups[0].retentionInDays == 14 and
            (.logGroups[0].arn | type == "string")
          ' artifacts/readback/email-worker-log-group.json > /dev/null

          aws sqs get-queue-attributes \
            --queue-url "$email_queue_url" \
            --attribute-names All \
            > artifacts/readback/email-queue.json
          jq -e --arg arn "$email_queue_arn" --arg dlq "$email_dlq_arn" '
            .Attributes.QueueArn == $arn and
            .Attributes.SqsManagedSseEnabled == "true" and
            .Attributes.MessageRetentionPeriod == "345600" and
            .Attributes.VisibilityTimeout == "60" and
            (.Attributes.RedrivePolicy | fromjson) == {
              deadLetterTargetArn: $dlq,
              maxReceiveCount: "5"
            }
          ' artifacts/readback/email-queue.json > /dev/null
          aws sqs get-queue-attributes \
            --queue-url "$email_dlq_url" \
            --attribute-names All \
            > artifacts/readback/email-dead-letter-queue.json
          jq -e --arg arn "$email_dlq_arn" --arg source "$email_queue_arn" '
            .Attributes.QueueArn == $arn and
            .Attributes.SqsManagedSseEnabled == "true" and
            .Attributes.MessageRetentionPeriod == "1209600" and
            (.Attributes.RedriveAllowPolicy | fromjson) == {
              redrivePermission: "byQueue",
              sourceQueueArns: [$source]
            }
          ' artifacts/readback/email-dead-letter-queue.json > /dev/null

          # END direct dark-resource configuration readback

          jq -e \
            --arg health_id "$health_queue_logical_id" \
            --arg health_url "$queue_url" \
            --arg email_id "$email_queue_logical_id" \
            --arg email_url "$email_queue_url" \
            --arg dlq_id "$email_dlq_logical_id" \
            --arg dlq_url "$email_dlq_url" \
            --arg worker_id "$email_worker_role_logical_id" \
            --arg worker_arn "$email_worker_role_arn" \
            --arg worker_log_id "$email_worker_log_group_logical_id" \
            --arg worker_log "$email_worker_log_group_name" \
            --arg config_id "$ses_configuration_set_logical_id" \
            --arg config_name "$ses_configuration_set_name" \
            --arg topic_id "$ses_events_topic_logical_id" \
            --arg topic_arn "$ses_events_topic_arn" \
            --arg key_id "$ses_events_key_logical_id" \
            --arg key_physical_id "$ses_events_key_id" \
            --arg topic_policy_id "$ses_events_topic_policy_logical_id" '
              def exact_resource($logical_id; $type; $physical_id):
                [
                  .StackResourceSummaries[] |
                  select(
                    .LogicalResourceId == $logical_id and
                    .ResourceType == $type and
                    .PhysicalResourceId == $physical_id and
                    (
                      .ResourceStatus == "CREATE_COMPLETE" or
                      .ResourceStatus == "UPDATE_COMPLETE" or
                      .ResourceStatus == "IMPORT_COMPLETE"
                    )
                  )
                ] | length == 1;
              exact_resource($health_id; "AWS::SQS::Queue"; $health_url) and
              exact_resource($email_id; "AWS::SQS::Queue"; $email_url) and
              exact_resource($dlq_id; "AWS::SQS::Queue"; $dlq_url) and
              exact_resource($worker_id; "AWS::IAM::Role"; ($worker_arn | split("/")[-1])) and
              exact_resource($worker_log_id; "AWS::Logs::LogGroup"; $worker_log) and
              exact_resource($config_id; "AWS::SES::ConfigurationSet"; $config_name) and
              exact_resource($topic_id; "AWS::SNS::Topic"; $topic_arn) and
              exact_resource($key_id; "AWS::KMS::Key"; $key_physical_id) and
              ([.StackResourceSummaries[] | select(.LogicalResourceId == $topic_policy_id and .ResourceType == "AWS::SNS::TopicPolicy" and (.ResourceStatus == "CREATE_COMPLETE" or .ResourceStatus == "UPDATE_COMPLETE"))] | length) == 1 and
              ([.StackResourceSummaries[] | select(.ResourceType == "AWS::SQS::Queue")] | length) == 3 and
              ([.StackResourceSummaries[] | select(.ResourceType == "AWS::SES::ConfigurationSet")] | length) == 1 and
              ([.StackResourceSummaries[] | select(.ResourceType == "AWS::SES::ConfigurationSetEventDestination")] | length) == 0 and
              ([.StackResourceSummaries[] | select(.ResourceType == "AWS::KMS::Key")] | length) == 1 and
              ([.StackResourceSummaries[] | select(.ResourceType == "AWS::SNS::Topic")] | length) == 1 and
              ([.StackResourceSummaries[] | select(.ResourceType == "AWS::SNS::TopicPolicy")] | length) == 1 and
              ([.StackResourceSummaries[] | select(
                .ResourceType == "AWS::SNS::Subscription" or
                .ResourceType == "AWS::SES::EmailIdentity" or
                .ResourceType == "AWS::ECS::Service" or
                (.ResourceType | test("^AWS::(Lambda|Scheduler|Events)::"))
              )] | length) == 0
            ' artifacts/readback/stack-resources.json > /dev/null

          aws sesv2 get-configuration-set \
            --configuration-set-name "$ses_configuration_set_name" \
            > artifacts/readback/ses-configuration-set-external.json
          jq -e --arg name "$ses_configuration_set_name" '
            .ConfigurationSetName == $name and
            .SendingOptions == {SendingEnabled: false}
          ' artifacts/readback/ses-configuration-set-external.json > /dev/null
          aws sesv2 get-configuration-set-event-destinations \
            --configuration-set-name "$ses_configuration_set_name" \
            > artifacts/readback/ses-event-destination-external.json
          jq -e \
            --arg destination "$ses_event_destination_name" \
            --arg topic "$ses_events_topic_arn" '
              (.EventDestinations | length) == 1 and
              .EventDestinations[0].Name == $destination and
              .EventDestinations[0].Enabled == true and
              (.EventDestinations[0].MatchingEventTypes | sort) == [
                "BOUNCE",
                "COMPLAINT",
                "DELIVERY",
                "DELIVERY_DELAY",
                "REJECT",
                "RENDERING_FAILURE",
                "SEND"
              ] and
              .EventDestinations[0].SnsDestination == {TopicArn: $topic}
            ' artifacts/readback/ses-event-destination-external.json > /dev/null

          app_runner_service=$(aws apprunner describe-service --service-arn "$service_arn")
          runtime_secret_map=$(jq -cer '
            .Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentSecrets as $secrets |
            if
              ($secrets | type) == "object" and
              ($secrets | keys | sort) == [
                "API_SALT",
                "DATABASE_PASSWORD",
                "DATABASE_USERNAME",
                "GOOGLE_OAUTH_CONFIG",
                "GOOGLE_OIDC_COOKIE_SECRET",
                "PSD_EOC_BOOTSTRAP_ADMIN_SUBJECTS",
                "PSD_EOC_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256"
              ] and
              all($secrets[]; type == "string")
            then $secrets
            else error("unexpected App Runner runtime-secret contract")
            end
          ' <<< "$app_runner_service")
          api_salt_secret_arn=$(jq -er '.API_SALT' <<< "$runtime_secret_map")
          google_oidc_cookie_secret_arn=$(jq -er '.GOOGLE_OIDC_COOKIE_SECRET' <<< "$runtime_secret_map")
          test "$(jq -er '.GOOGLE_OAUTH_CONFIG' <<< "$runtime_secret_map")" = "$GOOGLE_OAUTH_SECRET_ARN"
          test "$(jq -er '.DATABASE_USERNAME' <<< "$runtime_secret_map")" = "$database_application_secret_arn:username::"
          test "$(jq -er '.DATABASE_PASSWORD' <<< "$runtime_secret_map")" = "$database_application_secret_arn:password::"
          test "$(jq -er '.PSD_EOC_BOOTSTRAP_ADMIN_SUBJECTS' <<< "$runtime_secret_map")" = "$approved_identity_secret_arn:googleSubject::"
          test "$(jq -er '.PSD_EOC_INITIAL_MOBILE_TRANSITION_EMAIL_SHA256' <<< "$runtime_secret_map")" = "$approved_identity_secret_arn:initialMobileTransitionEmailSha256::"
          [[ "$api_salt_secret_arn" =~ ^arn:aws:secretsmanager:us-west-2:338414773271:secret:/psd-eoc/exploration-smoke/api-salt-[A-Za-z0-9]{6}$ ]]
          [[ "$google_oidc_cookie_secret_arn" =~ ^arn:aws:secretsmanager:us-west-2:338414773271:secret:/psd-eoc/exploration-smoke/google-oidc-cookie-secret-[A-Za-z0-9]{6}$ ]]
          runtime_environment_map=$(jq -cer '
            .Service.SourceConfiguration.ImageRepository.ImageConfiguration.RuntimeEnvironmentVariables as $variables |
            if
              ($variables | type) == "object" and
              ($variables | keys | sort) == [
                "AWS_REGION",
                "DATABASE_CONNECT_TIMEOUT_SECONDS",
                "DATABASE_DRIVER",
                "DATABASE_HOST",
                "DATABASE_IDLE_TIMEOUT_SECONDS",
                "DATABASE_MAX_CONNECTIONS",
                "DATABASE_NAME",
                "DATABASE_PORT",
                "DATABASE_SSL_ROOT_CERT",
                "FANOUT_QUEUE_URL",
                "NODE_ENV",
                "PSD_EOC_SES_CREDENTIAL_VERIFICATION_REFERENCE",
                "RUNTIME_SECRET_ARN",
                "SOURCE_SHA"
              ] and
              all($variables[]; type == "string")
            then $variables
            else error("unexpected App Runner runtime-variable contract")
            end
          ' <<< "$app_runner_service")
          test "$(jq -er '.AWS_REGION' <<< "$runtime_environment_map")" = "$AWS_REGION"
          test "$(jq -er '.DATABASE_DRIVER' <<< "$runtime_environment_map")" = "postgres"
          test "$(jq -er '.DATABASE_PORT' <<< "$runtime_environment_map")" = "5432"
          test "$(jq -er '.DATABASE_NAME' <<< "$runtime_environment_map")" = "psd_eoc"
          test "$(jq -er '.DATABASE_MAX_CONNECTIONS' <<< "$runtime_environment_map")" = "1"
          test "$(jq -er '.DATABASE_CONNECT_TIMEOUT_SECONDS' <<< "$runtime_environment_map")" = "10"
          test "$(jq -er '.DATABASE_IDLE_TIMEOUT_SECONDS' <<< "$runtime_environment_map")" = "0"
          test "$(jq -er '.FANOUT_QUEUE_URL' <<< "$runtime_environment_map")" = "$queue_url"
          test "$(jq -er '.NODE_ENV' <<< "$runtime_environment_map")" = "production"
          test "$(jq -er '.PSD_EOC_SES_CREDENTIAL_VERIFICATION_REFERENCE' <<< "$runtime_environment_map")" = "UNVERIFIED"
          test "$(jq -er '.RUNTIME_SECRET_ARN' <<< "$runtime_environment_map")" = "$api_salt_secret_arn"
          test "$(jq -er '.SOURCE_SHA' <<< "$runtime_environment_map")" = "$SOURCE_SHA"
          runtime_database_host=$(jq -er '.DATABASE_HOST' <<< "$runtime_environment_map")
          runtime_ssl_root_cert=$(jq -er '.DATABASE_SSL_ROOT_CERT' <<< "$runtime_environment_map")
          [[ "$runtime_database_host" =~ ^[A-Za-z0-9.-]+[.]rds[.]amazonaws[.]com$ ]]
          [[ "$runtime_ssl_root_cert" =~ ^/[^[:space:]]+$ ]]
          jq -e --arg connector "$app_runner_vpc_connector_arn" '
            .Service.NetworkConfiguration.EgressConfiguration == {
              EgressType: "VPC",
              VpcConnectorArn: $connector
            } and
            .Service.NetworkConfiguration.IngressConfiguration.IsPubliclyAccessible == true
          ' <<< "$app_runner_service" > /dev/null
          jq '{
            Service: {
              ServiceArn: .Service.ServiceArn,
              ServiceId: .Service.ServiceId,
              ServiceName: .Service.ServiceName,
              ServiceUrl: .Service.ServiceUrl,
              Status: .Service.Status,
              AutoScalingConfigurationSummary: .Service.AutoScalingConfigurationSummary,
              HealthCheckConfiguration: .Service.HealthCheckConfiguration,
              InstanceConfiguration: {
                Cpu: .Service.InstanceConfiguration.Cpu,
                Memory: .Service.InstanceConfiguration.Memory,
                InstanceRoleArn: .Service.InstanceConfiguration.InstanceRoleArn
              },
              NetworkConfiguration: .Service.NetworkConfiguration,
              SourceConfiguration: {
                AutoDeploymentsEnabled: .Service.SourceConfiguration.AutoDeploymentsEnabled,
                ImageRepository: {
                  ImageIdentifier: .Service.SourceConfiguration.ImageRepository.ImageIdentifier,
                  ImageRepositoryType: .Service.SourceConfiguration.ImageRepository.ImageRepositoryType
                }
              }
            }
          }' <<< "$app_runner_service" > artifacts/readback/app-runner-service.json
          unset app_runner_service
          unset runtime_environment_map runtime_secret_map
          service_id=$(jq -er '.Service.ServiceId' artifacts/readback/app-runner-service.json)
          service_name=$(jq -er '.Service.ServiceName' artifacts/readback/app-runner-service.json)
          [[ "$service_id" =~ ^[A-Za-z0-9]{32}$ ]]
          test "$service_name" = "psd-eoc-exploration-smoke"
          test "$service_arn" = "arn:aws:apprunner:$AWS_REGION:$AWS_ACCOUNT_ID:service/$service_name/$service_id"
          test "$(jq -r '.Service.Status' artifacts/readback/app-runner-service.json)" = "RUNNING"
          test "$(jq -r '.Service.InstanceConfiguration.InstanceRoleArn' artifacts/readback/app-runner-service.json)" = "$runtime_role_arn"
          test "$(jq -r '.Service.SourceConfiguration.AutoDeploymentsEnabled' artifacts/readback/app-runner-service.json)" = "false"
          test "$(jq -r '.Service.SourceConfiguration.ImageRepository.ImageIdentifier' artifacts/readback/app-runner-service.json)" = "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/psd-eoc/exploration-smoke/server@$IMAGE_DIGEST"

          log_group_base="/aws/apprunner/$service_name/$service_id"
          application_log_group="$log_group_base/application"
          service_log_group="$log_group_base/service"
          log_group_arn_prefix="arn:aws:logs:$AWS_REGION:$AWS_ACCOUNT_ID:log-group:"
          log_group_candidate="$RUNNER_TEMP/exploration-smoke-log-groups.json"
          for attempt in {1..30}; do
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_base/" \
              --query 'logGroups[].{logGroupName:logGroupName,arn:arn,logGroupArn:logGroupArn,creationTime:creationTime,retentionInDays:retentionInDays,storedBytes:storedBytes}' \
              --output json \
              > "$log_group_candidate"
            if jq -e \
              --arg application "$application_log_group" \
              --arg service "$service_log_group" \
              --arg arn_prefix "$log_group_arn_prefix" '
                (map(.logGroupName) | sort) == ([$application, $service] | sort) and
                all(.[]; .arn == ($arn_prefix + .logGroupName + ":*"))
              ' \
              "$log_group_candidate" > /dev/null; then
              break
            fi
            if [[ "$attempt" -eq 30 ]]; then
              echo "The exact App Runner log groups were not discoverable." >&2
              exit 1
            fi
            sleep 5
          done
          for log_group in "$application_log_group" "$service_log_group"; do
            aws logs put-retention-policy \
              --log-group-name "$log_group" \
              --retention-in-days "$APP_RUNNER_LOG_RETENTION_DAYS"
          done
          for attempt in {1..20}; do
            aws logs describe-log-groups \
              --log-group-name-prefix "$log_group_base/" \
              --query 'logGroups[].{logGroupName:logGroupName,arn:arn,logGroupArn:logGroupArn,creationTime:creationTime,retentionInDays:retentionInDays,storedBytes:storedBytes}' \
              --output json \
              > artifacts/readback/app-runner-log-groups.json
            if jq -e \
              --arg application "$application_log_group" \
              --arg service "$service_log_group" \
              --arg arn_prefix "$log_group_arn_prefix" \
              --arg retention "$APP_RUNNER_LOG_RETENTION_DAYS" '
                (map(.logGroupName) | sort) == ([$application, $service] | sort) and
                all(.[];
                  .arn == ($arn_prefix + .logGroupName + ":*") and
                  .retentionInDays == ($retention | tonumber))
              ' artifacts/readback/app-runner-log-groups.json > /dev/null; then
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo "The exact App Runner log retention did not become visible." >&2
              exit 1
            fi
            sleep 3
          done

          scaling_arn=$(jq -er '.Service.AutoScalingConfigurationSummary.AutoScalingConfigurationArn' artifacts/readback/app-runner-service.json)
          aws apprunner describe-auto-scaling-configuration \
            --auto-scaling-configuration-arn "$scaling_arn" \
            > artifacts/readback/app-runner-scaling.json
          test "$(jq -r '.AutoScalingConfiguration.MinSize' artifacts/readback/app-runner-scaling.json)" -eq 1
          test "$(jq -r '.AutoScalingConfiguration.MaxSize' artifacts/readback/app-runner-scaling.json)" -eq 1

          aws rds describe-db-clusters --db-cluster-identifier "$database_id" > artifacts/readback/database-cluster.json
          test "$(jq '[.DBClusters[0].DBClusterMembers[] | select(.IsClusterWriter == true)] | length' artifacts/readback/database-cluster.json)" -eq 1
          test "$(jq '[.DBClusters[0].DBClusterMembers[] | select(.IsClusterWriter == false)] | length' artifacts/readback/database-cluster.json)" -eq 0
          test "$(jq -r '.DBClusters[0].HttpEndpointEnabled' artifacts/readback/database-cluster.json)" = "false"
          test "$(jq -r '.DBClusters[0].StorageEncrypted' artifacts/readback/database-cluster.json)" = "true"
          test "$(jq -r '.DBClusters[0].Endpoint' artifacts/readback/database-cluster.json)" = "$runtime_database_host"
          test "$(jq -r '.DBClusters[0].Port' artifacts/readback/database-cluster.json)" = "5432"
          database_parameter_group=$(jq -er '.DBClusters[0].DBClusterParameterGroup' artifacts/readback/database-cluster.json)
          # shellcheck disable=SC2016
          aws rds describe-db-cluster-parameters \
            --db-cluster-parameter-group-name "$database_parameter_group" \
            --query 'Parameters[?ParameterName==`rds.force_ssl`].{ParameterName:ParameterName,ParameterValue:ParameterValue,Source:Source}' \
            > artifacts/readback/database-force-ssl.json
          jq -e '. == [{
            ParameterName: "rds.force_ssl",
            ParameterValue: "1",
            Source: "user"
          }]' artifacts/readback/database-force-ssl.json > /dev/null
          database_writer_id=$(jq -er '.DBClusters[0].DBClusterMembers[] | select(.IsClusterWriter == true) | .DBInstanceIdentifier' artifacts/readback/database-cluster.json)
          aws rds describe-db-instances --db-instance-identifier "$database_writer_id" \
            > artifacts/readback/database-writer.json
          test "$(jq -r '.DBInstances[0].PubliclyAccessible' artifacts/readback/database-writer.json)" = "false"
          test "$(jq -r '.DBInstances[0].DBInstanceStatus' artifacts/readback/database-writer.json)" = "available"

          aws sqs get-queue-attributes --queue-url "$queue_url" --attribute-names All > artifacts/readback/health-queue.json
          test "$(jq -r '.Attributes.QueueArn' artifacts/readback/health-queue.json)" = "$queue_arn"
          test "$(jq -r '.Attributes.ApproximateNumberOfMessages' artifacts/readback/health-queue.json)" = "0"
          test "$(jq -r '.Attributes.ApproximateNumberOfMessagesNotVisible' artifacts/readback/health-queue.json)" = "0"

          runtime_role_logical_id=$(jq -er '
            .Outputs.RuntimeRoleArn.Value."Fn::GetAtt" as $attribute |
            if
              ($attribute | type) == "array" and
              ($attribute | length) == 2 and
              $attribute[1] == "Arn"
            then $attribute[0]
            else error("unexpected runtime-role output")
            end
          ' "$runtime_template")
          runtime_policy_name=$(jq -er --arg role "$runtime_role_logical_id" '
            [
              .Resources | to_entries[] |
              select(
                .value.Type == "AWS::IAM::Policy" and
                ([.value.Properties.Roles[]? | select(.Ref == $role)] | length) == 1
              )
            ] as $policies |
            if
              ($policies | length) == 1 and
              ($policies[0].value.Properties.PolicyName | type) == "string"
            then $policies[0].value.Properties.PolicyName
            else error("unexpected runtime-role policy inventory")
            end
          ' "$runtime_template")
          [[ "$runtime_role_logical_id" =~ ^[A-Za-z0-9]+$ ]]
          [[ "$runtime_policy_name" =~ ^[A-Za-z0-9+=,.@_-]{1,128}$ ]]

          aws iam get-role \
            --role-name "$runtime_role_name" \
            --query 'Role.{Arn:Arn,AssumeRolePolicyDocument:AssumeRolePolicyDocument,PermissionsBoundary:PermissionsBoundary}' \
            > artifacts/readback/runtime-role.json
          test "$(jq -r '.Arn' artifacts/readback/runtime-role.json)" = "$runtime_role_arn"
          jq -e '
            def as_array: if type == "array" then . else [.] end;
            (.AssumeRolePolicyDocument.Statement | as_array) as $statements |
            (.PermissionsBoundary // null) == null and
            (.AssumeRolePolicyDocument | keys | sort) == ["Statement", "Version"] and
            .AssumeRolePolicyDocument.Version == "2012-10-17" and
            ($statements | length) == 1 and
            ($statements[0] | keys | sort) == ["Action", "Effect", "Principal"] and
            $statements[0].Effect == "Allow" and
            ($statements[0].Action | as_array) == ["sts:AssumeRole"] and
            ($statements[0].Principal | keys | sort) == ["Service"] and
            ($statements[0].Principal.Service | as_array) == ["tasks.apprunner.amazonaws.com"]
          ' artifacts/readback/runtime-role.json > /dev/null

          aws iam list-role-policies --role-name "$runtime_role_name" > artifacts/readback/runtime-inline-policies.json
          aws iam list-attached-role-policies --role-name "$runtime_role_name" > artifacts/readback/runtime-attached-policies.json
          jq -e --arg expected "$runtime_policy_name" \
            '.PolicyNames == [$expected]' \
            artifacts/readback/runtime-inline-policies.json > /dev/null
          jq -e '.AttachedPolicies == []' \
            artifacts/readback/runtime-attached-policies.json > /dev/null

          aws iam get-role-policy \
            --role-name "$runtime_role_name" \
            --policy-name "$runtime_policy_name" \
            > artifacts/readback/runtime-inline-policy.json
          expected_secret_resources=$(jq -cn \
            --arg application "$database_application_secret_arn" \
            --arg identity "$approved_identity_secret_arn" \
            --arg api_salt "$api_salt_secret_arn" \
            --arg google_oauth "$GOOGLE_OAUTH_SECRET_ARN" \
            --arg oidc_cookie "$google_oidc_cookie_secret_arn" \
            '[$application, $identity, $api_salt, $google_oauth, $oidc_cookie] | sort')
          jq -e \
            --arg role_name "$runtime_role_name" \
            --arg policy_name "$runtime_policy_name" \
            --arg queue "$queue_arn" \
            --argjson secret_resources "$expected_secret_resources" '
              def as_array: if type == "array" then . else [.] end;
              def action_set: (.Action | as_array | sort);
              def resource_set: (.Resource | as_array | sort);
              (.PolicyDocument.Statement | as_array) as $statements |
              .RoleName == $role_name and
              .PolicyName == $policy_name and
              (.PolicyDocument | keys | sort) == ["Statement", "Version"] and
              .PolicyDocument.Version == "2012-10-17" and
              ($statements | length) == 2 and
              all($statements[];
                (. | keys | sort) == ["Action", "Effect", "Resource"] and
                .Effect == "Allow"
              ) and
              ([
                $statements[] |
                select(
                  action_set == [
                    "secretsmanager:DescribeSecret",
                    "secretsmanager:GetSecretValue"
                  ] and
                  resource_set == ($secret_resources | sort)
                )
              ] | length) == 1 and
              ([
                $statements[] |
                select(
                  action_set == ["sqs:GetQueueAttributes"] and
                  resource_set == [$queue]
                )
              ] | length) == 1
            ' artifacts/readback/runtime-inline-policy.json > /dev/null

          aws iam simulate-principal-policy \
            --policy-source-arn "$runtime_role_arn" \
            --action-names sqs:SendMessage \
            --resource-arns "$queue_arn" "$email_queue_arn" "$email_dlq_arn" \
            > artifacts/readback/queue-send-negative-simulation.json
          jq -e \
            --arg health "$queue_arn" \
            --arg email "$email_queue_arn" \
            --arg dlq "$email_dlq_arn" '
              [
                .EvaluationResults[] as $result |
                if (($result.ResourceSpecificResults // []) | length) > 0 then
                  $result.ResourceSpecificResults[] | {
                    action: $result.EvalActionName,
                    resource: .EvalResourceName,
                    decision: .EvalResourceDecision
                  }
                else
                  {
                    action: $result.EvalActionName,
                    resource: $result.EvalResourceName,
                    decision: $result.EvalDecision
                  }
                end
              ] as $results |
              ([$results[].resource] | unique | sort) == ([$health, $email, $dlq] | sort) and
              ([$results[].action] | unique) == ["sqs:SendMessage"] and
              all($results[]; .decision != "allowed")
            ' artifacts/readback/queue-send-negative-simulation.json > /dev/null
          aws iam simulate-principal-policy \
            --policy-source-arn "$runtime_role_arn" \
            --action-names ses:SendEmail ses:SendRawEmail \
            --resource-arns "$ses_identity_arn" \
            > artifacts/readback/ses-send-negative-simulation.json
          jq -e \
            --arg identity "$ses_identity_arn" '
              [
                .EvaluationResults[] as $result |
                if (($result.ResourceSpecificResults // []) | length) > 0 then
                  $result.ResourceSpecificResults[] | {
                    action: $result.EvalActionName,
                    resource: .EvalResourceName,
                    decision: .EvalResourceDecision
                  }
                else
                  {
                    action: $result.EvalActionName,
                    resource: $result.EvalResourceName,
                    decision: $result.EvalDecision
                  }
                end
              ] as $results |
              ([$results[].action] | unique | sort) == ["ses:SendEmail", "ses:SendRawEmail"] and
              ([$results[].resource] | unique) == [$identity] and
              all($results[]; .decision != "allowed")
            ' artifacts/readback/ses-send-negative-simulation.json > /dev/null
          aws iam simulate-principal-policy \
            --policy-source-arn "$runtime_role_arn" \
            --action-names sns:Publish \
            --resource-arns "$ses_events_topic_arn" \
            > artifacts/readback/sns-publish-negative-simulation.json
          jq -e \
            --arg topic "$ses_events_topic_arn" '
              [
                .EvaluationResults[] as $result |
                if (($result.ResourceSpecificResults // []) | length) > 0 then
                  $result.ResourceSpecificResults[] | {
                    action: $result.EvalActionName,
                    resource: .EvalResourceName,
                    decision: .EvalResourceDecision
                  }
                else
                  {
                    action: $result.EvalActionName,
                    resource: $result.EvalResourceName,
                    decision: $result.EvalDecision
                  }
                end
              ] as $results |
              ([$results[].action] | unique) == ["sns:Publish"] and
              ([$results[].resource] | unique) == [$topic] and
              all($results[]; .decision != "allowed")
            ' artifacts/readback/sns-publish-negative-simulation.json > /dev/null
          aws iam simulate-principal-policy \
            --policy-source-arn "$runtime_role_arn" \
            --action-names sqs:GetQueueAttributes \
            --resource-arns "$queue_arn" \
            > artifacts/readback/health-action-simulation.json
          test "$(jq -r '.EvaluationResults[0].EvalDecision' artifacts/readback/health-action-simulation.json)" = "allowed"

          curl \
            --fail \
            --proto '=https' \
            --retry 8 \
            --retry-all-errors \
            --retry-delay 15 \
            --show-error \
            --silent \
            --tlsv1.2 \
            --max-time 30 \
            "$health_url" \
            > artifacts/readback/health-response.json
          jq -e '.status == "ok"' artifacts/readback/health-response.json > /dev/null

          {
            echo "# Exploration-smoke deployment readback"
            echo
            printf '%s\n' "- Source commit: $SOURCE_SHA"
            printf '%s\n' "- Image digest: $IMAGE_DIGEST"
            printf '%s\n' "- Stack: $STACK_NAME"
            printf '%s\n' "- AWS: $AWS_ACCOUNT_ALIAS / $AWS_ACCOUNT_ID / $AWS_REGION"
            echo "- One App Runner instance, its exact VPC connector, one private Aurora writer with the cluster HTTP endpoint disabled, one ECR repository, and the exact three-queue health/email/email-DLQ topology were read back from the protected stack."
            echo "- The exact candidate Fargate task ran without overrides in private subnets, stopped at exit zero on the expected image digest, and emitted one native-PostgreSQL summary proving verified TLS, two equivalent bootstrap passes, zero canonical synthetic operational rows, and preserved immutable truth anchors."
            printf '%s\n' "- The exact App Runner service and application log groups were read back with $APP_RUNNER_LOG_RETENTION_DAYS-day retention."
            printf '%s\n' "- Deployment-role policy inventory SHA-256: $(cat artifacts/readback/deployment-role-policy-inventory.sha256)"
            printf '%s\n' "- Deployment-role permissions boundary: $EXPECTED_DEPLOY_ROLE_BOUNDARY_ARN"
            printf '%s\n' "- Repository gate: $REPOSITORY_GATE_RECORD"
            echo "- Exact runtime-role trust, absent boundary, empty attached-policy list, and one least-privilege inline policy were read back; it can read only five exact secret resources and health-queue attributes. Simulations denied SQS SendMessage on all three queues, SES SendEmail/SendRawEmail, and SNS Publish."
            echo "- The protected stack exactly matched the reviewed disabled SES configuration set, encrypted SNS/KMS evidence topic, and non-executable email consumer role. The one externally managed SES event destination was read back exactly before and after deployment because its CloudFormation type is not importable. No SES email identity, SNS subscription, ECS service, Lambda, schedule, or event rule exists; bootstrap evidence retained zero enabled notification channels and zero matching recipients."
            echo "- Generated secrets and the OAuth credential value were not printed."
            echo "- Valid public HTTPS and deep health succeeded at the App Runner provider URL through certificate-verified native PostgreSQL."
            echo "- Google OIDC remains configured-unverified; web/mobile sign-in stays blocked until the separately owned eoc.psd401.net custom-domain work is live and a human completes an approved district sign-in."
            echo "- No DNS, GCP, store, recipient, provider-send, queue-send, or message-send operation ran; email remains configured-unverified and disabled."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted deployment readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: warn
          name: exploration-smoke-readback-${{ github.run_id }}
          overwrite: false
          path: artifacts/readback
          retention-days: 14
