name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, typecheck, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: psd_eoc_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_USER: psd_eoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psd_eoc_test -d psd_eoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://psd_eoc_test:synthetic_test_password@localhost:5432/psd_eoc_test
      TEST_DATABASE_URL: postgresql://psd_eoc_test:synthetic_test_password@localhost:5432/psd_eoc_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install

      - name: Run the repository gate
        run: bun run check

  mobile:
    name: Mobile lint, typecheck, test, and prebuild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Lint the mobile app
        working-directory: packages/mobile
        run: bun run lint

      - name: Typecheck the mobile app
        working-directory: packages/mobile
        run: bun run typecheck

      - name: Test the mobile app
        working-directory: packages/mobile
        run: bun run test

      - name: Check Expo dependency compatibility
        working-directory: packages/mobile
        run: bun run expo:check

      - name: Generate native projects without installing dependencies
        working-directory: packages/mobile
        run: bun run prebuild:check

      - name: Verify generated native safety configuration
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          test -d android
          test -d ios
          rg --fixed-strings 'net.psd401.eoc' android/app
          rg --fixed-strings 'net.psd401.eoc' ios
          rg --fixed-strings 'com.google.firebase.messaging.default_notification_channel_id' android/app/src/main/AndroidManifest.xml
          rg --glob '*.entitlements' --fixed-strings '<key>aps-environment</key>' ios
