name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the expensive jobs need to run. A workflow-only or
  # docs-only change should not pay for the full test suite or a mobile
  # prebuild. On push to main everything runs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      mobile: ${{ steps.filter.outputs.mobile }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            {
              echo "code=true"
              echo "mobile=true"
              echo "workflows=true"
            } >> "$GITHUB_OUTPUT"
            echo "Push to main: running everything." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          changed=$(git diff --name-only "$base" "$head")

          code=false
          mobile=false
          workflows=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/*) workflows=true ;;
            esac
            case "$file" in
              packages/mobile/*) mobile=true; code=true ;;
              bun.lock | package.json) mobile=true; code=true ;;
              # Workflows, documentation, and CODEOWNERS cannot change program
              # behavior, so they must not trigger the suite. Workflow changes
              # are covered by actionlint in the `workflows` job instead.
              .github/* | *.md | docs/* | CODEOWNERS | LICENSE) ;;
              *) code=true ;;
            esac
          done <<< "$changed"

          {
            echo "code=$code"
            echo "mobile=$mobile"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Changed areas"
            echo ""
            echo "| area | runs |"
            echo "|---|---|"
            echo "| code (tests) | $code |"
            echo "| mobile | $mobile |"
            echo "| workflows | $workflows |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Fast feedback. Runs on every change, no database, target under two minutes.
  static:
    name: Format, lint, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

  build:
    name: Build the server image contents
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `next build` imports every route to collect page data, so a module that
      # reads deployment configuration at import time fails here and nowhere
      # else: format, lint, typecheck, and the test suite all pass without it.
      # That gap sent a broken image to the deploy, which is a slow and
      # expensive place to discover it.
      #
      # No district configuration is set on purpose. The image is built once and
      # deployed by any district, so it has to compile without knowing whose
      # domain it will serve.
      - name: Build the server
        run: bun run --cwd packages/server build

  # An applied migration is a record of something that already happened, and
  # nothing else notices when one is edited: drizzle records each file's hash on
  # the way in and never reads it again. Only a pull request has a base to
  # compare against, so this cannot run on push.
  migrations:
    name: Applied migrations unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Check that this change only adds to the migration chain
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          bun scripts/check-applied-migrations.ts "$BASE_SHA" "$HEAD_SHA"

  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # The suite runs in parallel shards and is expected to finish in about a
    # minute. A generous ceiling here only hides a regression in that.
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: psd_eoc_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_USER: psd_eoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psd_eoc_test -d psd_eoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://psd_eoc_test:synthetic_test_password@localhost:5432/psd_eoc_test
      TEST_DATABASE_URL: postgresql://psd_eoc_test:synthetic_test_password@localhost:5432/psd_eoc_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run the test suite
        run: bun run test

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Lint the mobile app
        working-directory: packages/mobile
        run: bun run lint

      - name: Typecheck the mobile app
        working-directory: packages/mobile
        run: bun run typecheck

      - name: Test the mobile app
        working-directory: packages/mobile
        run: bun run test

      - name: Check Expo dependency compatibility
        working-directory: packages/mobile
        run: bun run expo:check

      - name: Verify the shared React runtime resolution
        working-directory: packages/mobile
        run: bun run react:check

      - name: Generate native projects without installing dependencies
        working-directory: packages/mobile
        run: bun run prebuild:check

      - name: Verify generated native safety configuration
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          test -d android
          test -d ios
          grep -RFq 'net.psd401.eoc' android/app
          grep -RFq 'net.psd401.eoc' ios
          grep -Fq 'com.google.firebase.messaging.default_notification_channel_id' android/app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"/>' android/app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" tools:node="remove"/>' android/app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove"/>' android/app/src/main/AndroidManifest.xml
          grep -Fq '<string name="expo_system_ui_user_interface_style" translatable="false">light</string>' android/app/src/main/res/values/strings.xml
          grep -A1 -F '<key>UIUserInterfaceStyle</key>' ios/PSDEOC/Info.plist | grep -Fq '<string>Light</string>'
          grep -RFq --include='*.entitlements' '<key>aps-environment</key>' ios
