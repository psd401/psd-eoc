name: CI

on:
  pull_request:
    branches: [main]
    types: [labeled, opened, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the expensive jobs need to run. A workflow-only or
  # docs-only change should not pay for the full test suite or a mobile
  # prebuild. On push to main everything runs.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      mobile: ${{ steps.filter.outputs.mobile }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            {
              echo "code=true"
              echo "mobile=true"
              echo "workflows=true"
            } >> "$GITHUB_OUTPUT"
            echo "Push to main: running everything." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base=$(jq -er '.pull_request.base.sha' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head" =~ ^[0-9a-f]{40}$ ]]
          changed=$(git diff --name-only "$base" "$head")

          code=false
          mobile=false
          workflows=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              .github/workflows/*) workflows=true ;;
            esac
            case "$file" in
              packages/mobile/*) mobile=true; code=true ;;
              bun.lock | package.json) mobile=true; code=true ;;
              # Workflows, documentation, and CODEOWNERS cannot change program
              # behavior, so they must not trigger the suite. Workflow changes
              # are covered by actionlint in the `workflows` job instead.
              .github/* | *.md | docs/* | CODEOWNERS | LICENSE) ;;
              *) code=true ;;
            esac
          done <<< "$changed"

          {
            echo "code=$code"
            echo "mobile=$mobile"
            echo "workflows=$workflows"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Changed areas"
            echo ""
            echo "| area | runs |"
            echo "|---|---|"
            echo "| code (tests) | $code |"
            echo "| mobile | $mobile |"
            echo "| workflows | $workflows |"
          } >> "$GITHUB_STEP_SUMMARY"

  # A clean checkout exercises the same authoritative gate contributors run.
  # It runs for documentation changes too because current documentation is part
  # of the format contract.
  gate:
    name: README fresh-clone and repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install PDF verification dependency
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Set up Terraform for isolated Firebase plan tests
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Start repository-owned synthetic PostgreSQL
        run: bun run test:db:start

      - name: Migrate and seed synthetic PostgreSQL
        run: |
          bun run test:db:migrate
          bun run test:db:seed

      - name: Start the documented web app
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/psd-eoc-readme-web.log"
          bun run test:web > "$log" 2>&1 &
          server_pid=$!
          cleanup() {
            if kill -0 "$server_pid" 2>/dev/null; then
              kill "$server_pid"
              set +e
              wait "$server_pid"
              set -e
            fi
          }
          trap cleanup EXIT

          page_ready=false
          for _ in {1..60}; do
            if code=$(curl --silent --show-error --output "$RUNNER_TEMP/login.html" --write-out '%{http_code}' --max-time 5 http://127.0.0.1:3000/login); then
              if [[ "$code" == "200" ]]; then
                grep --fixed-strings --quiet 'Example School District' "$RUNNER_TEMP/login.html"
                page_ready=true
                break
              fi
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              sed -n '1,240p' "$log" >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$page_ready" != "true" ]]; then
            sed -n '1,240p' "$log" >&2
            exit 1
          fi
          cleanup
          trap - EXIT

      # The ignored local file contains only the reserved example identity;
      # the deployable build still receives no production tenant identity.
      - name: Run the authoritative repository gate
        run: bun run check

      - name: Run issue 278 provider-free lifecycle verification
        run: bun run test:e2e:issue-278

      - name: Run issue 43 direct-push cutover verification
        run: bun run test:e2e:issue-43

      - name: Synthesize a second-district infrastructure configuration
        run: bun run --cwd infra synth:example

      - name: Stop synthetic PostgreSQL
        if: always()
        run: bun run test:db:stop

  # An applied migration is a record of something that already happened, and
  # nothing else notices when one is edited: drizzle records each file's hash on
  # the way in and never reads it again. Only a pull request has a base to
  # compare against, so this cannot run on push.
  migrations:
    name: Applied migrations unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Check that this change only adds to the migration chain
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          bun scripts/check-applied-migrations.ts "$BASE_SHA" "$HEAD_SHA"

  workflows:
    name: Lint workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run actionlint
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color

  browser:
    name: Operator browser flows
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: psd_eoc_test
          POSTGRES_PASSWORD: synthetic_test_password
          POSTGRES_USER: psd_eoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psd_eoc_test -d psd_eoc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PSD_EOC_E2E_SERVER_MODE: production
      TEST_DATABASE_URL: postgresql://psd_eoc_test:synthetic_test_password@localhost:5432/psd_eoc_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build the production server
        run: bun run --cwd packages/server build

      - name: Run the operator browser flows
        run: bun run test:e2e:issue-340

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: issue-340-browser-failure
          path: .verification/issue-340/playwright-artifacts
          if-no-files-found: warn
          retention-days: 7

  mobile:
    name: Mobile
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies from the lockfile
        run: bun install --frozen-lockfile

      - name: Check Expo dependency compatibility
        working-directory: packages/mobile
        run: bun run expo:check

      - name: Verify the shared React runtime resolution
        working-directory: packages/mobile
        run: bun run react:check

      - name: Generate native projects without installing dependencies
        working-directory: packages/mobile
        run: bun run prebuild:check

      - name: Verify generated native safety configuration
        working-directory: packages/mobile
        run: |
          set -euo pipefail
          test -d android
          test -d ios
          bundle_id=$(jq -er '.expo.ios.bundleIdentifier' app.json)
          grep -RFq "$bundle_id" android/app
          grep -RFq "$bundle_id" ios
          grep -Fq 'com.google.firebase.messaging.default_notification_channel_id' android/app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"/>' android/app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" tools:node="remove"/>' android/app/src/main/AndroidManifest.xml
          grep -Fq '<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove"/>' android/app/src/main/AndroidManifest.xml
          grep -Fq '<string name="expo_system_ui_user_interface_style" translatable="false">light</string>' android/app/src/main/res/values/strings.xml
          grep -A1 -F '<key>UIUserInterfaceStyle</key>' ios/PSDEOC/Info.plist | grep -Fq '<string>Light</string>'
          grep -RFq --include='*.entitlements' '<key>aps-environment</key>' ios

  native-e2e:
    name: Opt-in native E2E
    if: github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'mobile-e2e') || contains(github.event.pull_request.labels.*.name, 'direct-push-cutover'))
    uses: ./.github/workflows/mobile-e2e.yml
    permissions:
      contents: read
