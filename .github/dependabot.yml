version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
  # Bun workspaces: one update stream for the whole monorepo, grouped so a
  # routine bump is one pull request rather than one per package.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    # The Expo SDK pins these to the versions its native modules are built
    # against, and `bunx expo install --fix` in packages/mobile moves them
    # together. A Dependabot bump of any one of them fails `expo:check` and
    # breaks the mobile build, so they move only with an SDK upgrade.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@types/react'
      - dependency-name: '@types/react-dom'
      # postgres runs with patches/postgres@<version>.patch, which fixes the
      # close and cancel lifecycle (issue #130). Version 4 rewrote the pool,
      # so the patch cannot apply, and without it the issue #130 close and
      # reconnect probes fail (tried 2026-11-17, #693). Patch and minor
      # updates still come through: Bun ties the patch to the exact version,
      # so such a PR fails drizzle/postgres-patch.test.ts until the patch is
      # carried forward to the new version by hand.
      - dependency-name: 'postgres'
        update-types: ['version-update:semver-major']
