appId: net.psd401.eoc
name: Issue 32 - retry only the exact failed Android session authentication
tags: [issue-32, synthetic-only, android, authentication, pre-auth]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertVisible: '^Unlock PSD EOC$'
- assertVisible: '^PSD EOC remains locked$'
- assertVisible: '^PSD EOC could not verify device authentication\. Try again or contact district technology support\.$'
- tapOn:
    text: '^Try device unlock again$'
    enabled: true
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
# Stop with the exact SystemUI sheet pending. The runner still requires its
# app-specific title before entering the synthetic emulator credential.
