appId: net.psd401.eoc
name: Issue 32 - open the route-proof iOS drill notification from the authenticated app
tags: [issue-32, synthetic-only, ios, notification, route]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertTrue:
    condition: ${NOTIFICATION_TITLE == '[DRILL] Synthetic lockdown drill'}
    label: Require the exact synthetic drill notification title
- swipe:
    start: 50%, 0%
    end: 50%, 80%
    duration: 600
- extendedWaitUntil:
    visible: '\[DRILL\] Synthetic lockdown drill'
    timeout: 30000
- assertNotVisible: '.*\[INCIDENT\].*'
- tapOn:
    id: 'NotificationTitle'
    text: '^\[DRILL\] Synthetic lockdown drill$'
# The production response listener and protected navigator are already stable.
# The runner still requires same-request SpringBoard action evidence and the
# exact event-room post-state; no test-only route or event-card tap is used.
