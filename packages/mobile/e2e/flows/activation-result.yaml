appId: ${APP_ID}
name: Issue 32 - finish synthetic drill activation
tags: [issue-32, synthetic-only]
---
- assertTrue:
    condition: ${PSD_EOC_E2E_SYNTHETIC_ONLY == 'true'}
    label: Refuse to run outside the synthetic mobile harness
- runFlow:
    when:
      platform: ios
    commands:
      - tapOn:
          text: 'Allow'
          waitUntilVisible: true
          optional: true
# Starting a drill opens its event room; there is no confirmation screen to tap
# through on the way there.
- extendedWaitUntil:
    visible: 'Synthetic earthquake drill. Synthetic Test School, SYNTH.'
    timeout: 15000
- assertVisible: '.*DRILL — TRAINING ONLY.*'
- assertNotVisible: '^REAL INCIDENT$'
- pressKey: HOME
