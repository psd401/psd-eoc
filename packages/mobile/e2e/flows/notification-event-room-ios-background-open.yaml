appId: net.psd401.eoc
name: Issue 32 - open the route-proof iOS drill notification from system Home
tags: [issue-32, synthetic-only, ios, notification, route]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertTrue:
    condition: ${NOTIFICATION_TITLE == '[DRILL] Synthetic lockdown drill'}
    label: Require the exact synthetic drill notification title
# Background the already-authenticated app without terminating its mounted
# production response listener. XCTest can then inspect SpringBoard rather than
# returning the underlying app hierarchy through the Notification Center layer.
- pressKey: home
- swipe:
    start: 50%, 0%
    end: 50%, 80%
    duration: 600
- extendedWaitUntil:
    visible: '\[DRILL\] Synthetic lockdown drill'
    timeout: 30000
- assertNotVisible: '.*\[INCIDENT\].*'
- tapOn:
    id: 'NotificationTitle'
    text: '^\[DRILL\] Synthetic lockdown drill$'
# Stop while the ordinary foreground lifecycle requests device authentication.
# The runner next proves same-request SpringBoard action evidence, answers that
# genuine prompt, and requires the exact event-room post-state.
