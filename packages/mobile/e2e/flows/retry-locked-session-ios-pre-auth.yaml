appId: net.psd401.eoc
name: Issue 32 - retry only the exact failed iOS session authentication
tags: [issue-32, synthetic-only, ios, authentication, pre-auth]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertVisible: '^Unlock PSD EOC$'
- assertVisible: '^PSD EOC remains locked$'
- assertVisible: '^PSD EOC could not verify device authentication\. Try again or contact district technology support\.$'
- tapOn:
    text: '^Try device unlock again$'
    enabled: true
# Stop with the native sheet pending so the runner can observe the exact secure
# token and answer only this same authentication request.
