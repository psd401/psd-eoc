appId: net.psd401.eoc
name: Issue 32 - request Android unlock from synthetic drill notification
tags: [issue-32, synthetic-only, android, notification, pre-auth]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertTrue:
    condition: ${NOTIFICATION_TITLE == '[DRILL] Synthetic lockdown drill'}
    label: Require the exact synthetic drill notification title
- assertVisible: '\[DRILL\] Synthetic lockdown drill'
- assertNotVisible: '.*\[INCIDENT\].*'
- tapOn: '\[DRILL\] Synthetic lockdown drill'
- extendedWaitUntil:
    visible: 'Unlock PSD EOC'
    timeout: 30000
- tapOn:
    text: 'Unlock with device security'
    enabled: true
# Stop with Android SystemUI device authentication pending.
