appId: net.psd401.eoc
name: Issue 32 - join the exact drill after the verified iOS notification action
tags: [issue-32, synthetic-only, ios, notification, join]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
# The runner has already required the same-request SpringBoard default action.
# The production response listener and parser are exercised and logged, but on
# iOS 26 the protected router remains on this lobby after the system overlay
# closes. Join the same run-specific active drill through the ordinary UI so
# this issue's mobile journey proves that exact selection without claiming
# navigation that did not occur. The runner next uses the app's registered
# read-only event URL and independently requires the canonical room evidence.
- extendedWaitUntil:
    visible: 'Join existing DRILL — PRACTICE: ${EVENT_TYPE_NAME} at ${FACILITY_NAME}.*Event ID ${EVENT_ID}'
    timeout: 60000
- assertNotVisible: '.*\[INCIDENT\].*'
- tapOn: 'Join existing DRILL — PRACTICE: ${EVENT_TYPE_NAME} at ${FACILITY_NAME}.*Event ID ${EVENT_ID}'
- waitForAnimationToEnd:
    timeout: 5000
# Do not ask the registered URL to open until the exact synthetic join has
# completed. "Open event" is the app-owned result and cannot be produced by
# the notification overlay or by an unrelated event.
- extendedWaitUntil:
    visible: '^Open event$'
    timeout: 60000
