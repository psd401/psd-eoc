appId: net.psd401.eoc
name: Issue 32 - resume iOS app without consuming the pending drill notification
tags: [issue-32, synthetic-only, ios, notification, system-resume]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertTrue:
    condition: ${NOTIFICATION_TITLE == '[DRILL] Synthetic lockdown drill'}
    label: Require the exact pending synthetic drill notification title
# System Face ID has cleared the device lock. This single unlock gesture resumes
# the already-mounted app without tapping or dismissing the pending notification.
- swipe:
    start: 50%, 98%
    end: 50%, 10%
    duration: 1000
# Stop while PSD EOC's independent LocalAuthentication sheet is awaiting its
# enrolled simulator biometric.
