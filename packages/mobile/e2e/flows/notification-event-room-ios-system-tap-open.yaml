appId: net.psd401.eoc
name: Issue 32 - tap the measured synthetic iOS notification Open action
tags: [issue-32, synthetic-only, ios, notification, tap-open]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertTrue:
    condition: ${NOTIFICATION_TITLE == '[DRILL] Synthetic lockdown drill'}
    label: Require the exact synthetic drill notification title
- assertTrue:
    condition: ${IOS_NOTIFICATION_OPEN_POINT != null}
    label: Require the runner-measured Open point
- tapOn:
    point: '${IOS_NOTIFICATION_OPEN_POINT}'
    retryTapIfNoChange: false
# Stop while the app's independent LocalAuthentication sheet is awaiting its
# enrolled simulator biometric. The runner never retries this tap.
