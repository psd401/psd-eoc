appId: net.psd401.eoc
name: Issue 32 - verify Android notification routed to exact drill room
tags: [issue-32, synthetic-only, android, notification, post-auth]
---
- runFlow:
    file: shared/assert-synthetic-context.yaml
- assertTrue:
    condition: ${NOTIFICATION_TITLE == '[DRILL] Synthetic lockdown drill'}
    label: Require the exact retained synthetic drill route title
- assertVisible: '\[DRILL\] Synthetic lockdown drill'
- assertNotVisible: '.*\[INCIDENT\].*'
- tapOn: '\[DRILL\] Synthetic lockdown drill'
- runFlow:
    file: shared/assert-active-drill-room.yaml
    env:
      EVENT_ROUTE_EVIDENCE: ${EVENT_ROUTE_EVIDENCE}
      EVENT_TYPE_NAME: ${EVENT_TYPE_NAME}
      FACILITY_CODE: ${FACILITY_CODE}
      FACILITY_NAME: ${FACILITY_NAME}
