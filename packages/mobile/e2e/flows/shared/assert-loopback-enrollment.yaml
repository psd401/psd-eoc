appId: net.psd401.eoc
---
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: retry-loopback-if-offline.yaml
      - extendedWaitUntil:
          visible: 'Join existing DRILL — PRACTICE: ${EVENT_TYPE_NAME} at ${FACILITY_NAME}.*Event ID ${EVENT_ID}'
          timeout: 60000
- assertVisible: 'PSD EOC'
- assertVisible: 'Active events'
- assertVisible: 'Join existing DRILL — PRACTICE: ${EVENT_TYPE_NAME} at ${FACILITY_NAME}.*Event ID ${EVENT_ID}'
- scrollUntilVisible:
    element: '${FACILITY_CODE}'
    direction: DOWN
- assertVisible: '${FACILITY_CODE}'
- assertNotVisible: 'Current operations unavailable'
- assertNotVisible: 'Synthetic test mode. Synthetic recipients only. No live provider sends.'
