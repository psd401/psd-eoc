appId: net.psd401.eoc
---
- runFlow:
    when:
      visible: '^Offline — cached view only$'
    commands:
      - tapOn: '^Reconnect and load current operations$'
      - extendedWaitUntil:
          notVisible: '^Offline — cached view only$'
          timeout: 60000
# Each invocation permits one visible, user-initiated reconnect tap. The
# enrollment assertion bounds its caller to one retry, and a remaining offline
# state still fails closed; no mutation is queued while disconnected.
