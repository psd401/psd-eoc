appId: net.psd401.eoc
---
- extendedWaitUntil:
    visible:
      id: 'issue-21-synthetic-mode'
    timeout: 30000
- scrollUntilVisible:
    element:
      id: 'issue-21-synthetic-mode'
    direction: UP
- assertVisible:
    id: 'issue-21-synthetic-mode'
- assertVisible: 'Synthetic test mode. Synthetic recipients only. No live provider sends.'
- scrollUntilVisible:
    element:
      id: 'issue-21-start-drill'
    direction: DOWN
- assertVisible:
    id: 'issue-21-start-drill'
- assertVisible: 'DRILL — PRACTICE. Run practice drill at Synthetic Test School'
- tapOn: 'DRILL — PRACTICE. Run practice drill at Synthetic Test School'
- assertVisible: 'DRILL — PRACTICE. This visual state is for a drill or synthetic test only.'
- assertVisible:
    id: 'issue-21-drill-event-type'
- assertVisible: 'DRILL — PRACTICE. Choose Synthetic earthquake drill'
- tapOn: 'DRILL — PRACTICE. Choose Synthetic earthquake drill'
- assertVisible: 'DRILL — PRACTICE. This visual state is for a drill or synthetic test only.'
- assertVisible: 'Synthetic earthquake drill at Synthetic Test School'
- scrollUntilVisible:
    element: 'DRILL — PRACTICE, Push notifications consequence'
    direction: DOWN
- assertVisible: 'DRILL — PRACTICE, Push notifications consequence'
- scrollUntilVisible:
    element: 'Title: \[DRILL\] Synthetic earthquake drill'
    direction: DOWN
- assertVisible: 'Title: \[DRILL\] Synthetic earthquake drill'
- scrollUntilVisible:
    element: 'Message: \[DRILL\] Synthetic recipients only\.'
    direction: DOWN
- assertVisible: 'Message: \[DRILL\] Synthetic recipients only\.'
- assertNotVisible: 'Title: \[INCIDENT\] Synthetic earthquake drill'
- scrollUntilVisible:
    element: 'DRILL — PRACTICE, Email consequence'
    direction: DOWN
- assertVisible: 'DRILL — PRACTICE, Email consequence'
- scrollUntilVisible:
    element: 'Integration: Mocked — training data only'
    direction: DOWN
- assertVisible: 'Integration: Mocked — training data only'
- scrollUntilVisible:
    element:
      id: 'issue-21-confirm-drill'
    direction: DOWN
- assertVisible:
    id: 'issue-21-confirm-drill'
- assertVisible: 'Start a separate DRILL — PRACTICE and record notification intents for 2 synthetic recipients'
- tapOn: 'Start a separate DRILL — PRACTICE and record notification intents for 2 synthetic recipients'
- extendedWaitUntil:
    visible:
      id: 'issue-21-activation-result'
    timeout: 15000
- assertVisible: 'Drill started'
- assertVisible: 'DRILL — PRACTICE. This visual state is for a drill or synthetic test only.'
- assertVisible: 'Synthetic earthquake drill'
- assertVisible: '.*durably accepted.*recorded its notification intent.*'
- scrollUntilVisible:
    element: '.*does not claim either one.*'
    direction: DOWN
- assertVisible: '.*does not claim either one.*'
