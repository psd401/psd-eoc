<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">iPhone TestFlight installation screen reference</title>
  <desc id="desc">Three illustrated iPhone screens show opening the approved invitation, accepting the TestFlight invitation, and installing PSD EOC.</desc>
  <rect width="960" height="560" fill="#f4f7fa"/>
  <text x="48" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17324d">Install PSD EOC with TestFlight</text>
  <text x="48" y="82" font-family="Arial, sans-serif" font-size="16" fill="#4c6275">Screen reference — Apple wording may vary by iOS version</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(48 112)">
      <rect width="250" height="390" rx="28" fill="#fff" stroke="#9cadbb" stroke-width="3"/>
      <rect x="80" y="12" width="90" height="10" rx="5" fill="#9cadbb"/>
      <text x="20" y="66" font-size="15" font-weight="700" fill="#17324d">1  Approved invitation</text>
      <rect x="20" y="92" width="210" height="116" rx="12" fill="#e8f0f7"/>
      <text x="36" y="122" font-size="14" font-weight="700" fill="#17324d">PSD EOC testing</text>
      <text x="36" y="150" font-size="13" fill="#334e62">Sent by District Technology</text>
      <rect x="36" y="170" width="132" height="28" rx="14" fill="#175a8e"/>
      <text x="52" y="189" font-size="12" font-weight="700" fill="#fff">Open TestFlight</text>
      <text x="20" y="242" font-size="13" fill="#334e62">Use only the invitation sent</text>
      <text x="20" y="262" font-size="13" fill="#334e62">through an approved district</text>
      <text x="20" y="282" font-size="13" fill="#334e62">channel.</text>
    </g>
    <g transform="translate(355 112)">
      <rect width="250" height="390" rx="28" fill="#fff" stroke="#9cadbb" stroke-width="3"/>
      <rect x="80" y="12" width="90" height="10" rx="5" fill="#9cadbb"/>
      <text x="20" y="66" font-size="15" font-weight="700" fill="#17324d">2  Accept in TestFlight</text>
      <circle cx="65" cy="127" r="34" fill="#17324d"/>
      <text x="44" y="137" font-size="26" font-weight="700" fill="#fff">EOC</text>
      <text x="112" y="120" font-size="18" font-weight="700" fill="#17324d">PSD EOC</text>
      <text x="112" y="145" font-size="13" fill="#4c6275">Private staff beta</text>
      <rect x="20" y="184" width="210" height="42" rx="21" fill="#175a8e"/>
      <text x="102" y="211" font-size="14" font-weight="700" fill="#fff">Accept</text>
      <text x="20" y="262" font-size="13" fill="#334e62">If the app name or sender is</text>
      <text x="20" y="282" font-size="13" fill="#334e62">different, stop and contact</text>
      <text x="20" y="302" font-size="13" fill="#334e62">District Technology.</text>
    </g>
    <g transform="translate(662 112)">
      <rect width="250" height="390" rx="28" fill="#fff" stroke="#9cadbb" stroke-width="3"/>
      <rect x="80" y="12" width="90" height="10" rx="5" fill="#9cadbb"/>
      <text x="20" y="66" font-size="15" font-weight="700" fill="#17324d">3  Install only</text>
      <circle cx="65" cy="127" r="34" fill="#17324d"/>
      <text x="44" y="137" font-size="26" font-weight="700" fill="#fff">EOC</text>
      <text x="112" y="120" font-size="18" font-weight="700" fill="#17324d">PSD EOC</text>
      <text x="112" y="145" font-size="13" fill="#4c6275">Version 1.0.12</text>
      <rect x="20" y="184" width="210" height="42" rx="21" fill="#175a8e"/>
      <text x="96" y="211" font-size="14" font-weight="700" fill="#fff">Install</text>
      <text x="20" y="262" font-size="13" fill="#334e62">Stop after Install unless</text>
      <text x="20" y="282" font-size="13" fill="#334e62">registration is separately</text>
      <text x="20" y="302" font-size="13" fill="#334e62">approved by District Technology.</text>
    </g>
  </g>
</svg>
